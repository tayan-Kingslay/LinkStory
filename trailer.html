<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Criar trailer · LinkStory</title>
<link rel="stylesheet" href="visual-system.css?v=4"><link rel="stylesheet" href="mobile.css?v=5"><link rel="stylesheet" href="at3-global.css?v=2"><link rel="stylesheet" href="visual-refresh.css?v=2">
<style>
:root{--tr-bg:#0b1220;--tr-card:#121b2b;--tr-line:#ffffff20;--tr-muted:#9aa9bc;--tr-blue:#1976d2}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--tr-bg);color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:12px 15px;background:#0b1220ed;border-bottom:1px solid var(--tr-line);backdrop-filter:blur(14px)}
header a,button{min-height:42px;border:1px solid var(--tr-line);border-radius:11px;background:#ffffff0b;color:#fff;padding:9px 13px;text-decoration:none;font-weight:800}
header strong{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{width:min(900px,calc(100% - 24px));margin:18px auto 60px}
.card{padding:16px;margin-bottom:13px;border:1px solid var(--tr-line);border-radius:17px;background:var(--tr-card)}
h1{font-size:24px;margin:0 0 7px}p{font-size:13px;line-height:1.55;color:#bdc8d7;margin:0}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
button.primary{background:var(--tr-blue);border-color:var(--tr-blue)}
button:disabled{opacity:.45}
.status{min-height:20px;margin-top:10px;color:var(--tr-muted);font-size:12px}
.scenes{display:grid;gap:10px;margin-top:12px}
.scene{display:grid;grid-template-columns:110px 1fr;gap:12px;padding:10px;border:1px solid var(--tr-line);border-radius:13px;background:#ffffff05}
.scene canvas{width:110px;aspect-ratio:9/16;object-fit:cover;background:#05080d;border-radius:8px}
.scene strong{font-size:13px}.scene small{display:block;color:var(--tr-muted);font-size:11px;line-height:1.4;margin-top:5px}
.scene .actions{margin-top:8px}.scene button{min-height:34px;padding:6px 9px;font-size:11px}
.preview{display:none;width:min(100%,360px);margin:14px auto 0;aspect-ratio:9/16;background:#05080d;border-radius:15px;overflow:hidden}
.preview.show{display:block}.preview video{width:100%;height:100%;object-fit:contain}
@media(max-width:480px){.scene{grid-template-columns:86px 1fr}.scene canvas{width:86px}h1{font-size:21px}}
</style></head>
<body>
<header><a href="studio.html" aria-label="Voltar ao Estúdio">‹</a><strong id="pageTitle">Trailer da obra</strong></header>
<main>
<section class="card">
<h1>Trailer da sua obra</h1>
<p>A IA seleciona momentos dos capítulos já publicados. Você pode retirar ou reorganizar cenas antes de montar o vídeo. A arte original é preservada; o trailer é uma composição para divulgação.</p>
<div class="actions"><button class="primary" id="makePlan">✦ Selecionar melhores momentos</button></div>
<div class="status" id="status" role="status" aria-live="polite">Carregando obra…</div>
</section>
<section class="card" id="planCard" hidden>
<h1 id="trailerTitle">Prévia do trailer</h1><p id="trailerHook"></p>
<div class="scenes" id="sceneList"></div>
<div class="actions"><button class="primary" id="renderTrailer">Montar trailer</button></div>
<div class="status" id="renderStatus"></div>
<div class="preview" id="previewBox"><video id="previewVideo" controls playsinline></video></div>
<div class="actions" id="exportActions" hidden><a id="downloadTrailer" href="#" download style="display:inline-flex;align-items:center;min-height:42px;border-radius:11px;padding:9px 13px;background:#1976d2;color:#fff;text-decoration:none;font-weight:850">Baixar para divulgação</a><button class="primary" id="publishFeed">Publicar no Feed do LinkStory</button></div>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js"></script><script src="manga-db.js"></script>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),q=new URLSearchParams(location.search),mangaId=q.get('manga_id');
let manga=null,session=null,plan=null,blob=null,blobUrl=null,selected=[],publishing=false;
function status(message){$('status').textContent=message}
function escapeText(v){return String(v||'')}
async function ai(payload){const s=await linkstorySupabase.auth.getSession(),token=s.data?.session?.access_token;if(!token)throw Error('Entre novamente na sua conta.');const response=await fetch('/api/experience-ai',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({...payload,mangaId:manga.id})});const data=await response.json().catch(()=>({}));if(!response.ok)throw Error(data.error||'Não foi possível montar o plano.');return data}
function sceneCanvas(scene,canvas){const ctx=canvas.getContext('2d'),img=new Image();img.crossOrigin='anonymous';img.onload=()=>{ctx.fillStyle='#05080d';ctx.fillRect(0,0,canvas.width,canvas.height);const sx=scene.panelImageUrl?0:scene.x*img.naturalWidth,sy=scene.panelImageUrl?0:scene.y*img.naturalHeight,sw=scene.panelImageUrl?img.naturalWidth:scene.width*img.naturalWidth,sh=scene.panelImageUrl?img.naturalHeight:scene.height*img.naturalHeight,scale=Math.min(canvas.width/sw,canvas.height/sh),w=sw*scale,h=sh*scale;ctx.drawImage(img,sx,sy,sw,sh,(canvas.width-w)/2,(canvas.height-h)/2,w,h)};img.onerror=()=>{ctx.fillStyle='#05080d';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#fff';ctx.fillText('Prévia indisponível',10,25)};img.src=scene.panelImageUrl||scene.pageImageUrl}
function renderScenes(){const list=$('sceneList');list.replaceChildren();selected.forEach((scene,index)=>{const card=document.createElement('article');card.className='scene';const canvas=document.createElement('canvas');canvas.width=360;canvas.height=640;sceneCanvas(scene,canvas);const info=document.createElement('div'),title=document.createElement('strong');title.textContent=(index+1)+'. '+(scene.chapterTitle||('Capítulo '+scene.chapterNumber))+' · Página '+scene.pageNumber+' · Quadro '+scene.panelIndex;const reason=document.createElement('small');reason.textContent=scene.reason||scene.description||'Momento escolhido pela IA';const caption=document.createElement('small');caption.textContent='Texto do trailer: '+(scene.caption||'');const actions=document.createElement('div');actions.className='actions';const up=document.createElement('button');up.textContent='↑';up.disabled=index===0;up.onclick=()=>{selected.splice(index-1,0,selected.splice(index,1)[0]);renderScenes()};const down=document.createElement('button');down.textContent='↓';down.disabled=index===selected.length-1;down.onclick=()=>{selected.splice(index+1,0,selected.splice(index,1)[0]);renderScenes()};const remove=document.createElement('button');remove.textContent='Remover';remove.onclick=()=>{selected.splice(index,1);renderScenes()};actions.append(up,down,remove);info.append(title,reason,caption,actions);card.append(canvas,info);list.append(card)})}
async function load(){try{if(!mangaId)throw Error('Obra não informada.');session=await LinkStoryManga.session();if(!session)throw Error('Entre na sua conta para criar um trailer.');manga=await LinkStoryManga.mangaById(mangaId);if(!manga||manga.creator_id!==session.user.id)throw Error('Somente o autor pode criar o trailer.');if(manga.publication_mode!=='experience'||manga.status!=='published')throw Error('O trailer fica disponível para obras publicadas no Modo Melhor Experiência.');$('pageTitle').textContent=manga.title;$('makePlan').disabled=false;status('Obra pronta. Selecione os melhores momentos para o trailer.')}catch(e){status(e.message||'Não foi possível abrir o criador de trailer.');$('makePlan').disabled=true}}
$('makePlan').onclick=async()=>{const button=$('makePlan');button.disabled=true;status('A IA está escolhendo os momentos mais fortes…');try{const chapters=await LinkStoryManga.chapters(manga.id);let first=null;for(const ch of chapters){if(ch.review_status!=='published')continue;const full=await LinkStoryManga.chapterWithPages(ch.id);if(full?.pages?.length){first={chapter:ch,page:full.pages[0]};break}}if(!first)throw Error('Publique e aprove pelo menos um capítulo com quadros organizados.');plan=await ai({action:'trailer-plan',chapterId:first.chapter.id,pageId:first.page.id});selected=plan.scenes.slice();$('planCard').hidden=false;$('trailerTitle').textContent=plan.title;$('trailerHook').textContent=plan.hook;renderScenes();status('A IA selecionou '+selected.length+' momentos. Revise a sequência antes de montar o vídeo.')}catch(e){status(e.message||'Não foi possível selecionar as cenas.')}finally{button.disabled=false}};
function loadImage(url){return new Promise((resolve,reject)=>{const img=new Image();img.crossOrigin='anonymous';img.onload=()=>resolve(img);img.onerror=()=>reject(Error('Uma imagem do trailer não pôde ser carregada.'));img.src=url})}
function coverDraw(ctx,source,sourceRect,canvas,zoom){const [sx,sy,sw,sh]=sourceRect;const scale=Math.max(canvas.width/sw,canvas.height/sh)*zoom,w=sw*scale,h=sh*scale;ctx.fillStyle='#05080d';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(source,sx,sy,sw,sh,(canvas.width-w)/2,(canvas.height-h)/2,w,h)}
function overlay(ctx,headline,subline,caption){const w=ctx.canvas.width,h=ctx.canvas.height;const grad=ctx.createLinearGradient(0,h*.55,0,h);grad.addColorStop(0,'rgba(0,0,0,0)');grad.addColorStop(1,'rgba(0,0,0,.82)');ctx.fillStyle=grad;ctx.fillRect(0,h*.45,w,h*.55);ctx.textAlign='center';ctx.fillStyle='#fff';ctx.shadowColor='#000';ctx.shadowBlur=12;if(headline){ctx.font='bold 54px sans-serif';ctx.fillText(headline.slice(0,36),w/2,110,w-70)}if(subline){ctx.font='28px sans-serif';ctx.fillText(subline.slice(0,64),w/2,h-175,w-70)}if(caption){ctx.font='bold 32px sans-serif';ctx.fillText(caption.slice(0,70),w/2,h-90,w-70)}ctx.shadowBlur=0}
async function renderTrailer(){if(selected.length<3)throw Error('Mantenha pelo menos três cenas no trailer.');const canvas=document.createElement('canvas');canvas.width=720;canvas.height=1280;const ctx=canvas.getContext('2d');const stream=canvas.captureStream(30);let audioContext=null;const mimeTypes=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4','video/webm;codecs=vp9','video/webm'];const mimeType=mimeTypes.find(type=>MediaRecorder.isTypeSupported(type))||'';if(typeof MediaRecorder==='undefined')throw Error('Este navegador não oferece gravação de vídeo. Abra o LinkStory no Safari atualizado ou em um navegador compatível.');if(!mimeType)throw Error('Este navegador não oferece um formato de vídeo compatível para exportação.');try{audioContext=new(window.AudioContext||window.webkitAudioContext)();await audioContext.resume();const destination=audioContext.createMediaStreamDestination();stream.addTrack(destination.stream.getAudioTracks()[0]);const recorder=new MediaRecorder(stream,{mimeType});const chunks=[];recorder.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};const stopped=new Promise(resolve=>recorder.onstop=resolve);recorder.start(250);
const drawTitle=()=>{ctx.fillStyle='#070b13';ctx.fillRect(0,0,720,1280);ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 58px sans-serif';ctx.fillText(plan.title.slice(0,28),360,540,620);ctx.font='28px sans-serif';ctx.fillStyle='#c7d7ef';ctx.fillText(plan.hook.slice(0,56),360,625,620)};
const hold=(duration,draw)=>new Promise(resolve=>{const start=performance.now();function frame(now){draw(Math.min(1,(now-start)/(duration*1000)));if(now-start<duration*1000)requestAnimationFrame(frame);else resolve()}requestAnimationFrame(frame)});
await hold(1.8,drawTitle);
for(let i=0;i<selected.length;i++){const scene=selected[i];let source=null,isVideo=false;try{if(scene.videoUrl){source=document.createElement('video');source.crossOrigin='anonymous';source.muted=true;source.playsInline=true;source.loop=true;source.src=scene.videoUrl;await new Promise((resolve,reject)=>{source.onloadeddata=resolve;source.onerror=()=>reject(Error('Vídeo indisponível'));source.load()});isVideo=true;await source.play().catch(()=>{})}else{source=await loadImage(scene.panelImageUrl||scene.pageImageUrl)}}catch(error){if(isVideo||scene.videoUrl){source=await loadImage(scene.panelImageUrl||scene.pageImageUrl);isVideo=false}else throw error}
let audioElements=[];for(const url of [scene.audioUrl,scene.soundUrl]){if(!url)continue;const audio=new Audio();audio.crossOrigin='anonymous';audio.src=url;const node=audioContext.createMediaElementSource(audio);node.connect(destination);audioElements.push(audio);audio.play().catch(()=>{})}
const rect=scene.panelImageUrl||isVideo?[0,0,source.videoWidth||source.naturalWidth,source.videoHeight||source.naturalHeight]:[scene.x*source.naturalWidth,scene.y*source.naturalHeight,scene.width*source.naturalWidth,scene.height*source.naturalHeight];
await hold(scene.duration||3.5,t=>{if(isVideo)coverDraw(ctx,source,[0,0,source.videoWidth,source.videoHeight],canvas,1.02+t*.035);else coverDraw(ctx,source,rect,canvas,1.02+t*.035);overlay(ctx,i===0?plan.title:'', '',scene.caption||'')});
audioElements.forEach(a=>{a.pause();a.src='' });if(isVideo)source.pause()}
await hold(1.7,()=>{ctx.fillStyle='#070b13';ctx.fillRect(0,0,720,1280);ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 52px sans-serif';ctx.fillText('Leia agora no LinkStory',360,620,650);ctx.font='26px sans-serif';ctx.fillStyle='#c7d7ef';ctx.fillText(manga.title.slice(0,40),360,690,640)});
recorder.stop();await stopped;stream.getTracks().forEach(t=>t.stop());await audioContext.close();blob=new Blob(chunks,{type:recorder.mimeType||mimeType});if(!blob.size)throw Error('O vídeo ficou vazio. Tente novamente.');if(blobUrl)URL.revokeObjectURL(blobUrl);blobUrl=URL.createObjectURL(blob);$('previewVideo').src=blobUrl;$('previewBox').classList.add('show');$('downloadTrailer').href=blobUrl;$('downloadTrailer').download='linkstory-trailer-'+manga.id+'.'+(blob.type.includes('mp4')?'mp4':'webm');$('exportActions').hidden=false;$('renderStatus').textContent='Trailer pronto para sua revisão. Assista antes de baixar ou publicar.';return blob}catch(error){stream.getTracks().forEach(t=>t.stop());if(audioContext)await audioContext.close().catch(()=>{});throw error}}
$('renderTrailer').onclick=async()=>{const b=$('renderTrailer');b.disabled=true;$('renderStatus').textContent='Montando vídeo… mantenha esta página aberta.';$('exportActions').hidden=true;try{await renderTrailer()}catch(e){$('renderStatus').textContent=e.message||'Falha ao montar o trailer.'}finally{b.disabled=false}};
$('publishFeed').onclick=async()=>{if(!blob||publishing)return;if(!confirm('Publicar este trailer no Feed do LinkStory?'))return;publishing=true;const b=$('publishFeed');b.disabled=true;b.textContent='Publicando…';try{const ext=blob.type.includes('mp4')?'mp4':'webm',path='posts/'+session.user.id+'/linkstory-trailer-'+manga.id+'-'+Date.now()+'.'+ext;const upload=await linkstorySupabase.storage.from('linkstory-media').upload(path,blob,{contentType:blob.type,upsert:false});if(upload.error)throw upload.error;const mediaUrl=linkstorySupabase.storage.from('linkstory-media').getPublicUrl(path).data.publicUrl;const post=await linkstorySupabase.from('posts').insert({author_id:session.user.id,body:plan.title+' — '+plan.hook,post_type:'video',media_url:mediaUrl,media_type:blob.type,thumbnail_url:manga.cover_url||null}).select('id').single();if(post.error)throw post.error;$('renderStatus').textContent='Trailer publicado no Feed do LinkStory!';b.textContent='Publicado'}catch(e){$('renderStatus').textContent='Não foi possível publicar no Feed: '+(e.message||'tente novamente.');b.disabled=false;b.textContent='Publicar no Feed do LinkStory'}finally{publishing=false}};
load();
})();
</script></body></html>
