<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b72e7"><title>Entrar — LinkStory</title><style>:root{--blue:#0b72e7;--ink:#102033;--muted:#66788d;--line:#dbe5ef;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}*{box-sizing:border-box}body{margin:0;background:#fff}a{text-decoration:none;color:inherit}.topbar{height:72px;display:flex;align-items:center;gap:14px;padding:0 max(18px,calc((100vw - 1120px)/2));border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:10}.back,.menu-btn{width:42px;height:42px;border:1px solid var(--line);background:#fff;border-radius:50%;display:grid;place-items:center}.back{font-size:25px}.menu-btn{margin-left:auto;font-size:23px}.logo{font-size:26px;font-weight:950;letter-spacing:-1.8px}.logo b{color:var(--blue)}main{min-height:calc(100vh - 72px);display:grid;place-items:center;padding:50px 18px 80px}.login-box{width:min(430px,100%);text-align:center}.eyebrow{font-size:11px;font-weight:900;letter-spacing:2.5px;color:var(--blue)}h1{font-size:clamp(40px,7vw,56px);letter-spacing:-3px;margin:12px 0 10px}.intro{font-size:14px;line-height:1.6;color:var(--muted);margin:0 auto 30px;max-width:350px}.form{text-align:left;border:1px solid var(--line);border-radius:18px;padding:24px;background:#fff;box-shadow:0 18px 45px #1020330f}label{display:block;font-size:12px;font-weight:900;margin:0 0 7px}input{width:100%;height:48px;border:1px solid var(--line);border-radius:10px;padding:0 13px;font:inherit;outline:none;background:#fff;margin-bottom:16px}button.primary{width:100%;height:48px;border:0;border-radius:10px;background:var(--blue);color:#fff;font:inherit;font-size:13px;font-weight:900}.divider{display:flex;align-items:center;gap:12px;color:#8b9bad;font-size:11px;margin:20px 0}.divider:before,.divider:after{content:"";height:1px;background:var(--line);flex:1}.google{width:100%;height:4
