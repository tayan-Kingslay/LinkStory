<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f9fc"><title>Notificações — LinkStory</title>
<link rel="stylesheet" href="visual-system.css?v=4">
<link rel="stylesheet" href="at3-global.css?v=2"><link rel="stylesheet" href="visual-refresh.css?v=2">
<style>
:root{--blue:#0b72e7;--ink:#15243a;--muted:#7b8a9d;--line:#e4ebf3}
*{box-sizing:border-box}body{margin:0;background:#f6f8fc;color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{height:66px;display:flex;align-items:center;padding:0 18px;background:#fff;border-bottom:1px solid var(--line)}.logo{font-size:22px;font-weight:950;letter-spacing:-1px;text-decoration:none;color:var(--ink)}.logo b{color:var(--blue)}
main{width:min(760px,calc(100% - 28px));margin:28px auto 100px}.head{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:18px}.ey{font-size:10px;letter-spacing:2px;font-weight:900;color:var(--blue)}h1{font-size:38px;letter-spacing:-1.8px;margin:5px 0}.muted{color:var(--muted);font-size:13px}.readall{border:1px solid var(--line);border-radius:11px;background:#fff;padding:10px 13px;font-weight:800;color:var(--blue)}
.filters{display:flex;gap:8px;overflow:auto;margin:0 0 18px}.filter{white-space:nowrap;border:1px solid var(--line);border-radius:999px;background:#fff;padding:10px 15px;font-weight:800;color:var(--ink)}.filter.active{background:#eaf3ff;border-color:#d6e8ff;color:var(--blue)}.group-title{font-size:15px;font-weight:900;margin:20px 4px 9px}.panel{background:#fff;border:1px solid var(--line);border-radius:19px;overflow:hidden;box-shadow:0 8px 28px #15243a08}.notice{display:flex;align-items:center;gap:13px;padding:16px;border-bottom:1px solid #eef2f6;text-decoration:none;color:inherit}.notice:last-child{border-bottom:0}.notice.unread{background:#f3f8ff}.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;background:#eaf3ff;color:var(--blue);font-weight:900;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.copy{flex:1;min-width:0}.copy strong{font-size:13px}.copy p{margin:4px 0;color:#64758a;font-size:12px;line-height:1.5}.copy time{font-size:10px;color:#98a5b4}.dot{width:8px;height:8px;border-radius:50%;background:var(--blue);flex:none}.empty{padding:58px 20px;text-align:center;color:var(--muted);font-size:13px}.empty strong{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}
@media(max-width:600px){main{margin-top:20px}.head{align-items:flex-end}h1{font-size:33px}.notice{padding:14px 12px;gap:10px}.avatar{width:40px;height:40px}}
</style></head><body><header><a class="logo" href="index.html">Link<b>Story</b></a></header>
<main><div class="head"><div><span class="ey">CENTRAL DE ATIVIDADES</span><h1>Notificações</h1><div class="muted" id="summary">Veja o que está acontecendo na sua comunidade.</div></div><button class="readall" id="readAll">Marcar tudo como lido</button></div>
<nav class="filters" aria-label="Filtros de notificações"><button class="filter active" data-filter="all">Tudo</button><button class="filter" data-filter="following">Pessoas que você segue</button><button class="filter" data-filter="comment">Comentários</button></nav>
<div id="highlights"></div><section class="panel" id="feed"><div class="empty">Carregando suas notificações…</div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js"></script><script src="verification.js?v=1"></script><script src="global-nav.js"></script>
<script>
(async()=>{
 const $=id=>document.getElementById(id),db=linkstorySupabase;let rows=[],filter='all',following=new Set(),user=null;
 const time=v=>new Date(v).toLocaleString('pt-BR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
 const feed=$('feed'),high=$('highlights');
 function label(n){const actor=n.actor?.display_name||n.actor?.username||'Alguém';if(n.type==='friend_request')return actor+' quer ser seu amigo.';if(n.type==='friend_accepted')return actor+' aceitou sua solicitação de amizade.';if(n.type==='new_manga')return n.body||actor+' publicou um novo mangá.';if(n.type==='message')return actor+' enviou uma mensagem.';if(n.type==='follow')return actor+' começou a seguir você.';if(n.type==='like')return actor+' curtiu sua publicação.';if(n.type==='comment')return actor+' comentou sua publicação.';return n.body||'Você tem uma nova atualização do LinkStory.'}
 function destination(n){if(n.type==='message')return 'messages.html';if(n.type==='friend_request'||n.type==='friend_accepted')return 'friends.html';if(n.manga_id)return 'manga.html?id='+encodeURIComponent(n.manga_id);if(n.post_id)return 'index.html#post-'+encodeURIComponent(n.post_id);return n.target_url||'friends.html'}
 function make(n){const a=document.createElement('div');a.className='notice'+(!n.read_at?' unread':'');a.style.cursor='pointer';a.onclick=async()=>{if(!n.read_at)await db.from('notifications').update({read_at:new Date().toISOString()}).eq('id',n.id);location.href=destination(n)};const av=document.createElement('span');av.className='avatar';if(n.actor?.avatar_url){const img=document.createElement('img');img.src=n.actor.avatar_url;img.alt='';av.append(img)}else av.textContent=(n.actor?.display_name||n.actor?.username||'L')[0].toUpperCase();const copy=document.createElement('span');copy.className='copy';const strong=document.createElement('strong');strong.textContent=n.actor?.display_name||n.actor?.username||'LinkStory';if(window.LinkStoryVerification)LinkStoryVerification.decorate(strong,n.actor?.verification_type);const p=document.createElement('p');p.textContent=label(n);const t=document.createElement('time');t.textContent=time(n.created_at);copy.append(strong,p,t);a.append(av,copy);if(n.type==='follow'&&n.actor_id){const back=document.createElement('button');back.className='readall';back.textContent='Seguir de volta';back.onclick=async e=>{e.stopPropagation();back.disabled=true;const result=await db.from('follows').insert({follower_id:user.id,following_id:n.actor_id});if(result.error&&result.error.code!=='23505'){back.disabled=false;back.textContent='Tentar novamente';return}back.textContent='Seguindo';following.add(n.actor_id)};a.append(back)}if(!n.read_at){const dot=document.createElement('i');dot.className='dot';a.append(dot)}return a}
 function render(){let visible=rows;if(filter==='following')visible=rows.filter(n=>following.has(n.actor_id));if(filter==='comment')visible=rows.filter(n=>n.type==='comment');feed.replaceChildren();high.replaceChildren();if(!visible.length){const e=document.createElement('div');e.className='empty';e.innerHTML='<strong>Nenhuma atividade por aqui.</strong>Quando houver novidades, elas aparecerão nesta página.';feed.append(e);return}
 const highlights=visible.filter(n=>!n.read_at).slice(0,3);if(highlights.length){const h=document.createElement('div');h.className='group-title';h.textContent='Destaques';high.append(h);const panel=document.createElement('section');panel.className='panel';highlights.forEach(n=>panel.append(make(n)));high.append(panel)}
 const today=new Date().toDateString(),groups=new Map();visible.filter(n=>!highlights.includes(n)).forEach(n=>{const key=new Date(n.created_at).toDateString()===today?'Hoje':'Anteriores';if(!groups.has(key))groups.set(key,[]);groups.get(key).push(n)});
 groups.forEach((items,key)=>{const h=document.createElement('div');h.className='group-title';h.textContent=key;const panel=document.createElement('section');panel.className='panel';items.forEach(n=>panel.append(make(n)));feed.append(h,panel)});
 }
 async function load(){const s=await db.auth.getSession();user=s.data.session?.user;if(!user){location.href='login.html?next=notifications.html';return}
 const [r,f]=await Promise.all([db.from('notifications').select('id,type,actor_id,body,target_url,created_at,read_at,manga_id,friend_request_id,message_id,post_id').order('created_at',{ascending:false}).limit(100),db.from('follows').select('following_id').eq('follower_id',user.id)]);
 if(r.error)throw r.error;if(f.error)throw f.error;rows=r.data||[];following=new Set((f.data||[]).map(x=>x.following_id));
 const ids=[...new Set(rows.map(x=>x.actor_id).filter(Boolean))];let people={};if(ids.length){const p=await db.from('profiles').select('id,username,display_name,avatar_url,verification_type').in('id',ids);if(p.error)throw p.error;people=Object.fromEntries((p.data||[]).map(x=>[x.id,x]))}
 rows=rows.map(x=>({...x,actor:people[x.actor_id]}));const unread=rows.filter(x=>!x.read_at).length;$('summary').textContent=unread?unread+' não lida(s) · '+rows.length+' atividade(s)':'Tudo em dia · '+rows.length+' atividade(s)';render()}
 document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));render()});
 $('readAll').onclick=async()=>{const ids=rows.filter(x=>!x.read_at).map(x=>x.id);if(!ids.length)return;const r=await db.from('notifications').update({read_at:new Date().toISOString()}).in('id',ids);if(r.error)throw r.error;await load()};
 await load();
})().catch(e=>{const f=document.getElementById('feed');if(f)f.innerHTML='<div class="empty"><strong>Não foi possível carregar.</strong>'+String(e.message||'Tente novamente.')+'</div>'});
</script></body></html>
