<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f9fc"><title>Notificações — LinkStory</title>
<link rel="stylesheet" href="visual-system.css?v=3"><link rel="stylesheet" href="visual-refresh.css?v=1">
<style>
:root{--blue:#0b72e7;--ink:#15243a;--muted:#7b8a9d;--line:#e4ebf3}
*{box-sizing:border-box}body{margin:0;background:#f6f8fc;color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{height:66px;display:flex;align-items:center;padding:0 18px;background:#fff;border-bottom:1px solid var(--line)}.logo{font-size:22px;font-weight:950;letter-spacing:-1px;text-decoration:none;color:var(--ink)}.logo b{color:var(--blue)}
main{width:min(760px,calc(100% - 28px));margin:28px auto 100px}.head{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:18px}.ey{font-size:10px;letter-spacing:2px;font-weight:900;color:var(--blue)}h1{font-size:38px;letter-spacing:-1.8px;margin:5px 0}.muted{color:var(--muted);font-size:13px}.readall{border:1px solid var(--line);border-radius:11px;background:#fff;padding:10px 13px;font-weight:800;color:var(--blue)}
.panel{background:#fff;border:1px solid var(--line);border-radius:19px;overflow:hidden;box-shadow:0 8px 28px #15243a08}.notice{display:flex;align-items:center;gap:13px;padding:16px;border-bottom:1px solid #eef2f6;text-decoration:none;color:inherit}.notice:last-child{border-bottom:0}.notice.unread{background:#f3f8ff}.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;background:#eaf3ff;color:var(--blue);font-weight:900;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.copy{flex:1;min-width:0}.copy strong{font-size:13px}.copy p{margin:4px 0;color:#64758a;font-size:12px;line-height:1.5}.copy time{font-size:10px;color:#98a5b4}.dot{width:8px;height:8px;border-radius:50%;background:var(--blue);flex:none}.empty{padding:58px 20px;text-align:center;color:var(--muted);font-size:13px}.empty strong{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}
@media(max-width:600px){main{margin-top:20px}.head{align-items:flex-end}h1{font-size:33px}.notice{padding:14px 12px;gap:10px}.avatar{width:40px;height:40px}}
</style></head><body><header><a class="logo" href="index.html">Link<b>Story</b></a></header>
<main><div class="head"><div><span class="ey">CENTRAL DE ATIVIDADES</span><h1>Notificações</h1><div class="muted" id="summary">Veja o que está acontecendo na sua comunidade.</div></div><button class="readall" id="readAll">Marcar tudo como lido</button></div>
<section class="panel" id="feed"><div class="empty">Carregando suas notificações…</div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js"></script><script src="global-nav.js"></script>
<script>
(async()=>{
 const $=id=>document.getElementById(id),db=linkstorySupabase;
 const time=v=>new Date(v).toLocaleString('pt-BR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
 const safe=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const feed=$('feed');let rows=[];
 function label(n){const actor=n.actor?.display_name||n.actor?.username||'Alguém';if(n.type==='friend_request')return actor+' quer ser seu amigo.';if(n.type==='friend_accepted')return actor+' aceitou sua solicitação de amizade.';if(n.type==='new_manga')return n.body||actor+' publicou um novo mangá.';if(n.type==='message')return actor+' enviou uma mensagem.';if(n.type==='follow')return actor+' começou a seguir você.';if(n.type==='like')return actor+' curtiu sua publicação.';if(n.type==='comment')return actor+' comentou sua publicação.';return n.body||'Você tem uma nova atualização do LinkStory.'}
 async function load(){
  const r=await db.from('notifications').select('id,type,actor_id,body,target_url,created_at,read_at,manga_id,friend_request_id,message_id').order('created_at',{ascending:false}).limit(80);
  if(r.error)throw r.error;rows=r.data||[];
  const ids=[...new Set(rows.map(x=>x.actor_id).filter(Boolean))];
  let people={};if(ids.length){const p=await db.from('profiles').select('id,username,display_name,avatar_url').in('id',ids);if(p.error)throw p.error;people=Object.fromEntries((p.data||[]).map(x=>[x.id,x]))}
  rows=rows.map(x=>({...x,actor:people[x.actor_id]}));
  const unread=rows.filter(x=>!x.read_at).length;$('summary').textContent=unread?unread+' não lida(s) · '+rows.length+' atividade(s)':'Tudo em dia · '+rows.length+' atividade(s)';
  feed.replaceChildren();
  if(!rows.length){const e=document.createElement('div');e.className='empty';e.innerHTML='<strong>Seu LinkStory está tranquilo.</strong>Quando alguém enviar uma solicitação, conversar ou publicar algo novo, você verá aqui.';feed.append(e);return}
  rows.forEach(n=>{const a=document.createElement('a');a.className='notice'+(!n.read_at?' unread':'');a.href=n.target_url||'friends.html';const av=document.createElement('span');av.className='avatar';if(n.actor?.avatar_url){const img=document.createElement('img');img.src=n.actor.avatar_url;img.alt='';av.append(img)}else av.textContent=(n.actor?.display_name||n.actor?.username||'L')[0].toUpperCase();const copy=document.createElement('span');copy.className='copy';const strong=document.createElement('strong');strong.textContent=n.actor?.display_name||n.actor?.username||'LinkStory';const p=document.createElement('p');p.textContent=label(n);const t=document.createElement('time');t.textContent=time(n.created_at);copy.append(strong,p,t);a.append(av,copy);if(!n.read_at){const dot=document.createElement('i');dot.className='dot';a.append(dot)}a.onclick=async()=>{if(!n.read_at)await db.from('notifications').update({read_at:new Date().toISOString()}).eq('id',n.id)};feed.append(a)});
 }
 $('readAll').onclick=async()=>{const ids=rows.filter(x=>!x.read_at).map(x=>x.id);if(!ids.length)return;if(!confirm('Marcar todas as notificações como lidas?'))return;const r=await db.from('notifications').update({read_at:new Date().toISOString()}).in('id',ids);if(r.error)throw r.error;await load()};
 const s=await db.auth.getSession();if(!s.data.session){location.href='login.html?next=notifications.html';return}
 await load();
})().catch(e=>{const f=document.getElementById('feed');if(f)f.innerHTML='<div class="empty"><strong>Não foi possível carregar.</strong>'+String(e.message||'Tente novamente.')+'</div>'});
</script></body></html>
