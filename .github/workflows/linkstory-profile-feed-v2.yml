name: LinkStory Profile + Feed V2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[profile-feed-v2]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply profile and feed improvements
        run: |
          set -e
          cat >> app.js <<'EOF'

/* LINKSTORY_PROFILE_FEED_V2 */
(function(){
  if(window.__LS_PROFILE_FEED_V2)return; window.__LS_PROFILE_FEED_V2=true;
  const q=s=>document.querySelector(s), qa=s=>document.querySelectorAll(s);
  const esc2=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
  function modalBox(){return q('#editProfileModal .modal-box')}
  function addRemoveAvatar(){
    const box=modalBox(); if(!box||q('#removeAvatarBtn'))return;
    const b=document.createElement('button'); b.id='removeAvatarBtn'; b.type='button'; b.className='outline full danger-action'; b.textContent='Remover foto de perfil';
    const save=q('#saveProfileBtn'); save?.parentNode?.insertBefore(b,save);
    b.onclick=async()=>{if(!window.user)return; try{const r=await window.sb.from('profiles').update({avatar_url:null}).eq('id',window.user.id);if(r.error)throw r.error;window.profile&&(window.profile.avatar_url=null);if(typeof window.loadProfile==='function')await window.loadProfile();if(typeof window.renderProfile==='function')await window.renderProfile();toast('Foto de perfil removida.');}catch(e){toast(e.message||'Não foi possível remover a foto.')}}
  }
  document.addEventListener('click',e=>{
    if(e.target.closest('#profileEditTop,#profileAvatar'))setTimeout(addRemoveAvatar,30);
  },true);
  const observer=new MutationObserver(addRemoveAvatar); observer.observe(document.body,{childList:true,subtree:true});
  function profileId(el){return el?.dataset?.post||el?.dataset?.profilePost||el?.dataset?.id||el?.querySelector?.('[data-post]')?.dataset?.post||null}
  async function deleteProfilePost(id,host){
    if(!window.user||!id)return;
    if(!confirm('Remover esta publicação do seu perfil?'))return;
    const r=await window.sb.from('posts').delete().eq('id',id).eq('author_id',window.user.id);
    if(r.error){toast('Não foi possível remover: '+r.error.message);return}
    host?.remove();
    if(typeof window.renderProfile==='function')await window.renderProfile();
    toast('Publicação removida.');
  }
  document.addEventListener('contextmenu',e=>{
    if(!q('#profile')?.classList.contains('active'))return;
    const host=e.target.closest('#profileGrid [data-post],#profileGrid [data-profile-post],#profileGrid .profile-grid-item,#profileGrid article,#profileGrid button');
    const id=profileId(host); if(!host||!id||!window.user)return;
    e.preventDefault();
    const old=q('#profilePostActions');old?.remove();
    const menu=document.createElement('div');menu.id='profilePostActions';menu.className='profile-post-actions';menu.innerHTML='<button type="button" id="profilePostDelete">🗑 Remover publicação</button>';
    document.body.appendChild(menu); menu.style.left=Math.min(e.clientX,innerWidth-210)+'px';menu.style.top=Math.min(e.clientY,innerHeight-70)+'px';
    q('#profilePostDelete').onclick=()=>{menu.remove();deleteProfilePost(id,host)};
    setTimeout(()=>document.addEventListener('click',()=>menu.remove(),{once:true}),0);
  });
  /* Prevent accidental navigation from profile media. Open a local viewer instead. */
  document.addEventListener('click',e=>{
    if(!q('#profile')?.classList.contains('active'))return;
    const host=e.target.closest('#profileGrid [data-post],#profileGrid [data-profile-post],#profileGrid .profile-grid-item,#profileGrid article');
    if(!host)return;
    const id=profileId(host); if(!id)return;
    const media=e.target.closest('img,video'); if(!media)return;
    e.preventDefault();e.stopPropagation();
    const src=media.currentSrc||media.src;if(!src)return;
    const m=document.createElement('div');m.className='modal profile-local-viewer';m.innerHTML='<div class="modal-box wide"><button class="close" type="button">×</button>'+ (media.tagName==='VIDEO'?'<video controls autoplay class="profile-local-media" src="'+esc2(src)+'"></video>':'<img class="profile-local-media" src="'+esc2(src)+'" alt="Publicação">') +'<div class="profile-local-caption">Publicação do seu perfil</div></div>';
    document.body.appendChild(m);m.querySelector('.close').onclick=()=>m.remove();m.onclick=x=>{if(x.target===m)m.remove()};
  },true);
  /* Make the profile stats actionable even when empty. */
  document.addEventListener('click',e=>{
    const b=e.target.closest('#statFollowing'); if(!b||!q('#profile')?.classList.contains('active'))return;
    e.preventDefault();e.stopPropagation();
    const m=document.createElement('div');m.className='modal profile-following-modal';m.innerHTML='<div class="modal-box"><button class="close" type="button">×</button><span class="eyebrow">SUA REDE</span><h2>Seguindo</h2><p class="muted">'+(Number(b.textContent||0)?'As pessoas que você segue aparecerão aqui.':'Você ainda não segue ninguém.')+'</p><button class="primary full" type="button" id="exploreFollowing">Explorar criadores</button></div>';document.body.appendChild(m);m.querySelector('.close').onclick=()=>m.remove();m.querySelector('#exploreFollowing').onclick=()=>{m.remove();if(typeof window.nav==='function')window.nav('feed')};
  },true);
  /* A compact modern FY skin; keeps existing mechanics instead of replacing their data layer. */
  const st=document.createElement('style');st.textContent=`
  #feed{padding-top:10px}.feed-v2-header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:4px 0 14px}.feed-v2-title{font-size:30px;letter-spacing:-.04em}.feed-v2-sub{font-size:11px;color:#777;margin-top:3px}.feed-v2-pill{border:1px solid #29292f;border-radius:999px;padding:7px 10px;font-size:10px;color:#aaa;background:#0b0b0e}.feed-v2-card{border:1px solid #222228;background:linear-gradient(180deg,#101013,#09090b);border-radius:18px;margin:10px 0;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.18)}.feed-v2-card .post-head{padding:12px 14px}.feed-v2-card .post-body{padding:0 14px 12px}.feed-v2-card img,.feed-v2-card video{width:100%;display:block;max-height:540px;object-fit:cover}.feed-v2-card .post-actions{padding:10px 14px;border-top:1px solid #1d1d22}.profile-local-viewer,.profile-following-modal{z-index:9999}.profile-local-media{display:block;width:100%;max-height:72vh;object-fit:contain;border-radius:14px}.profile-local-caption{padding-top:9px;color:#777;font-size:11px}.danger-action{border-color:#4a2929!important;color:#e9a2a2!important}.profile-post-actions{position:fixed;z-index:10001;background:#141418;border:1px solid #33333a;border-radius:12px;box-shadow:0 16px 50px rgba(0,0,0,.5);padding:5px}.profile-post-actions button{background:none;border:0;color:#eee;padding:10px 14px;font-size:12px}.tabs{position:sticky;top:0;z-index:4}.quick-post{border:1px solid #24242a;background:#101013!important;border-radius:14px!important}.story-strip{padding-bottom:4px}
  `;document.head.appendChild(st);
})();
EOF
          git config user.name 'linkstory-bot'
          git config user.email 'actions@github.com'
          git add app.js
          git commit -m 'Improve profile controls and modernize FY skin [profile-feed-v2]'
          git push
      - name: Remove temporary workflow
        if: ${{ success() }}
        run: |
          git rm .github/workflows/linkstory-profile-feed-v2.yml
          git commit -m 'Remove temporary profile feed workflow [profile-feed-v2]'
          git push
