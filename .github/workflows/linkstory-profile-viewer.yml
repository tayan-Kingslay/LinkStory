name: LinkStory profile viewer patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, 'feat: add profile post viewer')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch profile publication viewer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app.js')
          s = p.read_text(encoding='utf-8')
          marker = '/* LINKSTORY_PROFILE_VIEWER_V1 */'
          if marker in s:
              raise SystemExit(0)
          patch = r'''\n\n/* LINKSTORY_PROFILE_VIEWER_V1 */\n(()=>{\n  const $p=(s,r=document)=>r.querySelector(s);\n  const escP=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));\n  let viewer=null;\n  function ensureIds(){\n    const grid=$p('#profileGrid');\n    if(!grid)return;\n    grid.querySelectorAll('[data-grid-post]').forEach(el=>{\n      if(!el.dataset.profilePost)el.dataset.profilePost=el.dataset.gridPost;\n    });\n  }\n  new MutationObserver(ensureIds).observe(document.documentElement,{subtree:true,childList:true});\n  document.addEventListener('DOMContentLoaded',ensureIds);\n\n  function closeViewer(){if(viewer){viewer.remove();viewer=null;}document.body.classList.remove('ls-viewer-open');}\n  function openViewerShell(){\n    closeViewer();\n    viewer=document.createElement('div');\n    viewer.className='ls-profile-viewer';\n    viewer.innerHTML=`<div class=\"ls-viewer-backdrop\"></div><button class=\"ls-viewer-close\" aria-label=\"Fechar\">×</button><div class=\"ls-viewer-stage\"><div class=\"ls-viewer-blur\"></div><article class=\"ls-viewer-card\"><div class=\"ls-viewer-loading\">Carregando publicação…</div></article></div>`;\n    document.body.appendChild(viewer);\n    document.body.classList.add('ls-viewer-open');\n    $p('.ls-viewer-close',viewer).onclick=closeViewer;\n    $p('.ls-viewer-backdrop',viewer).onclick=closeViewer;\n    return $p('.ls-viewer-card',viewer);\n  }\n  async function openPost(id){\n    if(!id)return;\n    const card=openViewerShell();\n    try{\n      const r=await sb.from('posts').select('id,author_id,body,post_type,media_url,media_type,thumbnail_url,created_at').eq('id',id).maybeSingle();\n      if(r.error||!r.data)throw new Error('Publicação não encontrada.');\n      const post=r.data;\n      let author={display_name:'Usuário',username:'usuario',avatar_url:null};\n      const pr=await sb.from('profiles').select('display_name,username,avatar_url').eq('id',post.author_id).maybeSingle();\n      if(pr.data)author=pr.data;\n      const isOwn=!!user&&post.author_id===user.id;\n      const media=post.media_type==='video'&&post.media_url\n        ? `<video class=\"ls-viewer-media\" src=\"${escP(post.media_url)}\" controls playsinline></video>`\n        : post.media_url\n          ? `<img class=\"ls-viewer-media\" src=\"${escP(post.media_url)}\" alt=\"Publicação de ${escP(author.display_name)}\">`\n          : '';\n      const avatar=author.avatar_url?`<img src=\"${escP(author.avatar_url)}\" alt=\"\">`:`<span>${escP((author.display_name||'?').slice(0,2).toUpperCase())}</span>`;\n      card.innerHTML=`\n        <header class=\"ls-viewer-head\">\n          <div class=\"ls-viewer-avatar\">${avatar}</div>\n          <div class=\"ls-viewer-author\"><b>${escP(author.display_name)}</b><small>@${escP(author.username)} · ${new Date(post.created_at).toLocaleString('pt-BR')}</small></div>\n          ${isOwn?'<button class=\"ls-viewer-more\" id=\"lsViewerMore\">⋯</button>':''}\n        </header>\n        <div class=\"ls-viewer-media-wrap\">${media||'<div class=\"ls-viewer-text-post\">'+escP(post.body||'')+'</div>'}</div>\n        <div class=\"ls-viewer-body\">\n          <div class=\"ls-viewer-actions\"><button type=\"button\">♡</button><button type=\"button\">◯</button><button type=\"button\">↗</button><button type=\"button\">⌑</button></div>\n          ${post.body?`<p><b>${escP(author.username)}</b> ${escP(post.body)}</p>`:''}\n          <small class=\"ls-viewer-origin\">Publicação do perfil</small>\n        </div>`;\n      const blur=$p('.ls-viewer-blur',viewer);\n      if(post.media_url)blur.style.backgroundImage=`url(\"${String(post.media_url).replace(/\"/g,'') }\")`;\n      if(isOwn)$p('#lsViewerMore',card).onclick=()=>{\n        if(confirm('Excluir esta publicação?')){\n          sb.from('posts').delete().eq('id',post.id).then(async rr=>{\n            if(rr.error){toast('Não foi possível excluir: '+rr.error.message);return;}\n            closeViewer();\n            await renderProfile();\n            toast('Publicação excluída.');\n          });\n        }\n      };\n    }catch(e){card.innerHTML=`<div class=\"ls-viewer-error\">${escP(e.message||'Não foi possível abrir a publicação.')}</div>`;}\n  }\n  window.openPost=openPost;\n  window.openProfilePost=openPost;\n\n  const css=document.createElement('style');\n  css.textContent=`\n  body.ls-viewer-open{overflow:hidden}\n  .ls-profile-viewer{position:fixed;inset:0;z-index:10000;display:grid;place-items:center;padding:18px;overflow:hidden}\n  .ls-viewer-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.62);backdrop-filter:blur(12px)}\n  .ls-viewer-stage{position:relative;width:min(720px,100%);height:min(88vh,820px);display:grid;place-items:center;isolation:isolate}\n  .ls-viewer-blur{position:absolute;inset:-28px;background-position:center;background-size:cover;filter:blur(28px);opacity:.42;transform:scale(1.12);z-index:-1;border-radius:32px}\n  .ls-viewer-card{width:min(680px,100%);max-height:88vh;overflow:auto;background:rgba(12,12,12,.94);border:1px solid rgba(255,255,255,.22);border-radius:22px;box-shadow:0 30px 90px rgba(0,0,0,.75);animation:lsViewerIn .25s ease both}\n  @keyframes lsViewerIn{from{opacity:0;transform:scale(.96) translateY(12px)}to{opacity:1;transform:none}}\n  .ls-viewer-close{position:absolute;right:18px;top:14px;z-index:3;width:42px;height:42px;border:1px solid #555;border-radius:50%;background:rgba(10,10,10,.72);color:#fff;font-size:30px;line-height:1}\n  .ls-viewer-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid #262626}\n  .ls-viewer-avatar{width:42px;height:42px;border-radius:50%;overflow:hidden;background:#222;border:1px solid #555;display:grid;place-items:center;font-weight:900;flex:none}.ls-viewer-avatar img{width:100%;height:100%;object-fit:cover}\n  .ls-viewer-author{min-width:0;flex:1}.ls-viewer-author b{display:block;font-size:14px}.ls-viewer-author small{display:block;color:#777;margin-top:3px;font-size:10px}.ls-viewer-more{border:0;background:none;color:#ddd;font-size:25px}\n  .ls-viewer-media-wrap{background:#000;display:grid;place-items:center;min-height:180px}.ls-viewer-media{display:block;width:100%;max-height:62vh;object-fit:contain}.ls-viewer-text-post{padding:60px 24px;font-size:18px;line-height:1.55;color:#eee;min-height:240px}\n  .ls-viewer-body{padding:12px 16px 18px}.ls-viewer-actions{display:flex;gap:18px;margin-bottom:7px}.ls-viewer-actions button{border:0;background:none;color:#eee;font-size:24px;padding:2px}.ls-viewer-body p{margin:7px 0;color:#ddd;line-height:1.45;font-size:13px}.ls-viewer-origin{color:#666;font-size:10px}\n  .ls-viewer-loading,.ls-viewer-error{padding:70px 20px;text-align:center;color:#aaa}.ls-viewer-error{color:#ddd}\n  @media(max-width:600px){.ls-profile-viewer{padding:0}.ls-viewer-stage{width:100%;height:100%;}.ls-viewer-card{width:100%;max-height:100%;height:auto;border-radius:0;border-left:0;border-right:0}.ls-viewer-media{max-height:68vh}.ls-viewer-close{right:12px;top:10px}}`;\n  document.head.appendChild(css);\n})();\n'''
          p.write_text(s + patch, encoding='utf-8')
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git diff --cached --quiet && exit 0
          git commit -m "feat: add profile post viewer"
          git push
