name: Force LinkStory V4
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip force-v4]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch application
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('app.js'); s=p.read_text()
          auth="""function auth(mode='login'){const reg=mode==='register';$('#authContent').innerHTML=`<h2>${reg?'Criar conta LinkStory':'Entrar no LinkStory'}</h2><p class=\"muted\">Escolha seu tipo de conta. <b>Leitor</b> lê e interage; <b>Criador</b> publica mangás e capítulos.</p>${reg?'<input id=\"nameI\" maxlength=\"60\" placeholder=\"Nome público\"><input id=\"userI\" maxlength=\"24\" autocomplete=\"username\" placeholder=\"Kx ID (ex.: tayan)\"><div class=\"role-choice\"><button type=\"button\" class=\"role-option selected\" data-role=\"leitor\"><b>📚 Leitor</b><span>Ler, seguir criadores e publicar no Feed.</span></button><button type=\"button\" class=\"role-option\" data-role=\"criador\"><b>✍️ Criador</b><span>Publicar mangás, capítulos, vídeos e ideias.</span></button></div>':''}<input id=\"emailI\" type=\"text\" autocomplete=\"username\" placeholder=\"Kx ID ou @usuario.kx.mail\"><input id=\"passI\" type=\"password\" autocomplete=\"current-password\" placeholder=\"Senha (mín. 6 caracteres)\"><button class=\"primary full\" id=\"authSubmit\">${reg?'Criar conta':'Entrar'}</button><button class=\"text-btn\" id=\"authSwitch\">${reg?'Já tenho uma conta':'Criar uma conta'}</button>`;$('#authModal').classList.remove('hidden');$$('.role-option').forEach(b=>b.onclick=()=>{$$('.role-option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')});$('#authSubmit').onclick=()=>submitAuth(reg);$('#authSwitch').onclick=()=>auth(reg?'login':'register')}"""
          start=s.find("function auth(mode='login'){")
          end=s.find("async function submitAuth",start)
          if start<0 or end<0: raise SystemExit('auth boundaries not found')
          s=s[:start]+auth+'\n'+s[end:]
          start=s.find('async function submitAuth')
          end=s.find('async function logout',start)
          submit="""async function submitAuth(register){const password=$('#passI').value.trim();if(!password)return toast('Digite sua senha.');if(password.length<6)return toast('A senha precisa ter pelo menos 6 caracteres.');const usernameRaw=register?$('#userI').value:$('#emailI').value;const username=usernameRaw.trim().replace(/^@/,'').replace(/\\.kx\\.mail$/i,'').toLowerCase().replace(/[^a-z0-9._-]/g,'');if(!username)return toast('Digite seu Kx ID.');if(username.length<3)return toast('Kx ID muito curto.');try{let chosenRole='leitor';if(register){const name=$('#nameI').value.trim();if(!name)return toast('Preencha seu nome público.');chosenRole=document.querySelector('.role-option.selected')?.dataset.role||'leitor';await kxAuth('signup',username,password,name);toast('Conta criada! Entrando...')}const result=await kxAuth('login',username,password);if(!result.session?.access_token||!result.session?.refresh_token)throw new Error('A sessão não pôde ser criada.');const session=await sb.auth.setSession({access_token:result.session.access_token,refresh_token:result.session.refresh_token});if(session.error)throw session.error;user=session.data.session?.user||null;await loadProfile();if(register&&user){const rr=await sb.from('profiles').update({role:chosenRole}).eq('id',user.id);if(rr.error)throw rr.error;await loadProfile()}closeModals();renderProfile();await loadFeed();if(!register)toast('Login realizado!')}catch(e){toast(e.message||'Não foi possível entrar.')}}\n"""
          if start<0 or end<0: raise SystemExit('submit boundaries not found')
          s=s[:start]+submit+s[end:]
          start=s.find('function renderProfileStories(items)')
          end=s.find('\nfunction openStory(st)',start)
          stories="""function renderProfileStories(items){const box=$('#profileStories');const own=items.filter(x=>x.post_type==='story').slice(0,6);box.innerHTML=`<button class=\"story-bubble\" id=\"profileAddStory\"><div class=\"story-ring\"><span>＋</span></div><small>Novo</small></button>`+own.map(x=>`<button class=\"story-bubble\" data-profile-story=\"${esc(x.id)}\"><div class=\"story-ring\">${x.media_url?`<img src=\"${esc(x.media_url)}\">`:'<div class=\"story-placeholder\">S</div>'}</div><small>Meus</small></button>`).join('');$('#profileAddStory').onclick=()=>openStoryComposer();$$('[data-profile-story]').forEach(b=>b.onclick=()=>{const st=own.find(x=>x.id===b.dataset.profileStory);if(st)openStory(st)})}"""
          if start<0 or end<0: raise SystemExit('story boundaries not found')
          s=s[:start]+stories+s[end:]
          p.write_text(s)
          css=Path('style.css')
          css.write_text(css.read_text()+"\n/* LINKSTORY V4 VISUAL OVERRIDES */\n.role-choice{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 14px}.role-option{min-height:88px;border:1px solid #303038;background:#0b0b0e;border-radius:14px;padding:12px;text-align:left}.role-option.selected{border-color:#eee;box-shadow:inset 0 0 0 1px #eee;background:#19191d}.role-option b,.role-option span{display:block}.role-option span{margin-top:5px;color:#777;font-size:10px;line-height:1.4}.feed .post{border-radius:14px;border:1px solid #202025;margin:10px 18px;background:#09090b}.feed .post-media,.feed .video-wrap{border-radius:14px}.feed .actions button{padding:8px 6px}.tabs{background:rgba(7,7,8,.92);backdrop-filter:blur(16px)}.story-ring{background:linear-gradient(135deg,#fff,#aaa,#333)}.create-card,.mascot-guide,.creator-panel{border-radius:15px}.bottom-nav{backdrop-filter:blur(20px);background:rgba(7,7,8,.94)}@media(max-width:460px){.role-choice{grid-template-columns:1fr}}\n")
          h=Path('index.html'); text=h.read_text(); text=text.replace('<path d="M18 13 13 5l10 5M46 13l5-8-10 5" fill="#111"/>',''); h.write_text(text)
          PY
      - name: Commit V4
        run: |
          git config user.name 'linkstory-bot'
          git config user.email 'actions@github.com'
          git add app.js style.css index.html
          git diff --cached --quiet && exit 0
          git commit -m 'LinkStory V4 role separation and visual refresh [skip force-v4]'
          git push
