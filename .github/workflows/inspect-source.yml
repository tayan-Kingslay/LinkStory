name: Prepare source inspection
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  inspect:
    if: ${{ !contains(github.event.head_commit.message, '[skip inspect]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Split source into readable chunks
        run: |
          rm -rf .source-inspect
          mkdir -p .source-inspect
          python - <<'PY'
          from pathlib import Path
          p=Path('app.js').read_text()
          for i in range(0,len(p),7000):
              Path(f'.source-inspect/app-{i//7000:03d}.txt').write_text(p[i:i+7000])
          p=Path('style.css').read_text()
          for i in range(0,len(p),7000):
              Path(f'.source-inspect/style-{i//7000:03d}.txt').write_text(p[i:i+7000])
          PY
      - name: Commit chunks
        run: |
          git config user.name 'linkstory-bot'
          git config user.email 'actions@github.com'
          git add .source-inspect
          git diff --cached --quiet && exit 0
          git commit -m 'Prepare readable source inspection [skip inspect]'
          git push
