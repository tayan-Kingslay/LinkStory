name: Validate LinkStory changes
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feature/experience-approval-workflow
      - feature/experience-voice-design-reader-ui
      - feature/linkstory-publicacao-simples
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          find . -path './.git' -prune -o -path './node_modules' -prune -o -path './dist' -prune -o -name '*.js' -type f -print0 | xargs -0 -n1 node --check
      - name: Check inline page scripts
        run: node scripts/validate-inline-scripts.js
      - name: Build static site
        run: npm run build
