name: Build LinkStory homepage

on:
  push:
    paths:
      - '.github/workflows/linkstory-homepage.yml'

permissions:
  contents: write

jobs:
  build-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace homepage
        shell: bash
        run: |
          cat > index.html <<'EOF'
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#1687e8">
  <title>LinkStory — Mangás para ler e publicar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <a class="logo" href="#inicio" aria-label="LinkStory">Link<span>Story</span></a>
    <nav class="desktop-nav" aria-label="Navegação principal">
      <a class="active" href="#inicio">Início</a>
      <a href="#explorar">Explorar</a>
      <a href="#biblioteca">Biblioteca</a>
    </nav>
    <div class="header-actions">
      <button class="search-button" id="openSearch" aria-label="Buscar">⌕</button>
      <button class="login-button" id="loginButton">Entrar</button>
    </div>
  </header>

  <main id="inicio">
    <section class="hero">
      <div class="hero-copy">
        <span class="eyebrow">BEM-VINDO AO LINKSTORY</span>
        <h1>Seu próximo<br><span>mangá favorito</span><br>está aqui.</h1>
        <p>Leia histórias, descubra novos criadores e acompanhe mangás feitos por quem ama contar histórias.</p>
        <div class="hero-actions">
          <a class="primary" href="#explorar">Explorar mangás</a>
          <button class="secondary" id="createButton">Publicar um mangá</button>
        </div>
      </div>
      <div class="hero-art" aria-hidden="true">
        <div class="hero-card card-a"><span>TS</span></div>
        <div class="hero-card card-b"><span>TK</span></div>
        <div class="hero-card card-c"><span>LS</span></div>
        <div class="hero-dot dot-one"></div><div class="hero-dot dot-two"></div>
      </div>
    </section>

    <section class="section" id="explorar">
      <div class="section-heading">
        <div><span class="eyebrow">DESCUBRA</span><h2>Em alta</h2></div>
        <a href="#todos">Ver tudo →</a>
      </div>
      <div class="manga-row" id="trending"></div>
    </section>

    <section class="feature-banner">
      <div><span class="eyebrow">PARA CRIADORES</span><h2>Tem uma história para contar?</h2><p>Crie seu espaço no LinkStory e publique seus capítulos quando quiser.</p></div>
      <button class="primary" id="bannerCreate">Começar a publicar</button>
    </section>

    <section class="section" id="biblioteca">
      <div class="section-heading">
        <div><span class="eyebrow">RECÉM-CHEGADOS</span><h2>Novos mangás</h2></div>
      </div>
      <div class="manga-row" id="newManga"></div>
    </section>
  </main>

  <footer class="footer"><div class="footer-logo">Link<span>Story</span></div><p>Um lugar simples para ler e publicar mangás.</p><small>LinkStory © 2026</small></footer>

  <dialog id="searchDialog" class="dialog"><form method="dialog"><button class="dialog-close" aria-label="Fechar">×</button><span class="eyebrow">BUSCAR</span><h2>Encontre uma história</h2><input id="searchInput" type="search" placeholder="Digite o nome de um mangá..." autocomplete="off"><div id="searchResults" class="search-results"></div></form></dialog>
  <dialog id="detailDialog" class="dialog detail-dialog"><form method="dialog"><button class="dialog-close" aria-label="Fechar">×</button><div id="detailContent"></div></form></dialog>
  <div id="toast" class="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
EOF

          cat > style.css <<'EOF'
:root{--blue:#1687e8;--blue-dark:#0d6fc4;--blue-soft:#eaf6ff;--ink:#152235;--muted:#68778a;--line:#e5ebf1;--bg:#fff;--soft:#f6f9fc;--radius:18px;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#152235;background:#fff}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink)}button,a,input{font:inherit}button,a{cursor:pointer}a{text-decoration:none;color:inherit}.header{height:72px;display:flex;align-items:center;gap:42px;padding:0 max(20px,calc((100vw - 1120px)/2));border-bottom:1px solid var(--line);position:sticky;top:0;background:#ffffffee;backdrop-filter:blur(14px);z-index:20}.logo{font-size:24px;font-weight:900;letter-spacing:-1.2px;color:var(--ink)}.logo span,.footer-logo span{color:var(--blue)}.desktop-nav{display:flex;gap:26px;flex:1}.desktop-nav a{font-size:14px;color:var(--muted);font-weight:700;padding:26px 0;border-bottom:2px solid transparent}.desktop-nav a.active,.desktop-nav a:hover{color:var(--blue);border-color:var(--blue)}.header-actions{display:flex;align-items:center;gap:10px}.search-button{border:1px solid var(--line);background:#fff;width:40px;height:40px;border-radius:12px;font-size:24px;color:var(--ink)}.login-button,.secondary{border:1px solid #cfe0ee;background:#fff;color:var(--blue-dark);font-weight:800;border-radius:11px;padding:10px 15px}.hero{max-width:1120px;margin:auto;min-height:540px;display:grid;grid-template-columns:1.05fr .95fr;align-items:center;padding:68px 20px}.hero-copy{max-width:600px}.eyebrow{font-size:11px;font-weight:900;letter-spacing:2px;color:var(--blue)}h1{font-size:clamp(48px,6.5vw,78px);line-height:.98;letter-spacing:-4px;margin:16px 0 22px}h1 span{color:var(--blue)}.hero-copy p{font-size:17px;line-height:1.65;color:var(--muted);max-width:550px}.hero-actions{display:flex;gap:12px;margin-top:30px}.primary{display:inline-flex;align-items:center;justify-content:center;border:0;background:var(--blue);color:#fff;font-weight:850;border-radius:11px;padding:13px 18px;box-shadow:0 7px 18px #1687e82b}.primary:hover{background:var(--blue-dark);transform:translateY(-1px)}.hero-art{height:420px;position:relative}.hero-card{position:absolute;width:190px;height:255px;border-radius:16px;display:grid;place-items:center;font-size:48px;font-weight:950;color:#fff;box-shadow:0 25px 50px #12324a22;border:8px solid #fff}.hero-card:after{content:"";position:absolute;inset:18px;border:1px solid #ffffff55;border-radius:10px}.card-a{background:linear-gradient(145deg,#1687e8,#69c1ff);right:55px;top:20px;transform:rotate(7deg)}.card-b{background:linear-gradient(145deg,#173c70,#1687e8);left:55px;top:110px;transform:rotate(-10deg)}.card-c{background:linear-gradient(145deg,#b7e2ff,#1687e8);right:120px;bottom:0;transform:rotate(2deg);color:#fff}.hero-dot{position:absolute;border-radius:50%;background:var(--blue-soft)}.dot-one{width:80px;height:80px;right:0;top:20px}.dot-two{width:32px;height:32px;left:25px;bottom:45px;background:#cfeeff}.section{max-width:1120px;margin:auto;padding:42px 20px}.section-heading{display:flex;justify-content:space-between;align-items:end;margin-bottom:18px}.section-heading h2{font-size:30px;letter-spacing:-1px;margin:5px 0 0}.section-heading>a{font-size:13px;color:var(--blue);font-weight:800}.manga-row{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}.manga-card{min-width:0;border:0;background:#fff;text-align:left;padding:0}.cover{aspect-ratio:3/4;border-radius:14px;display:grid;place-items:center;color:#fff;font-size:34px;font-weight:950;overflow:hidden;position:relative;box-shadow:0 8px 25px #183a5d12}.cover:before{content:"";position:absolute;inset:0;background:linear-gradient(145deg,#ffffff33,transparent 45%,#0003)}.cover span{position:relative;z-index:1}.manga-card:nth-child(1) .cover{background:linear-gradient(145deg,#1687e8,#8bd4ff)}.manga-card:nth-child(2) .cover{background:linear-gradient(145deg,#142b50,#1687e8)}.manga-card:nth-child(3) .cover{background:linear-gradient(145deg,#63bdf5,#145aa0)}.manga-card:nth-child(4) .cover{background:linear-gradient(145deg,#0c4b78,#76cfff)}.manga-card:nth-child(5) .cover{background:linear-gradient(145deg,#2d6ca3,#b4e5ff)}.manga-card h3{font-size:15px;margin:11px 2px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.manga-card p{font-size:12px;color:var(--muted);margin:0 2px}.feature-banner{max-width:1080px;margin:20px auto 25px;padding:35px 40px;border-radius:22px;background:var(--blue-soft);display:flex;align-items:center;justify-content:space-between;gap:30px}.feature-banner h2{font-size:28px;letter-spacing:-.8px;margin:5px 0}.feature-banner p{color:var(--muted);margin:0}.footer{margin-top:50px;padding:40px 20px;text-align:center;border-top:1px solid var(--line);color:var(--muted)}.footer-logo{font-size:20px;font-weight:900;color:var(--ink)}.footer p{font-size:13px}.footer small{font-size:11px}.dialog{width:min(520px,calc(100% - 28px));border:1px solid var(--line);border-radius:20px;padding:26px;box-shadow:0 30px 90px #10283d33}.dialog::backdrop{background:#10283d66;backdrop-filter:blur(5px)}.dialog-close{position:absolute;right:15px;top:10px;border:0;background:none;font-size:28px;color:var(--muted)}.dialog h2{margin:7px 0 16px}.dialog input{width:100%;padding:13px;border:1px solid var(--line);border-radius:11px;outline:0}.search-results{display:grid;gap:8px;margin-top:15px}.result{padding:11px;border:1px solid var(--line);border-radius:11px;background:var(--soft);text-align:left}.detail-cover{width:160px;margin-bottom:18px}.detail-meta{color:var(--muted);font-size:13px;line-height:1.6}.toast{position:fixed;bottom:25px;left:50%;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:#fff;padding:11px 16px;border-radius:10px;font-size:13px;transition:.2s;z-index:50;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:800px){.header{padding:0 16px;gap:20px}.desktop-nav{display:none}.header-actions{margin-left:auto}.hero{grid-template-columns:1fr;min-height:auto;padding:55px 20px 45px}.hero-art{height:310px;margin-top:25px}.hero-card{width:140px;height:190px;font-size:34px}.card-a{right:30px}.card-b{left:35px;top:75px}.card-c{right:85px}.manga-row{grid-template-columns:repeat(2,1fr);gap:18px}.section{padding:32px 16px}.feature-banner{margin:10px 16px 20px;padding:26px 22px;display:block}.feature-banner .primary{margin-top:18px;width:100%}h1{letter-spacing:-2.5px}.hero-copy p{font-size:15px}}
@media(min-width:801px) and (max-width:1000px){.manga-row{grid-template-columns:repeat(4,1fr)}}
EOF

          cat > app.js <<'EOF'
const mangas=[
 {title:'Tuketon',author:'Kairox Studio',genre:'Aventura · Fantasia',tag:'TK',desc:'Um mundo de reinos, selos e energia INKRA.'},
 {title:'Horizonte',author:'L. Santos',genre:'Ação · Mistério',tag:'HZ',desc:'Uma jornada começa quando o horizonte deixa de ser o fim.'},
 {title:'Eclipse',author:'Maya',genre:'Drama · Fantasia',tag:'EC',desc:'Quando a noite cobre tudo, algumas verdades aparecem.'},
 {title:'Última Lua',author:'Kairox',genre:'Ação · Drama',tag:'UL',desc:'O último brilho antes do silêncio.'},
 {title:'Áurea',author:'Niko',genre:'Aventura · Shonen',tag:'AU',desc:'Um reino dourado guarda um segredo.'},
 {title:'Depois da Chuva',author:'Lia',genre:'Romance · Slice of life',tag:'DC',desc:'Algumas histórias começam quando a chuva termina.'}
];
const $=s=>document.querySelector(s);
function card(m,i){return `<button class="manga-card" data-index="${i}"><div class="cover"><span>${m.tag}</span></div><h3>${m.title}</h3><p>${m.genre}</p></button>`}
function render(){
 $('#trending').innerHTML=mangas.slice(0,5).map(card).join('');
 $('#newManga').innerHTML=mangas.slice(2,6).map((m)=>card(m,mangas.indexOf(m))).join('');
 document.querySelectorAll('[data-index]').forEach(b=>b.onclick=()=>openDetail(Number(b.dataset.index)));
}
function openDetail(i){const m=mangas[i];$('#detailContent').innerHTML=`<div class="cover detail-cover"><span>${m.tag}</span></div><span class="eyebrow">MANGÁ</span><h2>${m.title}</h2><p class="detail-meta"><b>${m.author}</b><br>${m.genre}<br><br>${m.desc}</p><button class="primary" id="readNow">Começar a ler</button>`;$('#detailDialog').showModal();$('#readNow').onclick=()=>toast('O leitor de capítulos entra na próxima etapa.');}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.__t);window.__t=setTimeout(()=>t.classList.remove('show'),2400)}
function openSearch(){const d=$('#searchDialog');d.showModal();$('#searchInput').value='';$('#searchResults').innerHTML='';setTimeout(()=>$('#searchInput').focus(),50)}
$('#openSearch').onclick=openSearch;
$('#searchInput').oninput=e=>{const q=e.target.value.trim().toLowerCase();const r=mangas.filter(m=>(m.title+' '+m.author+' '+m.genre).toLowerCase().includes(q));$('#searchResults').innerHTML=q?(r.length?r.map((m)=>`<button class="result" data-index="${mangas.indexOf(m)}"><b>${m.title}</b><br><small>${m.author} · ${m.genre}</small></button>`).join(''):'<p class="detail-meta">Nenhum mangá encontrado.</p>'):'';document.querySelectorAll('.result').forEach(b=>b.onclick=()=>{d.close();openDetail(Number(b.dataset.index))})};
['#loginButton','#createButton','#bannerCreate'].forEach(id=>$(id).onclick=()=>toast(id==='#loginButton'?'Login entra na próxima etapa.':'Publicação entra na próxima etapa.'));
render();
EOF

          git config user.name "LinkStory Bot"
          git config user.email "actions@github.com"
          git add index.html style.css app.js
          git commit -m "feat: create simple LinkStory manga homepage"
          git push
      
      - name: Remove one-time builder
        if: success()
        run: |
          rm -f .github/workflows/linkstory-homepage.yml
          git config user.name "LinkStory Bot"
          git config user.email "actions@github.com"
          git add .github/workflows/linkstory-homepage.yml
          git commit -m "chore: remove one-time homepage builder" || true
          git push || true
