name: Apply LinkStory V4 fixes
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip v4]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch role auth, story viewer and mascot
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.js'); s=p.read_text()
          old="""function auth(mode='login'){const reg=mode==='register';$('#authContent').innerHTML=`<h2>${reg?'Criar conta LinkStory':'Entrar no LinkStory'}</h2><p class=\"muted\">Use seu <b>Kx ID</b> e senha. O sistema transforma automaticamente o Kx ID em <b>@usuario.kx.mail</b>. O Gmail é opcional e fica nas configurações.</p>${reg?'<input id=\"nameI\" maxlength=\"60\" placeholder=\"Nome público\"><input id=\"userI\" maxlength=\"24\" autocomplete=\"username\" placeholder=\"Kx ID (ex.: tayan)\">':''}<input id=\"emailI\" type=\"text\" autocomplete=\"username\" placeholder=\"Kx ID ou @usuario.kx.mail\"><input id=\"passI\" type=\"password\" autocomplete=\"current-password\" placeholder=\"Senha (mín. 6 caracteres)\"><button class=\"primary full\" id=\"authSubmit\">${reg?'Criar conta':'Entrar'}</button><button class=\"text-btn\" id=\"authSwitch\">${reg?'Já tenho uma conta':'Criar uma conta'}</button>`;$('#authModal').classList.remove('hidden');$('#authSubmit').onclick=()=>submitAuth(reg);$('#authSwitch').onclick=()=>auth(reg?'login':'register')}"""
          new="""function auth(mode='login'){const reg=mode==='register';$('#authContent').innerHTML=`<h2>${reg?'Criar conta LinkStory':'Entrar no LinkStory'}</h2><p class=\"muted\">Escolha seu tipo de conta. O <b>Leitor</b> lê e interage; o <b>Criador</b> publica mangás e capítulos.</p>${reg?'<input id=\"nameI\" maxlength=\"60\" placeholder=\"Nome público\"><input id=\"userI\" maxlength=\"24\" autocomplete=\"username\" placeholder=\"Kx ID (ex.: tayan)\"><div class=\"role-choice\"><button type=\"button\" class=\"role-option selected\" data-role=\"leitor\"><b>📚 Leitor</b><span>Ler, seguir criadores e publicar no Feed.</span></button><button type=\"button\" class=\"role-option\" data-role=\"criador\"><b>✍️ Criador</b><span>Publicar mangás, capítulos, vídeos e ideias.</span></button></div>':''}<input id=\"emailI\" type=\"text\" autocomplete=\"username\" placeholder=\"Kx ID ou @usuario.kx.mail\"><input id=\"passI\" type=\"password\" autocomplete=\"current-password\" placeholder=\"Senha (mín. 6 caracteres)\"><button class=\"primary full\" id=\"authSubmit\">${reg?'Criar conta':'Entrar'}</button><button class=\"text-btn\" id=\"authSwitch\">${reg?'Já tenho uma conta':'Criar uma conta'}</button>`;$('#authModal').classList.remove('hidden');$$('.role-option').forEach(b=>b.onclick=()=>{$$('.role-option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')});$('#authSubmit').onclick=()=>submitAuth(reg);$('#authSwitch').onclick=()=>auth(reg?'login':'register')}"""
          if old not in s: raise SystemExit('auth block not found')
          s=s.replace(old,new)
          old2="""async function submitAuth(register){const password=$('#passI').value.trim();if(!password)return toast('Digite sua senha.');if(password.length<6)return toast('A senha precisa ter pelo menos 6 caracteres.');const usernameRaw=register?$('#userI').value:$('#emailI').value;const username=usernameRaw.trim().replace(/^@/,'').replace(/\\.kx\\.mail$/i,'').toLowerCase().replace(/[^a-z0-9._-]/g,'');if(!username)return toast('Digite seu Kx ID.');if(username.length<3)return toast('Kx ID muito curto.');try{if(register){const name=$('#nameI').value.trim();if(!name)return toast('Preencha seu nome público.');await kxAuth('signup',username,password,name);toast('Conta criada! Entrando...')}const result=await kxAuth('login',username,password);if(!result.session?.access_token||!result.session?.refresh_token)throw new Error('A sessão não pôde ser criada.');const session=await sb.auth.setSession({access_token:result.session.access_token,refresh_token:result.session.refresh_token});if(session.error)throw session.error;user=session.data.session?.user||null;await loadProfile();closeModals();renderProfile();await loadFeed();if(!register)toast('Login realizado!')}catch(e){toast(e.message||'Não foi possível entrar.')}}"""
          new2="""async function submitAuth(register){const password=$('#passI').value.trim();if(!password)return toast('Digite sua senha.');if(password.length<6)return toast('A senha precisa ter pelo menos 6 caracteres.');const usernameRaw=register?$('#userI').value:$('#emailI').value;const username=usernameRaw.trim().replace(/^@/,'').replace(/\\.kx\\.mail$/i,'').toLowerCase().replace(/[^a-z0-9._-]/g,'');if(!username)return toast('Digite seu Kx ID.');if(username.length<3)return toast('Kx ID muito curto.');try{let chosenRole='leitor';if(register){const name=$('#nameI').value.trim();if(!name)return toast('Preencha seu nome público.');chosenRole=document.querySelector('.role-option.selected')?.dataset.role||'leitor';await kxAuth('signup',username,password,name);toast('Conta criada! Entrando...')}const result=await kxAuth('login',username,password);if(!result.session?.access_token||!result.session?.refresh_token)throw new Error('A sessão não pôde ser criada.');const session=await sb.auth.setSession({access_token:result.session.access_token,refresh_token:result.session.refresh_token});if(session.error)throw session.error;user=session.data.session?.user||null;await loadProfile();if(register&&user){const rr=await sb.from('profiles').update({role:chosenRole}).eq('id',user.id);if(rr.error)throw rr.error;await loadProfile()}closeModals();renderProfile();await loadFeed();if(!register)toast('Login realizado!')}catch(e){toast(e.message||'Não foi possível entrar.')}}"""
          if old2 not in s: raise SystemExit('submitAuth block not found')
          s=s.replace(old2,new2)
          old3="""function renderProfileStories(items){const box=$('#profileStories');const own=items.filter(x=>x.post_type==='story').slice(0,6);box.innerHTML=`<button class=\"story-bubble\" id=\"profileAddStory\"><div class=\"story-ring\"><span>＋</span></div><small>Novo</small></button>`+own.map(x=>`<button class=\"story-bubble\"><div class=\"story-ring\">${x.media_url?`<img src=\"${esc(x.media_url)}\">`:'<div class=\"story-placeholder\">S</div>'}</div><small>Meus</small></button>`).join('');$('#profileAddStory').onclick=()=>$('#storyModal').classList.remove('hidden')}"""
          new3="""function renderProfileStories(items){const box=$('#profileStories');const own=items.filter(x=>x.post_type==='story').slice(0,6);box.innerHTML=`<button class=\"story-bubble\" id=\"profileAddStory\"><div class=\"story-ring\"><span>＋</span></div><small>Novo</small></button>`+own.map(x=>`<button class=\"story-bubble\" data-profile-story=\"${esc(x.id)}\"><div class=\"story-ring\">${x.media_url?`<img src=\"${esc(x.media_url)}\">`:'<div class=\"story-placeholder\">S</div>'}</div><small>Meus</small></button>`).join('');$('#profileAddStory').onclick=()=>openStoryComposer();$$('[data-profile-story]').forEach(b=>b.onclick=()=>{const st=own.find(x=>x.id===b.dataset.profileStory);if(st)openStory(st)})}"""
          if old3 not in s: raise SystemExit('profile stories block not found')
          s=s.replace(old3,new3)
          p.write_text(s)
          i=Path('index.html'); h=i.read_text(); h=h.replace('<path d="M18 13 13 5l10 5M46 13l5-8-10 5" fill="#111"/>',''); i.write_text(h)
          PY
      - name: Commit V4 fixes
        run: |
          git config user.name 'linkstory-bot'
          git config user.email 'actions@github.com'
          git add app.js index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix LinkStory roles, stories and mascot [skip v4]'
          git push
