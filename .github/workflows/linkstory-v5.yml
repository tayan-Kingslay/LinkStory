name: LinkStory V5 UI patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[v5]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach V5 module
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<script src="profile-feed-v5.js"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'\n</body>')
              p.write_text(s)
          PY
      - name: Commit V5
        run: |
          git config user.name 'linkstory-bot'
          git config user.email 'actions@github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Activate LinkStory V5 profile controls and feed [v5]'
          git push
