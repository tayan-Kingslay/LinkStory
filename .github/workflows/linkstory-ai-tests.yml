name: LinkStory AI tests

on:
  push:
    branches:
      - feature/linkstory-ai-autonomia
    paths:
      - "linkstory-ai/**"
      - "linkstory-ai-client.js"
      - "linkstory-ai-config.js"
      - "nox.html"
      - "nox.css"
      - "nox-page.js"
      - "global-nav.js"
      - "panel-editor.html"
      - ".github/workflows/linkstory-ai-tests.yml"
  pull_request:
    paths:
      - "linkstory-ai/**"
      - "linkstory-ai-client.js"
      - "linkstory-ai-config.js"
      - "nox.html"
      - "nox.css"
      - "nox-page.js"
      - "global-nav.js"
      - "panel-editor.html"
      - ".github/workflows/linkstory-ai-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: linkstory-ai/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
        working-directory: linkstory-ai
      - name: Validate browser client syntax
        run: |
          node --check ../linkstory-ai-client.js
          node --check ../nox-page.js
          node --check ../linkstory-ai-config.js
        working-directory: linkstory-ai
      - name: Validate Docker Compose YAML
        run: python -c "import yaml; yaml.safe_load(open('docker-compose.yml', encoding='utf-8'))"
        working-directory: linkstory-ai
      - name: Run API tests
        env:
          PYTHONPATH: .
        run: pytest -q tests
        working-directory: linkstory-ai
