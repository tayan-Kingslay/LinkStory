<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101820"><title>Mensagens — LinkStory</title>
<link rel="stylesheet" href="visual-system.css?v=3"><link rel="stylesheet" href="visual-refresh.css?v=1">
<style>
:root{--bg:#101820;--panel:#17212b;--panel2:#202b36;--line:#293642;--ink:#f4f7fb;--muted:#a2afbd;--blue:#3188ed}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line);background:#101820;position:sticky;top:0;z-index:5}.brand{font-size:23px;font-weight:950;letter-spacing:-1px;text-decoration:none;color:#fff}.brand b{color:#5ca8ff}.new{background:var(--blue);color:#fff;border:0;border-radius:12px;padding:11px 15px;font-weight:850;text-decoration:none}
main{width:min(760px,100%);margin:0 auto;padding:24px 16px 100px}.head{display:flex;align-items:center;justify-content:space-between;gap:12px}.head h1{font-size:34px;letter-spacing:-1.5px;margin:0}.muted{color:var(--muted);font-size:13px;margin:5px 0 18px}
.search{width:100%;height:48px;border:1px solid var(--line);border-radius:14px;background:var(--panel2);color:var(--ink);padding:0 15px;font:inherit;outline:none}
.tabs{display:flex;gap:8px;margin:16px 0 18px;overflow:auto}.tab{white-space:nowrap;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:10px 16px;font-weight:800}.tab.active{background:#293440;border-color:#293440}
.section-title{font-size:12px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);font-weight:900;margin:18px 4px 8px}
.list{border-top:1px solid var(--line)}.conversation{display:flex;align-items:center;gap:13px;padding:14px 5px;border-bottom:1px solid var(--line);color:inherit;text-decoration:none;min-width:0}.avatar{width:58px;height:58px;border-radius:50%;flex:none;display:grid;place-items:center;background:#26394d;color:#8dc2ff;font-weight:900;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.copy{min-width:0;flex:1}.line1{display:flex;align-items:center;justify-content:space-between;gap:8px}.line1 strong{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.time{font-size:11px;color:var(--muted);white-space:nowrap}.preview{font-size:13px;color:var(--muted);margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.empty{text-align:center;padding:55px 20px;color:var(--muted);line-height:1.6}.empty strong{display:block;color:var(--ink);font-size:17px;margin-bottom:7px}
.request{display:flex;align-items:center;gap:12px;padding:13px 5px;border-bottom:1px solid var(--line)}.request .copy{flex:1;min-width:0}.request .copy strong{display:block}.request .copy small{display:block;color:var(--muted);margin-top:4px}.accept{border:0;border-radius:10px;background:var(--blue);color:white;padding:9px 12px;font-weight:850}
@media(max-width:560px){main{padding:21px 15px 100px}.head h1{font-size:31px}.avatar{width:54px;height:54px}.conversation{gap:11px;padding:13px 2px}}
</style></head><body>
<header><a class="brand" href="index.html">Link<b>Story</b></a><a class="new" href="friends.html">Nova conversa</a></header>
<main><div class="head"><h1>Mensagens</h1><a class="new" href="friends.html">＋</a></div><p class="muted">Suas conversas, cada uma no seu espaço.</p>
<input class="search" id="search" type="search" placeholder="Pesquisar pessoas ou conversas">
<div class="tabs" role="tablist"><button class="tab active" data-tab="main">Principal</button><button class="tab" data-tab="requests">Pedidos</button><button class="tab" data-tab="all">Geral</button></div>
<div id="content"><div class="empty">Carregando suas conversas…</div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js"></script><script src="global-nav.js"></script>
<script>
(async()=>{
 const db=linkstorySupabase,$=id=>document.getElementById(id);let user,tab='main',conversations=[],requests=[];
 const initials=p=>(p.display_name||p.username||'L').trim().slice(0,1).toUpperCase();
 const ago=v=>{if(!v)return'';const ms=Date.now()-new Date(v).getTime(),m=Math.floor(ms/60000);if(m<1)return'agora';if(m<60)return m+' min';const h=Math.floor(m/60);if(h<24)return h+' h';const d=Math.floor(h/24);return d+' d'};
 function avatar(p){return p.avatar_url?'<img src="'+String(p.avatar_url).replace(/"/g,'&quot;')+'" alt="">':initials(p)}
 async function load(){
  const s=await db.auth.getSession();user=s.data.session?.user;if(!user){location.href='login.html?next=messages.html';return}
  const mem=await db.from('conversation_members').select('conversation_id').eq('user_id',user.id);if(mem.error)throw mem.error;
  const ids=[...new Set((mem.data||[]).map(x=>x.conversation_id))];
  if(ids.length){
   const [members,msgs]=await Promise.all([
    db.from('conversation_members').select('conversation_id,user_id').in('conversation_id',ids).neq('user_id',user.id),
    db.from('messages').select('id,conversation_id,sender_id,body,created_at').in('conversation_id',ids).order('created_at',{ascending:false}).limit(500)
   ]);
   if(members.error)throw members.error;if(msgs.error)throw msgs.error;
   const peerIds=[...new Set((members.data||[]).map(x=>x.user_id))];
   const prof=peerIds.length?await db.from('profiles').select('id,username,display_name,avatar_url').in('id',peerIds):{data:[],error:null};
   if(prof.error)throw prof.error;const people=Object.fromEntries((prof.data||[]).map(p=>[p.id,p]));
   const last={};(msgs.data||[]).forEach(m=>{if(!last[m.conversation_id])last[m.conversation_id]=m});
   conversations=(members.data||[]).map(m=>({peer:people[m.user_id]||{id:m.user_id,display_name:'Pessoa do LinkStory'},conversation_id:m.conversation_id,last:last[m.conversation_id]})).sort((a,b)=>new Date(b.last?.created_at||0)-new Date(a.last?.created_at||0));
  }
  const req=await db.from('friend_requests').select('id,sender_id,created_at').eq('recipient_id',user.id).eq('status','pending').order('created_at',{ascending:false});if(req.error)throw req.error;
  const rp=req.data||[],rids=[...new Set(rp.map(x=>x.sender_id))],rprof=rids.length?await db.from('profiles').select('id,username,display_name,avatar_url').in('id',rids):{data:[],error:null};if(rprof.error)throw rprof.error;const rpeople=Object.fromEntries((rprof.data||[]).map(p=>[p.id,p]));
  requests=rp.map(r=>({...r,peer:rpeople[r.sender_id]||{display_name:'Pessoa do LinkStory'}}));render();
 }
 function render(){
  const box=$('content'),q=$('search').value.trim().toLowerCase();box.replaceChildren();
  if(tab==='requests'){
   if(!requests.length){box.innerHTML='<div class="empty"><strong>Nenhum pedido por enquanto.</strong>Quando alguém quiser se conectar com você, aparecerá aqui.</div>';return}
   const list=document.createElement('div');list.className='list';requests.forEach(r=>{const row=document.createElement('div');row.className='request';const av=document.createElement('div');av.className='avatar';av.innerHTML=avatar(r.peer);const copy=document.createElement('div');copy.className='copy';const name=document.createElement('strong');name.textContent=r.peer.display_name||r.peer.username;const small=document.createElement('small');small.textContent='@'+(r.peer.username||'usuário')+' · quer ser seu amigo';copy.append(name,small);const accept=document.createElement('button');accept.className='accept';accept.textContent='Aceitar';accept.onclick=async()=>{accept.disabled=true;const res=await db.rpc('respond_friend_request',{p_request_id:r.id,p_accept:true});if(res.error){accept.disabled=false;alert(res.error.message);return}await load()};row.append(av,copy,accept);list.append(row)});box.append(list);return;
  }
  const filtered=conversations.filter(c=>((c.peer.display_name||'')+' '+(c.peer.username||'')+' '+(c.last?.body||'')).toLowerCase().includes(q));
  if(!filtered.length){box.innerHTML='<div class="empty"><strong>Suas conversas começam aqui.</strong>Adicione amigos e toque em “Nova conversa” para mandar a primeira mensagem.</div>';return}
  const list=document.createElement('div');list.className='list';filtered.forEach(c=>{const a=document.createElement('a');a.className='conversation';a.href='friends.html?friend='+encodeURIComponent(c.peer.id);const av=document.createElement('div');av.className='avatar';av.innerHTML=avatar(c.peer);const copy=document.createElement('div');copy.className='copy';const line=document.createElement('div');line.className='line1';const name=document.createElement('strong');name.textContent=c.peer.display_name||c.peer.username||'Usuário';const time=document.createElement('span');time.className='time';time.textContent=ago(c.last?.created_at);line.append(name,time);const preview=document.createElement('div');preview.className='preview';preview.textContent=c.last?(c.last.sender_id===user.id?'Você: ':'')+c.last.body:'Conversa iniciada · envie um oi!';copy.append(line,preview);a.append(av,copy);list.append(a)});box.append(list);
 }
 document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));render()});$('search').oninput=render;
 await load();
})().catch(e=>{document.getElementById('content').innerHTML='<div class="empty"><strong>Não foi possível carregar as mensagens.</strong>'+String(e.message||'Tente novamente.')+'</div>'});
</script></body></html>
