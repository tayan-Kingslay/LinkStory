e:13px}</style><style id="public-profile-social-inline-style">.hero.hero-reordered{grid-template-columns:84px minmax(0,1fr);grid-template-rows:auto auto auto;row-gap:15px}.hero-reordered>.avatar{grid-column:1;grid-row:1}.hero-reordered>.identity{grid-column:2;grid-row:1}.hero-reordered>.social-inline{grid-column:1/-1;grid-row:2;display:flex;justify-content:center;align-items:center;gap:clamp(28px,10vw,76px);width:100%;padding:12px 8px;border-top:1px solid rgba(130,150,175,.18);border-bottom:1px solid rgba(130,150,175,.18)}.hero-reordered>.bio{grid-column:1/-1;grid-row:3;margin:0;padding:14px 0 0;border-top:0}.hero-reordered .social-inline-count{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:82px;padding:0;border:0;background:transparent;color:#78889d;font:inherit;font-size:12px;cursor:pointer}.hero-reordered .social-inline-count strong{font-size:20px;line-height:1.15;font-weight:900;color:#17263a}.follow-actions{display:flex;flex-direction:column;align-items:flex-start;gap:5px;margin-top:-12px}.follow-actions .follow-status{width:100%;font-size:11px;color:#71839a}.follow-actions .follow-button[hidden]{display:none}@media(max-width:560px){.hero.hero-reordered{grid-template-columns:72px minmax(0,1fr);row-gap:13px}.hero-reordered>.social-inline{gap:34px;padding:11px 4px}.hero-reordered .social-inline-count strong{font-size:19px}.follow-actions{margin-top:-8px}}</style><style id="public-profile-identity-overlap-fix">

<header><a class="back" href="javascript:history.back()" aria-label="Voltar">‹</a><a class="brand" href="index.html">LINK<span>STORY</span></a></header>
<main><section class="hero hero-reordered"><div class="avatar" id="avatar">L</div><div class="identity"><h1 id="name">Carregando perfil…</h1><div class="handle" id="handle"></div></div><div class="social-inline" aria-label="Seguidores e seguindo"><button class="social-inline-count" id="openFollowers" type="button"><strong id="followersCount">—</strong><span>seguidores</span></button><button class="social-inline-count" id="openFollowing" type="button"><strong id="followingCount">—</strong><span>seguindo</span></button></div><div class="bio" id="bio"></div></section><div class="follow-actions"><button class="follow-button" id="followButton" type="button" hidden>Seguir</button><div class="follow-status" id="followStatus" role="status" aria-live="polite"></div></div>
<section class="section"><div class="eyebrow">PUBLICAÇÕES</div><h2>Obras criadas</h2><div id="works" class="works"><div class="empty">Carregando publicações…</div></div></section><section class="section" id="profilePhotosSection" hidden><div class="eyebrow">FEED</div><h2>Fotos</h2><div id="profilePhotos" class="profile-photo-grid"></div></section><style>.profile-photo-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.profile-photo-grid a{display:block;aspect-ratio:1;overflow:hidden;border-radius:13px;background:#edf3fa}.profile-photo-grid img{width:100%;height:100%;object-fit:cover;display:block}@media(max-width:560px){.profile-photo-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}</style><section class="section" id="collabSection" hidden><div class="eyebrow">PARTICIPAÇÕES</div><h2>Mangás em que colaborou</h2><div id="collaborations" class="works"></div></section><section class="section" id="invitesSection" hidden><div class="eyebrow">CONVITES</div><h2>Convites de colaboração</h2><div id="invites" class="invite-list"></div></section></main>
<dialog class="network-dialog" id="networkDialog"><div class="network-head"><h2 id="networkTitle">Seguidores</h2><button class="network-close" id="closeNetwork" type="button" aria-label="Fechar">×</button></div><div class="network-list" id="networkList"><div class="network-empty">Carregando…</div></div></dialog><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js"></script><script src="verification.js?v=1"></script><script src="manga-db.js"></script><script src="global-nav.js?v=20261110-2"></script>
<script>
(async()=>{
 const $=id=>document.getElementById(id),db=linkstorySupabase,id=new URLSearchParams(location.search).get('id');
 if(!id){$('name').textContent='Perfil não encontrado';$('handle').textContent='Este link não contém um perfil.';return}
 const result=await db.from('profiles').select('id,username,display_name,avatar_url,bio,verification_type').eq('id',id).maybeSingle();
 if(result.error)throw result.error;const p=result.data;
 if(!p){$('name').textContent='Perfil não encontrado';$('handle').textContent='Este perfil pode não estar disponível.';return}
 
 $('name').textContent=p.display_name||p.username||'Usuário';if(window.LinkStoryVerification)LinkStoryVerification.decorate($('name'),p.verification_type);$('handle').textContent='@'+(p.username||'usuário');$('bio').textContent=p.bio||'';
 const av=$('avatar');if(p.avatar_url){const img=document.createElement('img');img.src=p.avatar_url;img.alt='Foto de '+(p.display_name||p.username);av.replaceChildren(img)}else av.textContent=(p.display_name||p.username||'L').slice(0,1).toUpperCase();
 const session=await LinkStoryManga.session(),viewer=session?.user?.id||null,followButton=$('followButton'),followStatus=$('followStatus');
 async function refreshSocial(){
  const [followers,following]=await Promise.all([
   db.from('follows').select('follower_id',{count:'exact',head:true}).eq('following_id',p.id),
   db.from('follows').select('following_id',{count:'exact',head:true}).eq('follower_id',p.id)
  ]);
  if(followers.error)throw followers.error;if(following.error)throw following.error;
  $('followersCount').textContent=Number(followers.count||0).toLocaleString('pt-BR');
  $('followingCount').textContent=Number(following.count||0).toLocaleString('pt-BR');
 }
 await refreshSocial();
 const networkDialog=$('networkDialog');
 $('closeNetwork').onclick=()=>networkDialog.close();
 networkDialog.addEventListener('click',e=>{if(e.target===networkDialog)networkDialog.close()});
 async function openNetwork(kind){
  const list=$('networkList');$('networkTitle').textContent=kind==='followers'?'Seguidores de '+(p.display_name||p.username):'Pessoas que '+(p.display_name||p.username)+' segue';
  list.innerHTML='<div class="network-empty">Carregando pessoas…</div>';networkDialog.showModal();
  try{
   const field=kind==='followers'?'follower_id':'following_id';
   const rel=await db.from('follows').select(field).eq(kind==='followers'?'following_id':'follower_id',p.id);
   if(rel.error)throw rel.error;
   const ids=(rel.data||[]).map(x=>x[field]).filter(Boolean);
   if(!ids.length){list.innerHTML='<div class="network-empty">Ainda não há pessoas nesta lista.</div>';return}
   const people=await db.from('profiles').select('id,username,display_name,avatar_url').in('id',ids);
   if(people.error)throw people.error;
   list.replaceChildren();
   (people.data||[]).forEach(person=>{
    const a=document.createElement('a');a.className='network-person';a.href='public-profile.html?id='+encodeURIComponent(person.id);
    const avatar=person.avatar_url?document.createElement('img'):document.createElement('div');
    if(person.avatar_url){avatar.src=person.avatar_url;avatar.alt=''}else{avatar.className='network-avatar';avatar.textContent=(person.display_name||person.username||'U').slice(0,1).toUpperCase()}
    const copy=document.createElement('span'),name=document.createElement('strong'),handle=document.createElement('small');
    name.textContent=person.display_name||person.username||'Usuário';handle.textContent='@'+(person.username||'usuário');copy.append(name,handle);a.append(avatar,copy);list.append(a);
   });
  }catch(err){list.innerHTML='<div class="network-empty">Não foi possível carregar a lista: '+String(err.message||'tente novamente').replace(/[<>]/g,'')+'</div>'}
 }
 $('openFollowers').onclick=()=>openNetwork('followers');$('openFollowing').onclick=()=>openNetwork('following');
 if(viewer&&viewer!==p.id){
  followButton.hidden=false;
  const existing=await db.from('follows').select('follower_id').eq('follower_id',viewer).eq('following_id',p.id).maybeSingle();
  if(existing.error)throw existing.error;
  let isFollowing=!!existing.data;
  const paint=()=>{followButton.textContent=isFollowing?'Seguindo':'Seguir';followButton.classList.toggle('following',isFollowing);followButton.setAttribute('aria-pressed',String(isFollowing))};
  paint();
  followButton.addEventListener('click',async()=>{
   followButton.disabled=true;followStatus.textContent=isFollowing?'Atualizando…':'Salvando…';
   try{
    if(isFollowing){const result=await db.from('follows').delete().eq('follower_id',viewer).eq('following_id',p.id);if(result.error)throw result.error;isFollowing=false}
    else{const result=await db.from('follows').insert({follower_id:viewer,following_id:p.id});if(result.error)throw result.error;isFollowing=true}
    paint();await refreshSocial();followStatus.textContent=isFollowing?'Você está seguindo este perfil.':'Você deixou de seguir este perfil.';
   }catch(error){followStatus.textContent=error.message||'Não foi possível atualizar o acompanhamento.'}
   finally{followButton.disabled=false}
  });
 }else if(!viewer){followButton.hidden=false;followButton.textContent='Entrar para seguir';followButton.onclick=()=>location.href='login.html'}
 else{followStatus.textContent='Este é o seu perfil.'}

 function cardFor(m,role){const card=document.createElement('article');card.className='work';const link=document.createElement('a');link.href='manga.html?id='+encodeURIComponent(m.id);link.style.color='inherit';link.style.textDecoration='none';const cover=document.createElement('div');cover.className='cover';if(m.cover_url){const img=document.createElement('img');img.src=m.cover_url;img.alt='Capa de '+(m.title||'mangá');img.loading='lazy';cover.append(img)}else cover.textContent=m.title||'Mangá';const title=document.createElement('h3');title.textContent=m.title||'Sem título';const meta=document.createElement('p');meta.textContent=role||((m.genres||'Mangá').replaceAll(',',' · '));link.append(cover,title,meta);card.append(link);return card}
 const all=await LinkStoryManga.publishedMangas(),works=all.filter(m=>m.creator_id===p.id),box=$('works');box.replaceChildren();
 if(!works.length){const empty=document.createElement('div');empty.className='empty';empty.innerHTML='<strong>Nenhuma obra criada ainda.</strong>Quando este perfil publicar uma obra, ela aparecerá aqui.';box.append(empty)}
 else{works.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).forEach(m=>box.append(cardFor(m,'Autor principal')))}
 const photos=await db.from('posts').select('id,media_url,body,created_at').eq('author_id',p.id).eq('media_type','image').not('media_url','is',null).order('created_at',{ascending:false}).limit(30);
 if(!photos.error&&(photos.data||[]).length){$('profilePhotosSection').hidden=false;const grid=$('profilePhotos');photos.data.forEach(post=>{const a=document.createElement('a');a.href='fy.html';a.setAttribute('aria-label',post.body||'Foto publicada');const img=document.createElement('img');img.src=post.media_url;img.alt=post.body||'Foto publicada';img.loading='lazy';a.append(img);grid.append(a)})}
 const collaborations=await LinkStoryManga.collaborationsForUser(p.id),collabBox=$('collaborations');
 if(collaborations.length){$('collabSection').hidden=false;collaborations.forEach(item=>{if(item.mangas)collabBox.append(cardFor(item.mangas,item.role+' · Colaborador'))})}
 if(viewer===p.id){const invites=await LinkStoryManga.myCollaborationInvites();if(invites.length){$('invitesSection').hidden=false;const inviteBox=$('invites');invites.forEach(invite=>{const row=document.createElement('div');row.className='invite-card';const cover=invite.mangas?.cover_url?document.createElement('img'):document.createElement('div');if(invite.mangas?.cover_url){cover.src=invite.mangas.cover_url;cover.alt=''}else{cover.className='invite-cover';cover.textContent='Mangá'}const info=document.createElement('div');info.className='invite-info';const title=document.createElement('strong');title.textContent=invite.mangas?.title||'Mangá';const by=document.createElement('small');by.textContent='Convite de '+(invite.inviter?.display_name||invite.inviter?.username||'criador')+' · '+invite.role;info.append(title,by);const actions=document.createElement('div');actions.className='invite-actions';const accept=document.createElement('button');accept.className='accept';accept.textContent='Aceitar';const decline=document.createElement('button');decline.textContent='Recusar';async function respond(status,button){button.disabled=true;button.textContent='Salvando…';try{await LinkStoryManga.respondToCollaboration(invite.id,status);row.remove();if(status==='accepted'){const fresh=await LinkStoryManga.collaborationsForUser(p.id);collabBox.replaceChildren();$('collabSection').hidden=!fresh.length;fresh.forEach(item=>{if(item.mangas)collabBox.append(cardFor(item.mangas,item.role+' · Colaborador'))})}if(!inviteBox.children.length)$('invitesSection').hidden=true}catch(error){button.disabled=false;button.textContent=status==='accepted'?'Aceitar':'Recusar';alert(error.message||'Não foi possível responder ao convite.')}}accept.onclick=()=>respond('accepted',accept);decline.onclick=()=>respond('declined',decline);actions.append(accept,decline);row.append(cover,info,actions);inviteBox.append(row)})}}
})().catch(e=>{$('name').textContent='Não foi possível carregar o perfil';$('handle').textContent=e.message||'Tente novamente.'});
</script></body></html>
