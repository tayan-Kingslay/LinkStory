<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f7fc"><title>Perfil — LinkStory</title>
<link rel="stylesheet" href="visual-system.css?v=3"><link rel="stylesheet" href="visual-refresh.css?v=1">
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#17263a;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{height:76px;display:flex;align-items:center;gap:13px;padding:0 18px;background:rgba(255,255,255,.94);border-bottom:1px solid #e3eaf3;box-shadow:0 5px 22px rgba(20,48,82,.06)}
.back{width:43px;height:43px;display:grid;place-items:center;border:1px solid #e1e9f2;border-radius:14px;color:#1769d2;background:#f7faff;text-decoration:none;font-size:25px}
.brand{font-weight:950;letter-spacing:-1px;font-size:21px;color:#17263a}.brand span{color:#1769d2}
main{width:min(850px,calc(100% - 28px));margin:26px auto 100px}
.hero{display:flex;align-items:center;gap:19px;padding:22px;background:#fff;border:1px solid #e2eaf3;border-radius:23px;box-shadow:0 8px 26px rgba(24,53,87,.05)}
.avatar{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;overflow:hidden;flex:none;background:#eaf3ff;color:#1769d2;font-size:32px;font-weight:900;border:3px solid white;box-shadow:0 4px 16px #18355718}
.avatar img{width:100%;height:100%;object-fit:cover}.eyebrow{font-size:10px;letter-spacing:2px;color:#1769d2;font-weight:900}
h1{margin:5px 0;font-size:clamp(25px,5vw,38px);letter-spacing:-1.5px}.handle{color:#78889d;font-size:14px}.bio{color:#53667d;font-size:14px;line-height:1.6;margin-top:10px;white-space:pre-wrap}
.pills{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.pill{border:1px solid #e1e9f2;border-radius:999px;background:#f8fbff;color:#5e7188;padding:7px 10px;font-size:11px;font-weight:800}
.section{margin-top:28px}.section h2{font-size:23px;letter-spacing:-.7px;margin:6px 0 14px}
.works{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}
.work{background:#fff;border:1px solid #e2eaf3;border-radius:17px;padding:9px;min-width:0;box-shadow:0 5px 18px rgba(24,53,87,.04)}
.cover{width:100%;aspect-ratio:3/4;border-radius:11px;background:#edf4fc;display:grid;place-items:center;overflow:hidden;color:#1769d2;font-weight:900}
.cover img{width:100%;height:100%;object-fit:cover}.work h3{font-size:14px;margin:9px 3px 4px;overflow-wrap:anywhere}.work p{font-size:11px;color:#8291a4;margin:0 3px 4px}
.empty{background:#fff;border:1px dashed #d7e2ef;border-radius:18px;padding:34px 18px;text-align:center;color:#7b8ba0;line-height:1.6}.empty strong{display:block;color:#20334b;margin-bottom:5px}
@media(max-width:560px){header{height:70px;padding:0 13px}.hero{padding:17px;gap:14px;border-radius:19px}.avatar{width:76px;height:76px}.works{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.work{padding:7px}main{margin-top:18px}}
</style></head><body>
<header><a class="back" href="javascript:history.back()" aria-label="Voltar">‹</a><a class="brand" href="index.html">LINK<span>STORY</span></a></header>
<main><section class="hero"><div class="avatar" id="avatar">L</div><div style="min-width:0"><div class="eyebrow">PERFIL LINKSTORY</div><h1 id="name">Carregando perfil…</h1><div class="handle" id="handle"></div><div class="bio" id="bio"></div><div class="pills" id="pills"></div></div></section>
<section class="section"><div class="eyebrow">PUBLICAÇÕES</div><h2>Obras publicadas</h2><div id="works" class="works"><div class="empty">Carregando publicações…</div></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js"></script><script src="verification.js?v=1"></script><script src="manga-db.js"></script><script src="global-nav.js"></script>
<script>
(async()=>{
 const $=id=>document.getElementById(id),db=linkstorySupabase,id=new URLSearchParams(location.search).get('id');
 if(!id){$('name').textContent='Perfil não encontrado';$('handle').textContent='Este link não contém um perfil.';return}
 const result=await db.from('profiles').select('id,username,display_name,avatar_url,bio,role,k_code,verification_type').eq('id',id).maybeSingle();
 if(result.error)throw result.error;const p=result.data;
 if(!p){$('name').textContent='Perfil não encontrado';$('handle').textContent='Este perfil pode não estar disponível.';return}
 $('name').textContent=p.display_name||p.username||'Usuário';if(window.LinkStoryVerification)LinkStoryVerification.decorate($('name'),p.verification_type);$('handle').textContent='@'+(p.username||'usuário');$('bio').textContent=p.bio||'';
 const av=$('avatar');if(p.avatar_url){const img=document.createElement('img');img.src=p.avatar_url;img.alt='Foto de '+(p.display_name||p.username);av.replaceChildren(img)}else av.textContent=(p.display_name||p.username||'L').slice(0,1).toUpperCase();
 const readerTitle=document.createElement('span');readerTitle.className='pill';readerTitle.textContent='Leitor';$('pills').append(readerTitle);
 if(p.role==='criador'){
  const mangakaTitle=document.createElement('span');mangakaTitle.className='pill';mangakaTitle.textContent='Mangaká';$('pills').append(mangakaTitle);
  const identity=await db.from('mangaka_profiles').select('pen_name,handle').eq('user_id',p.id).maybeSingle();
  if(identity.error)throw identity.error;
  if(identity.data){
   const artist=document.createElement('span');artist.className='pill';artist.textContent='Nome artístico: '+identity.data.pen_name;$('pills').append(artist);
   const handlePill=document.createElement('span');handlePill.className='pill';handlePill.textContent=identity.data.handle;$('pills').append(handlePill);
  }
 }
 if(p.k_code){const code=document.createElement('span');code.className='pill';code.textContent='K-Code '+p.k_code;$('pills').append(code)}
 const all=await LinkStoryManga.publishedMangas(),works=all.filter(m=>m.creator_id===p.id),box=$('works');box.replaceChildren();
 if(!works.length){const empty=document.createElement('div');empty.className='empty';empty.innerHTML='<strong>Nenhuma obra publicada ainda.</strong>Quando este perfil publicar uma obra, ela aparecerá aqui.';box.append(empty);return}
 works.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).forEach(m=>{
  const card=document.createElement('article');card.className='work';const cover=document.createElement('div');cover.className='cover';
  if(m.cover_url){const img=document.createElement('img');img.src=m.cover_url;img.alt='Capa de '+(m.title||'mangá');img.loading='lazy';cover.append(img)}else cover.textContent=m.title||'Mangá';
  const title=document.createElement('h3');title.textContent=m.title||'Sem título';const genre=document.createElement('p');genre.textContent=(m.genres||'Mangá').replaceAll(',',' · ');
  const link=document.createElement('a');link.href='manga.html?id='+encodeURIComponent(m.id);link.append(cover,title,genre);link.style.color='inherit';link.style.textDecoration='none';card.append(link);box.append(card);
 });
})().catch(e=>{$('name').textContent='Não foi possível carregar o perfil';$('handle').textContent=e.message||'Tente novamente.'});
</script></body></html>
