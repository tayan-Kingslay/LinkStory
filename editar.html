<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Editar mangá — LinkStory</title><style>:root{--b:#0b72e7;--i:#102033;--m:#66788d;--l:#dbe5ef}*{box-sizing:border-box}body{margin:0;background:#f7faff;color:var(--i);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.top{height:68px;background:#fff;border-bottom:1px solid var(--l);display:flex;align-items:center;padding:0 16px}.brand{font-size:23px;font-weight:950}.brand b{color:var(--b)}main{width:min(680px,calc(100% - 28px));margin:auto;padding:26px 0 90px}.card{background:#fff;border:1px solid var(--l);border-radius:16px;padding:20px;box-shadow:0 8px 28px #10203309}.ey{font-size:10px;letter-spacing:2px;font-weight:900;color:var(--b)}h1{font-size:32px;letter-spacing:-1px;margin:6px 0 18px}.field{display:grid;gap:7px;margin-top:13px}.field label{font-size:13px;font-weight:800}.field input,.field textarea,.field select{width:100%;border:1px solid var(--l);border-radius:10px;padding:11px 12px;background:#fff;color:var(--i);font:inherit}.field textarea{min-height:120px;resize:vertical}.cover{margin-top:17px}.cover-preview{width:150px;aspect-ratio:3/4;border-radius:11px;overflow:hidden;background:#edf4fb;display:grid;place-items:center;color:var(--m);font-size:12px}.cover-preview img{width:100%;height:100%;object-fit:contain}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}.btn{border:1px solid var(--l);background:#fff;color:var(--i);border-radius:11px;padding:12px 14px;font-weight:800}.primary{background:var(--b);border-color:var(--b);color:#fff}.toast{position:fixed;left:50%;bottom:105px;transform:translateX(-50%);background:#102033;color:#fff;padding:12px 16px;border-radius:11px;display:none;z-index:2000}.toast.show{display:block}html[data-ls-theme="dark"] body{background:#111;color:#fff}html[data-ls-theme="dark"] .top,html[data-ls-theme="dark"] .card{background:#151515;border-color:#303030}html[data-ls-theme="dark"] .field input,html[data-ls-theme="dark"] .field textarea,html[data-ls-theme="dark"] .field select{background:#1b1b1b;color:#fff;border-color:#444}html[data-ls-theme="dark"] .btn:not(.primary){background:#1b1b1b;color:#fff;border-color:#444}@media(max-width:560px){main{padding-top:20px}.actions{grid-template-columns:1fr}.cover-preview{margin:auto}}

/* AT3 — Edição rápida de mangá: Liquid Glass, somente visual */
body{
  min-height:100vh;
  background:
    radial-gradient(ellipse at 78% 0%,rgba(11,114,231,.075),transparent 36%),
    radial-gradient(ellipse at 8% 78%,rgba(255,255,255,.9),transparent 42%),
    #f2f5f8!important;
  color:#202a38!important;
}
.top{
  position:sticky!important;top:10px!important;z-index:30!important;
  width:calc(100% - 20px)!important;margin:0 10px!important;
  height:62px!important;padding:0 18px!important;
  border:1px solid rgba(255,255,255,.9)!important;border-radius:16px!important;
  background:rgba(255,255,255,.68)!important;
  -webkit-backdrop-filter:blur(26px) saturate(185%)!important;
  backdrop-filter:blur(26px) saturate(185%)!important;
  box-shadow:0 10px 30px rgba(28,43,63,.07),inset 0 1px 0 #fff!important;
}
.brand{letter-spacing:-1.2px!important}
main{
  width:min(680px,calc(100% - 30px))!important;
  padding:clamp(24px,5vh,44px) 0 calc(44px + env(safe-area-inset-bottom))!important;
}
.card{
  position:relative;overflow:hidden;
  padding:clamp(20px,4vw,30px)!important;
  border:1px solid rgba(255,255,255,.94)!important;border-radius:25px!important;
  background:linear-gradient(145deg,rgba(255,255,255,.86),rgba(255,255,255,.60))!important;
  box-shadow:0 22px 58px rgba(31,48,70,.095),inset 0 1px 0 #fff!important;
  -webkit-backdrop-filter:blur(28px) saturate(180%)!important;
  backdrop-filter:blur(28px) saturate(180%)!important;
}
.card:before{
  content:"";position:absolute;inset:0 16% auto;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.98),transparent);
  pointer-events:none;
}
.ey{letter-spacing:2.2px!important}
h1{font-size:clamp(30px,6vw,38px)!important;letter-spacing:-1.7px!important;margin:8px 0 22px!important}
.field{gap:8px!important;margin-top:17px!important}
.field label{font-size:12px!important;color:#344256!important}
.field input,.field textarea,.field select{
  min-height:48px;padding:12px 14px!important;
  border:1px solid rgba(177,192,210,.55)!important;border-radius:14px!important;
  background:rgba(255,255,255,.76)!important;color:#202a38!important;
  box-shadow:inset 0 1px 3px rgba(25,42,62,.04),0 1px 0 rgba(255,255,255,.82)!important;
  transition:border-color .18s ease,box-shadow .18s ease!important;
}
.field textarea{min-height:132px;line-height:1.55}
.field input:focus,.field textarea:focus,.field select:focus{
  outline:none;border-color:rgba(11,114,231,.58)!important;
  box-shadow:0 0 0 4px rgba(11,114,231,.10),inset 0 1px 3px rgba(25,42,62,.035)!important;
}
.field input[type="file"]{padding:9px!important;cursor:pointer}
.cover-preview{
  width:clamp(130px,38vw,160px)!important;
  border:1px solid rgba(177,192,210,.4)!important;border-radius:16px!important;
  background:linear-gradient(145deg,rgba(233,240,248,.9),rgba(255,255,255,.7))!important;
  box-shadow:0 10px 24px rgba(32,43,58,.10)!important;
}
.cover-preview img{object-fit:contain!important}
.actions{gap:12px!important;margin-top:25px!important}
.btn{
  min-height:48px;padding:12px 16px!important;border:1px solid rgba(177,192,210,.55)!important;
  border-radius:14px!important;background:rgba(255,255,255,.72)!important;
  box-shadow:0 4px 12px rgba(31,48,70,.045),inset 0 1px 0 #fff!important;
  transition:transform .18s ease,box-shadow .18s ease!important;
}
.btn:active{transform:scale(.985)}
.btn.primary{
  border-color:transparent!important;color:#fff!important;
  background:linear-gradient(135deg,#1684f5,#0865d5)!important;
  box-shadow:0 8px 18px rgba(11,114,231,.22),inset 0 1px 0 rgba(255,255,255,.25)!important;
}
.btn:disabled{opacity:.65;cursor:wait}
.toast{
  bottom:calc(24px + env(safe-area-inset-bottom))!important;
  max-width:calc(100% - 28px);text-align:center;
  border:1px solid rgba(255,255,255,.16)!important;border-radius:15px!important;
  background:rgba(20,30,44,.88)!important;
  box-shadow:0 12px 34px rgba(0,0,0,.2)!important;
  -webkit-backdrop-filter:blur(20px)!important;backdrop-filter:blur(20px)!important;
}
@media(max-width:560px){
  .top{top:8px!important}
  main{width:calc(100% - 24px)!important;padding-top:24px!important}
  .card{padding:20px 17px!important;border-radius:22px!important}
  .actions{grid-template-columns:1fr!important}
  .cover-preview{margin:0 auto!important}
}
@media(prefers-reduced-motion:reduce){.field input,.field textarea,.field select,.btn{transition:none!important}}
html[data-ls-theme="dark"] body{
  background:radial-gradient(ellipse at 78% 0%,rgba(32,126,235,.16),transparent 38%),linear-gradient(145deg,#151a22,#202733 58%,#171d26)!important;
  color:#f2f5f9!important;
}
html[data-ls-theme="dark"] .card{
  border-color:rgba(255,255,255,.14)!important;
  background:linear-gradient(145deg,rgba(48,58,72,.88),rgba(29,36,47,.84))!important;
  box-shadow:0 22px 58px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.10)!important;
}
html[data-ls-theme="dark"] .field label{color:#e5ebf3!important}
html[data-ls-theme="dark"] .field input,html[data-ls-theme="dark"] .field textarea,html[data-ls-theme="dark"] .field select{
  color:#f3f6fb!important;background:rgba(19,26,36,.68)!important;border-color:rgba(255,255,255,.14)!important;
}
html[data-ls-theme="dark"] .cover-preview{background:rgba(19,26,36,.7)!important;border-color:rgba(255,255,255,.12)!important}
html[data-ls-theme="dark"] .btn:not(.primary){background:rgba(36,44,56,.8)!important;color:#f3f6fb!important;border-color:rgba(255,255,255,.14)!important}
</style>  <link rel="stylesheet" href="visual-system.css?v=4">
<link rel="stylesheet" href="at3-global.css?v=2">
<link rel="stylesheet" href="visual-refresh.css?v=2">
</head><body><header class="top"><a class="brand" href="index.html">Link<b>Story</b></a></header><main><section class="card"><span class="ey">LINKSTORY · EDIÇÃO</span><h1>Editar mangá</h1><div class="field"><label>Título *</label><input id="title"></div><div class="field"><label>Gênero *</label><input id="genre"></div><div class="field"><label>Classificação</label><select id="rating"><option>Livre</option><option>10 anos</option><option>12 anos</option><option>14 anos</option><option>16 anos</option><option>18 anos</option></select></div><div class="field"><label>Descrição *</label><textarea id="description"></textarea></div><div class="field cover"><label>Trocar capa</label><input id="cover" type="file" accept="image/*"><div class="cover-preview" id="preview">Sem capa</div></div><div class="actions"><button class="btn" id="back">← Voltar</button><button class="btn primary" id="save">Salvar alterações</button></div></section></main><div class="toast" id="toast"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js"></script><script src="manga-db.js"></script><script>(async()=>{const $=id=>document.getElementById(id),id=new URLSearchParams(location.search).get('id');let manga,cover='';const toast=t=>{$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),3000)};const compress=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const max=1800,s=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(i.width*s));c.height=Math.max(1,Math.round(i.height*s));c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/webp',.8))};i.onerror=rej;i.src=r.result};r.onerror=rej;r.readAsDataURL(f)});try{manga=await LinkStoryManga.mangaById(id);const s=await LinkStoryManga.session();if(!manga)throw Error('MANGA_NOT_FOUND');if(!s||s.user.id!==manga.creator_id){toast('Somente o autor pode editar este mangá.');setTimeout(()=>location.href='manga.html?id='+id,900);return}$('title').value=manga.title||'';$('genre').value=manga.genres||'';$('rating').value=manga.age_rating||'Livre';$('description').value=manga.description||'';if(manga.cover_url){cover=manga.cover_url;$('preview').innerHTML='<img src="'+manga.cover_url+'">'}}catch(e){console.error(e);toast('Não foi possível carregar este mangá.')}$('cover').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{cover=await compress(f);$('preview').innerHTML='<img src="'+cover+'">'}catch{toast('Não consegui carregar a capa.')}};$('back').onclick=()=>history.back();$('save').onclick=async()=>{const title=$('title').value.trim(),genre=$('genre').value.trim(),description=$('description').value.trim();if(!title||!genre||!description){toast('Preencha título, gênero e descrição.');return}$('save').disabled=true;$('save').textContent='Salvando…';try{await LinkStoryManga.updateManga(id,{title,genre,rating:$('rating').value,description,cover:cover&&cover.startsWith('data:')?cover:''});toast('Alterações salvas!');setTimeout(()=>location.href='manga.html?id='+id,600)}catch(e){console.error(e);toast('Erro ao salvar: '+(e?.message||e?.code||'tente novamente'));$('save').disabled=false;$('save').textContent='Salvar alterações'}}})();</script></body></html>
