<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Editar mangá — LinkStory</title><style>:root{--b:#0b72e7;--i:#102033;--m:#66788d;--l:#dbe5ef}*{box-sizing:border-box}body{margin:0;background:#f7faff;color:var(--i);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.top{height:68px;background:#fff;border-bottom:1px solid var(--l);display:flex;align-items:center;padding:0 16px}.brand{font-size:23px;font-weight:950}.brand b{color:var(--b)}main{width:min(680px,calc(100% - 28px));margin:auto;padding:26px 0 90px}.card{background:#fff;border:1px solid var(--l);border-radius:16px;padding:20px;box-shadow:0 8px 28px #10203309}.ey{font-size:10px;letter-spacing:2px;font-weight:900;color:var(--b)}h1{font-size:32px;letter-spacing:-1px;margin:6px 0 18px}.field{display:grid;gap:7px;margin-top:13px}.field label{font-size:13px;font-weight:800}.field input,.field textarea,.field select{width:100%;border:1px solid var(--l);border-radius:10px;padding:11px 12px;background:#fff;color:var(--i);font:inherit}.field textarea{min-height:120px;resize:vertical}.cover{margin-top:17px}.cover-preview{width:150px;aspect-ratio:3/4;border-radius:11px;overflow:hidden;background:#edf4fb;display:grid;place-items:center;color:var(--m);font-size:12px}.cover-preview img{width:100%;height:100%;object-fit:contain}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}.btn{border:1px solid var(--l);background:#fff;color:var(--i);border-radius:11px;padding:12px 14px;font-weight:800}.primary{background:var(--b);border-color:var(--b);color:#fff}.toast{position:fixed;left:50%;bottom:105px;transform:translateX(-50%);background:#102033;color:#fff;padding:12px 16px;border-radius:11px;display:none;z-index:2000}.toast.show{display:block}html[data-ls-theme="dark"] body{background:#111;color:#fff}html[data-ls-theme="dark"] .top,html[data-ls-theme="dark"] .card{background:#151515;border-color:#303030}html[data-ls-theme="dark"] .field input,html[data-ls-theme="dark"] .field textarea,html[data-ls-theme="dark"] .field select{background:#1b1b1b;color:#fff;border-color:#444}html[data-ls-theme="dark"] .btn:not(.primary){background:#1b1b1b;color:#fff;border-color:#444}@media(max-width:560px){main{padding-top:20px}.actions{grid-template-columns:1fr}.cover-preview{margin:auto}}
</style></head><body><header class="top"><a class="brand" href="index.html">Link<b>Story</b></a></header><main><section class="card"><span class="ey">LINKSTORY · EDIÇÃO</span><h1>Editar mangá</h1><div class="field"><label>Título *</label><input id="title"></div><div class="field"><label>Gênero *</label><input id="genre"></div><div class="field"><label>Classificação</label><select id="rating"><option>Livre</option><option>10 anos</option><option>12 anos</option><option>14 anos</option><option>16 anos</option><option>18 anos</option></select></div><div class="field"><label>Descrição *</label><textarea id="description"></textarea></div><div class="field cover"><label>Trocar capa</label><input id="cover" type="file" accept="image/*"><div class="cover-preview" id="preview">Sem capa</div></div><div class="actions"><button class="btn" id="back">← Voltar</button><button class="btn primary" id="save">Salvar alterações</button></div></section></main><div class="toast" id="toast"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js"></script><script src="manga-db.js"></script><script>(async()=>{const $=id=>document.getElementById(id),id=new URLSearchParams(location.search).get('id');let manga,cover='';const toast=t=>{$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),3000)};const compress=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const max=1800,s=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(i.width*s));c.height=Math.max(1,Math.round(i.height*s));c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/webp',.8))};i.onerror=rej;i.src=r.result};r.onerror=rej;r.readAsDataURL(f)});try{manga=await LinkStoryManga.mangaById(id);const s=await LinkStoryManga.session();if(!manga)throw Error('MANGA_NOT_FOUND');if(!s||s.user.id!==manga.creator_id){toast('Somente o autor pode editar este mangá.');setTimeout(()=>location.href='manga.html?id='+id,900);return}$('title').value=manga.title||'';$('genre').value=manga.genres||'';$('rating').value=manga.age_rating||'Livre';$('description').value=manga.description||'';if(manga.cover_url){cover=manga.cover_url;$('preview').innerHTML='<img src="'+manga.cover_url+'">'}}catch(e){console.error(e);toast('Não foi possível carregar este mangá.')}$('cover').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{cover=await compress(f);$('preview').innerHTML='<img src="'+cover+'">'}catch{toast('Não consegui carregar a capa.')}};$('back').onclick=()=>history.back();$('save').onclick=async()=>{const title=$('title').value.trim(),genre=$('genre').value.trim(),description=$('description').value.trim();if(!title||!genre||!description){toast('Preencha título, gênero e descrição.');return}$('save').disabled=true;$('save').textContent='Salvando…';try{await LinkStoryManga.updateManga(id,{title,genre,rating:$('rating').value,description,cover:cover&&cover.startsWith('data:')?cover:''});toast('Alterações salvas!');setTimeout(()=>location.href='manga.html?id='+id,600)}catch(e){console.error(e);toast('Erro ao salvar: '+(e?.message||e?.code||'tente novamente'));$('save').disabled=false;$('save').textContent='Salvar alterações'}}})();</script></body></html>
