</head><body><header class="top"><a class="circle back" href="index.html" aria-label="Voltar">‹</a><a class="brand" href="index.html" aria-label="LinkStory"><img src="assets/linkstory-logo.svg" alt="LinkStory"></a><button class="circle menu" id="openMenu" aria-label="Menu"></button></header><dialog class="menu-dialog" id="menuDialog"><div class="menu-wrap"><div class="menu-head"><strong>LINKSTORY</strong><button class="close" id="closeMenu">×</button></div><nav class="menu-list"><a href="profile.html">Perfil <strong>›</strong></a><a href="studio.html">Meu Estúdio <strong>›</strong></a><a href="publish.html">Publicar mangá <strong>›</strong></a><a href="settings.html">Configurações <strong>›</strong></a><a href="login.html">Entrar <strong>›</strong></a></nav></div></dialog><main><div class="search"><input id="search" placeholder="Buscar mangá, autor ou gênero" aria-label="Buscar mangá, autor ou gênero"></div><section class="suggestions" id="suggestions"><div class="suggestions-head">SUGESTÃO DE MANGÁ</div><div class="suggestion-row" id="suggestionRow"></div></section><section><div class="grid" id="grid"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js"></script><script src="verification.js?v=1"></script><script src="manga-db.js?v=20261109-1"></script><script>(async()=>{const d=document.getElementById('menuDialog'),grid=document.getElementById('grid'),search=document.getElementById('search'),suggestionRow=document.getElementById('suggestionRow');document.getElementById('openMenu').onclick=()=>d.showModal();document.getElementById('closeMenu').onclick=()=>d.close();d.addEventListener('click',e=>{if(e.target===d)d.close()});let cards=[];const esc=v=>String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]));const initials=v=>String(v||'Criador').trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase();const renderCreatorSuggestions=ms=>{const see
