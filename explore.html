<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff"><title>Explorar — LinkStory</title><style>:root{--blue:#0878ef;--ink:#102033;--muted:#71859a;--line:#dbe6f0;--soft:#f4f8fc}*{box-sizing:border-box}html,body{margin:0;background:linear-gradient(180deg,#fff 0%,#fff 72%,#f7fbff 100%);color:var(--ink);font-family:'DM Sans',Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}a{text-decoration:none;color:inherit}.top{height:98px;border-bottom:2px solid var(--line);display:flex;align-items:center;padding:0 30px;gap:28px;background:rgba(255,255,255,.96);position:sticky;top:0;z-index:10;backdrop-filter:blur(10px)}.circle{width:64px;height:64px;border:2px solid var(--line);border-radius:50%;display:grid;place-items:center;background:#fff;box-shadow:0 4px 14px rgba(31,73,125,.05)}.back{font-size:42px;line-height:1;color:var(--ink);padding-bottom:4px}.brand img{display:block;width:290px;height:72px;object-fit:contain}.menu{margin-left:auto;font-size:0}.menu:before{content:"";width:27px;height:22px;background:linear-gradient(var(--blue) 0 3px,transparent 3px 9.5px,var(--blue) 9.5px 12.5px,transparent 12.5px 19px,var(--blue) 19px 22px);display:block}main{width:100%;padding:20px 30px 140px}.search{display:flex;justify-content:center;margin:0 0 28px}.search input{width:510px;max-width:100%;height:72px;border:2px solid var(--line);border-radius:22px;padding:0 32px;background:#fff;box-shadow:0 7px 24px rgba(39,92,148,.07);font:400 28px/1 'DM Sans',Arial,sans-serif;color:var(--ink);outline:none}.search input:focus{border-color:#9ec9f7;box-shadow:0 8px 28px rgba(8,120,239,.12)}.search input::placeholder{color:#a7aeb6;opacity:1}.suggestions{display:block;margin:0}.suggestions-head{font-family:Arial,Helvetica,sans-serif;font-size:25px;font-weight:900;letter-spacing:3px;color:#111;margin:0 0 18px}.suggestion-row{display:grid;grid-template-columns:repeat(4,1fr);gap:48px;overflow:hidden;padding:0 0 27px;border-bottom:3px solid #111}.suggestion-item{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}.suggestion{width:100%;aspect-ratio:1;border:4px solid #fff;border-radius:50%;overflow:hidden;background:linear-gradient(145deg,#dcecff,#a9d0fa);display:grid;place-items:center;box-shadow:0 7px 20px rgba(27,78,130,.15),inset 0 0 0 1px #c8d9ea}.suggestion img{width:100%;height:100%;object-fit:cover}.suggestion span{font-size:15px;text-align:center;padding:0 5px;color:var(--ink);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}.suggestion .initials{font-size:25px;font-weight:900;color:#fff;text-shadow:0 1px 5px rgba(0,0,0,.15)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;margin-top:58px}.card{border:1px solid #d7e4ef;border-radius:18px;overflow:hidden;background:#fff;min-width:0;box-shadow:0 9px 28px rgba(27,75,120,.09);transition:transform .18s ease,box-shadow .18s ease}.card:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(27,75,120,.14)}.card.hidden{display:none}.cover{height:390px;background:linear-gradient(145deg,#e9f3ff,#d7e8fa);display:grid;place-items:center;padding:0;text-align:center;font-weight:800;color:#27547d;overflow:hidden;position:relative}.cover:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(120deg,rgba(255,255,255,.18),transparent 40%,rgba(8,120,239,.06))}.cover img{display:block;width:100%;height:100%;object-fit:cover}.cover-title{padding:20px;font-size:18px}.empty-state{grid-column:1/-1;border:1px dashed #cbdceb;border-radius:20px;background:linear-gradient(145deg,#fff,#f7fbff);padding:55px 25px;text-align:center;box-shadow:0 8px 25px rgba(31,73,125,.05)}.empty-state strong{display:block;font-size:22px;margin-bottom:7px}.empty-state span{color:var(--muted);font-size:16px}.menu-dialog{width:min(100%,560px);height:100dvh;max-height:none;margin:0 0 0 auto;border:0;padding:0;background:#fff}.menu-wrap{padding:28px 24px;height:100%}.menu-head{display:flex;justify-content:space-between;align-items:center;padding-bottom:24px;border-bottom:1px solid var(--line)}.menu-head strong{font-weight:800;letter-spacing:3px;color:var(--blue)}.close{border:0;background:none;font-size:38px}.menu-list a{display:flex;justify-content:space-between;padding:21px 0;border-bottom:1px solid var(--line);font-size:19px;font-weight:700}.menu-list strong{font-size:28px;color:#71879d;font-weight:400}@media(max-width:800px){.top{height:74px;padding:0 28px;gap:18px}.circle{width:46px;height:46px}.back{font-size:31px}.brand img{width:155px;height:50px}.menu:before{width:21px;height:17px;background:linear-gradient(var(--blue) 0 2px,transparent 2px 7.5px,var(--blue) 7.5px 9.5px,transparent 9.5px 15px,var(--blue) 15px 17px)}main{padding:20px 28px 120px}.search{margin-bottom:55px}.search input{width:55%;height:56px;border-radius:17px;padding:0 22px;font-size:20px}.suggestions-head{font-size:16px;letter-spacing:2.2px;margin-bottom:14px}.suggestion-row{gap:16px;padding-bottom:20px;border-bottom-width:2px}.suggestion-item{gap:6px}.suggestion{border-width:3px;box-shadow:0 5px 14px rgba(27,78,130,.13),inset 0 0 0 1px #c8d9ea}.suggestion span{font-size:11px}.suggestion .initials{font-size:18px}.grid{gap:14px;margin-top:62px}.cover{height:250px}.empty-state{padding:40px 18px}.menu-list a{font-size:17px;padding:19px 0}}@media(max-width:420px){.top{padding:0 20px;gap:12px}.brand img{width:145px}.search input{width:55%;font-size:18px}.suggestion-row{gap:10px}.grid{gap:10px;margin-top:52px}.cover{height:190px}.empty-state strong{font-size:19px}.empty-state span{font-size:14px}}
</style></head><body><header class="top"><a class="circle back" href="index.html" aria-label="Voltar">‹</a><a class="brand" href="index.html" aria-label="LinkStory"><img src="assets/linkstory-logo.svg" alt="LinkStory"></a><button class="circle menu" id="openMenu" aria-label="Menu"></button></header><dialog class="menu-dialog" id="menuDialog"><div class="menu-wrap"><div class="menu-head"><strong>LINKSTORY</strong><button class="close" id="closeMenu">×</button></div><nav class="menu-list"><a href="profile.html">Perfil <strong>›</strong></a><a href="studio.html">Meu Estúdio <strong>›</strong></a><a href="publish.html">Publicar mangá <strong>›</strong></a><a href="settings.html">Configurações <strong>›</strong></a><a href="login.html">Entrar <strong>›</strong></a></nav></div></dialog><main><div class="search"><input id="search" placeholder="Buscar mangá, autor ou gênero" aria-label="Buscar mangá, autor ou gênero"></div><section class="suggestions" id="suggestions"><div class="suggestions-head">SUGESTÃO DE MANGÁ</div><div class="suggestion-row" id="suggestionRow"></div></section><section><div class="grid" id="grid"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js"></script><script src="manga-db.js"></script><script>(async()=>{const d=document.getElementById('menuDialog'),grid=document.getElementById('grid'),search=document.getElementById('search'),suggestionRow=document.getElementById('suggestionRow');document.getElementById('openMenu').onclick=()=>d.showModal();document.getElementById('closeMenu').onclick=()=>d.close();d.addEventListener('click',e=>{if(e.target===d)d.close()});let cards=[];const esc=v=>String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]));const initials=v=>String(v||'Criador').trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase();const renderCreatorSuggestions=ms=>{const seen=new Set(),creators=[];ms.forEach(m=>{const p=m.profiles;if(!p||seen.has(m.creator_id))return;seen.add(m.creator_id);creators.push({id:m.creator_id,name:p.display_name||p.username||'Criador',avatar:p.avatar_url})});suggestionRow.innerHTML='';creators.slice(0,4).forEach(p=>{const a=document.createElement('a');a.className='suggestion-item';a.href='profile.html?username='+encodeURIComponent(p.name);a.innerHTML='<div class="suggestion">'+(p.avatar?'<img src="'+esc(p.avatar)+'" alt="Perfil de '+esc(p.name)+'">':'<span class="initials">'+esc(initials(p.name))+'</span>')+'</div><span>'+esc(p.name)+'</span>';suggestionRow.append(a)});for(let i=creators.length;i<4;i++){const x=document.createElement('div');x.className='suggestion-item';x.innerHTML='<div class="suggestion"></div>';suggestionRow.append(x)}};try{const ms=await LinkStoryManga.publishedMangas();if(ms.length){const shuffled=[...ms].sort(()=>Math.random()-.5);grid.innerHTML='';shuffled.forEach(m=>{const a=document.createElement('a');a.className='card';a.dataset.text=(m.title+' '+(m.profiles?.display_name||'')+' '+(m.profiles?.username||'')+' '+(m.genres||'')).toLowerCase();a.href='manga.html?id='+m.id;a.innerHTML='<div class="cover">'+(m.cover_url?'<img src="'+esc(m.cover_url)+'" alt="Capa de '+esc(m.title)+'">':'<div class="cover-title">'+esc(m.title)+'</div>')+'</div>';grid.append(a);cards.push(a)});renderCreatorSuggestions(ms)}else{suggestionRow.innerHTML='<div class="suggestion-item"><div class="suggestion"></div></div><div class="suggestion-item"><div class="suggestion"></div></div><div class="suggestion-item"><div class="suggestion"></div></div><div class="suggestion-item"><div class="suggestion"></div></div>';grid.innerHTML='<div class="empty-state"><strong>Ainda não há mangás publicados.</strong><span>Quando os criadores publicarem, eles aparecerão aqui para você explorar.</span></div>'}}catch(e){console.error(e);grid.innerHTML='<div class="empty-state"><strong>Não foi possível carregar as publicações.</strong><span>Tente novamente em alguns instantes.</span></div>';suggestionRow.innerHTML=''}function apply(){const q=search.value.trim().toLowerCase();cards.forEach(c=>c.classList.toggle('hidden',!!q&&!c.dataset.text.includes(q)))}search.oninput=apply})();</script></body></html>
