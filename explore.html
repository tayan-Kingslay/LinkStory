<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff"><title>Explorar — LinkStory</title><style>:root{--blue:#0878ef;--ink:#0f2033;--muted:#71859a;--line:#dbe6f0}*{box-sizing:border-box}html,body{margin:0;background:#fff;color:var(--ink);font-family:'DM Sans',Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}a{text-decoration:none;color:inherit}.top{height:98px;border-bottom:2px solid var(--line);display:flex;align-items:center;padding:0 30px;gap:28px;background:#fff;position:sticky;top:0;z-index:10}.circle{width:64px;height:64px;border:2px solid var(--line);border-radius:50%;display:grid;place-items:center;background:#fff}.back{font-size:42px;line-height:1;color:var(--ink);padding-bottom:4px}.brand img{display:block;width:290px;height:72px;object-fit:contain}.menu{margin-left:auto;font-size:0}.menu:before{content:"";width:27px;height:22px;background:linear-gradient(var(--blue) 0 3px,transparent 3px 9.5px,var(--blue) 9.5px 12.5px,transparent 12.5px 19px,var(--blue) 19px 22px);display:block}main{width:100%;padding:20px 30px 130px}.search{display:flex;justify-content:center;margin:0 0 27px}.search input{width:510px;max-width:100%;height:72px;border:2px solid var(--line);border-radius:22px;padding:0 32px;font:400 28px/1 'DM Sans',Arial,sans-serif;color:var(--ink);outline:none}.search input::placeholder{color:#a7aeb6;opacity:1}.suggestions{display:block;margin:0}.suggestions-head{font-family:Arial,Helvetica,sans-serif;font-size:25px;font-weight:900;letter-spacing:3px;color:#000;margin:0 0 18px}.suggestion-row{display:grid;grid-template-columns:repeat(4,1fr);gap:48px;overflow:hidden;padding:0 0 25px;border-bottom:3px solid #000}.suggestion{aspect-ratio:1;border:4px solid #111;border-radius:50%;overflow:hidden;background:#fff;display:grid;place-items:center;min-width:0}.suggestion img{width:100%;height:100%;object-fit:cover}.suggestion span{font-size:15px;text-align:center;padding:12px;color:#111;font-weight:700}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;margin-top:92px}.card{border:3px solid #111;border-radius:0;overflow:hidden;background:#fff;min-width:0}.card.hidden{display:none}.cover{height:390px;background:#fff;display:grid;place-items:center;padding:0;text-align:center;font-weight:800;color:#111}.cover img{display:block;width:100%;height:100%;object-fit:cover}.empty-card{height:390px;border:3px solid #111;background:#fff}.menu-dialog{width:min(100%,560px);height:100dvh;max-height:none;margin:0 0 0 auto;border:0;padding:0;background:#fff}.menu-wrap{padding:28px 24px;height:100%}.menu-head{display:flex;justify-content:space-between;align-items:center;padding-bottom:24px;border-bottom:1px solid var(--line)}.menu-head strong{font-weight:800;letter-spacing:3px;color:var(--blue)}.close{border:0;background:none;font-size:38px}.menu-list a{display:flex;justify-content:space-between;padding:21px 0;border-bottom:1px solid var(--line);font-size:19px;font-weight:700}.menu-list strong{font-size:28px;color:#71879d;font-weight:400}@media(max-width:800px){.top{height:74px;padding:0 28px;gap:18px}.circle{width:46px;height:46px}.back{font-size:31px}.brand img{width:155px;height:50px}.menu:before{width:21px;height:17px;background:linear-gradient(var(--blue) 0 2px,transparent 2px 7.5px,var(--blue) 7.5px 9.5px,transparent 9.5px 15px,var(--blue) 15px 17px)}main{padding:20px 28px 120px}.search{margin-bottom:25px}.search input{width:55%;height:56px;border-radius:17px;padding:0 22px;font-size:20px}.suggestions-head{font-size:16px;letter-spacing:2.2px;margin-bottom:14px}.suggestion-row{gap:16px;padding-bottom:18px;border-bottom-width:2px}.suggestion{border-width:3px}.suggestion span{font-size:11px;padding:7px}.grid{gap:14px;margin-top:62px}.cover,.empty-card{height:250px}.menu-list a{font-size:17px;padding:19px 0}}@media(max-width:420px){.top{padding:0 20px;gap:12px}.brand img{width:145px}.search input{width:55%;font-size:18px}.suggestion-row{gap:10px}.grid{gap:9px;margin-top:52px}.cover,.empty-card{height:190px}}
</style></head><body><header class="top"><a class="circle back" href="index.html" aria-label="Voltar">‹</a><a class="brand" href="index.html" aria-label="LinkStory"><img src="assets/linkstory-logo.svg" alt="LinkStory"></a><button class="circle menu" id="openMenu" aria-label="Menu"></button></header><dialog class="menu-dialog" id="menuDialog"><div class="menu-wrap"><div class="menu-head"><strong>LINKSTORY</strong><button class="close" id="closeMenu">×</button></div><nav class="menu-list"><a href="profile.html">Perfil <strong>›</strong></a><a href="studio.html">Meu Estúdio <strong>›</strong></a><a href="publish.html">Publicar mangá <strong>›</strong></a><a href="settings.html">Configurações <strong>›</strong></a><a href="login.html">Entrar <strong>›</strong></a></nav></div></dialog><main><div class="search"><input id="search" placeholder="Buscar mangá, autor ou gênero" aria-label="Buscar mangá, autor ou gênero"></div><section class="suggestions" id="suggestions"><div class="suggestions-head">SUGESTÃO DE MANGÁ</div><div class="suggestion-row" id="suggestionRow"></div></section><section><div class="grid" id="grid"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js"></script><script src="manga-db.js"></script><script>(async()=>{const d=document.getElementById('menuDialog'),grid=document.getElementById('grid'),search=document.getElementById('search'),suggestionRow=document.getElementById('suggestionRow');document.getElementById('openMenu').onclick=()=>d.showModal();document.getElementById('closeMenu').onclick=()=>d.close();d.addEventListener('click',e=>{if(e.target===d)d.close()});let cards=[];const renderPlaceholders=()=>{grid.innerHTML='';for(let i=0;i<6;i++){const x=document.createElement('div');x.className='empty-card';grid.append(x)};suggestionRow.innerHTML='';for(let i=0;i<4;i++){const x=document.createElement('div');x.className='suggestion';suggestionRow.append(x)}};try{const ms=await LinkStoryManga.publishedMangas();if(ms.length){grid.innerHTML='';ms.forEach(m=>{const a=document.createElement('a');a.className='card';a.dataset.text=(m.title+' '+(m.profiles?.display_name||'')+' '+(m.genres||'')).toLowerCase();a.href='manga.html?id='+m.id;a.innerHTML='<div class="cover">'+(m.cover_url?'<img src="'+m.cover_url+'" alt="Capa de '+m.title+'">':m.title)+'</div>';grid.append(a);cards.push(a)});suggestionRow.innerHTML='';ms.slice(0,4).forEach(m=>{const a=document.createElement('a');a.className='suggestion';a.href='manga.html?id='+m.id;a.innerHTML=m.cover_url?'<img src="'+m.cover_url+'" alt="Capa de '+m.title+'">':'<span>'+m.title+'</span>';suggestionRow.append(a)});for(let i=ms.length;i<6;i++){const x=document.createElement('div');x.className='empty-card';grid.append(x)}}else renderPlaceholders()}catch(e){console.error(e);renderPlaceholders()}function apply(){const q=search.value.trim().toLowerCase();cards.forEach(c=>c.classList.toggle('hidden',!!q&&!c.dataset.text.includes(q)))}search.oninput=apply})();</script></body></html>
