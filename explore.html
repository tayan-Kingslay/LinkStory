<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Explorar — LinkStory</title><style>:root{--b:#0b72e7;--i:#102033;--m:#66788d;--l:#dbe5ef;--s:#f5f9fd}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--i);font-family:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}a{text-decoration:none;color:inherit}.top{height:86px;border-bottom:1px solid var(--l);display:flex;align-items:center;padding:0 max(22px,calc((100% - 1080px)/2));gap:34px;position:sticky;top:0;background:#fff;z-index:5}.circle{width:48px;height:48px;border:1px solid var(--l);border-radius:50%;display:grid;place-items:center;background:#fff;flex:none}.back{font-size:29px}.brand{font-size:31px;font-weight:800;letter-spacing:-1.8px}.brand b{color:var(--b)}.page-name{margin-left:auto;color:var(--m);font-size:17px;font-weight:700}.menu{margin-left:22px;font-size:0}.menu:before{content:'☰';font-size:22px;color:var(--b)}main{width:min(1080px,calc(100% - 48px));margin:auto;padding:66px 0 100px}.ey{font-size:12px;font-weight:800;letter-spacing:3px;color:var(--b)}h1{font-size:clamp(60px,8vw,88px);line-height:.98;letter-spacing:-4px;margin:13px 0 25px;font-weight:800}.intro{color:var(--m);max-width:720px;font-size:22px;line-height:1.55;margin:0}.search{display:flex;gap:12px;margin:42px 0 24px}.search input{flex:1;height:58px;border:2px solid var(--l);border-radius:15px;padding:0 18px;font:500 18px 'DM Sans',sans-serif;color:var(--i);outline:none}.search input:focus{border-color:#a9cbed}.search button{height:58px;border:0;border-radius:15px;background:var(--b);color:#fff;padding:0 24px;font-weight:800;font-size:16px}.filters{display:flex;gap:12px;overflow:auto;margin:0 -4px 46px;padding:3px 4px 8px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.filter{white-space:nowrap;border:2px solid var(--l);background:#fff;border-radius:99px;padding:13px 20px;font-size:15px;font-weight:700;color:var(--b)}.filter.active{background:var(--i);border-color:var(--i);color:#fff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}.card{border:1px solid var(--l);border-radius:18px;overflow:hidden;background:#fff;transition:.18s}.card:hover{transform:translateY(-3px);box-shadow:0 12px 28px #10203312}.card.hidden{display:none}.cover{height:300px;background:#eaf4ff center/cover no-repeat;display:grid;place-items:center;padding:13px;text-align:center;font-weight:800;color:#1b4f7e}.cover img{display:block}.info{padding:16px}.info h3{margin:0 0 6px;font-size:18px;font-weight:800;letter-spacing:-.4px}.info p{margin:0 0 12px;font-size:13px;color:var(--m)}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{background:var(--s);border-radius:99px;padding:6px 9px;font-size:10px;font-weight:700;color:#587086}.empty{padding:82px 24px;text-align:center;border:2px dashed var(--l);border-radius:20px;color:var(--m);font-size:16px}.empty strong{display:block;color:var(--i);font-size:23px;margin-bottom:9px;font-weight:800}.menu-dialog{width:min(100%,560px);height:100dvh;max-height:none;margin:0 0 0 auto;border:0;padding:0;background:#fff}.menu-wrap{padding:28px 24px;height:100%}.menu-head{display:flex;justify-content:space-between;align-items:center;padding-bottom:24px;border-bottom:1px solid var(--l)}.menu-head strong{font-weight:800;letter-spacing:3px;color:var(--b)}.close{border:0;background:none;font-size:38px}.menu-list a{display:flex;justify-content:space-between;padding:21px 0;border-bottom:1px solid var(--l);font-size:19px;font-weight:700}.menu-list strong{font-size:28px;color:#71879d;font-weight:400}@media(max-width:800px){.top{height:74px;padding:0 16px;gap:12px}.circle{width:44px;height:44px}.brand{font-size:26px}.page-name{font-size:15px}.menu{margin-left:8px}main{width:calc(100% - 32px);padding:48px 0 90px}.ey{font-size:11px}h1{font-size:clamp(53px,15vw,72px);letter-spacing:-3px;margin-bottom:18px}.intro{font-size:18px}.search{display:block;margin-top:30px}.search input{width:100%;height:54px}.search button{width:100%;height:54px;margin-top:9px}.filters{margin-bottom:34px}.filter{padding:11px 17px}.grid{grid-template-columns:repeat(2,1fr);gap:14px}.cover{height:220px}.info{padding:12px}.info h3{font-size:16px}.empty{padding:60px 18px}.empty strong{font-size:20px}}@media(max-width:480px){.brand{font-size:24px}.page-name{font-size:14px}.grid{gap:10px}.cover{height:190px}.menu-list a{font-size:17px;padding:19px 0}}</style></head><body><header class="top"><a class="circle back" href="index.html">‹</a><a class="brand" href="index.html">Link<b>Story</b></a><span class="page-name">Explorar</span><button class="circle menu" id="openMenu" aria-label="Menu"></button></header><dialog class="menu-dialog" id="menuDialog"><div class="menu-wrap"><div class="menu-head"><strong>LINKSTORY</strong><button class="close" id="closeMenu">×</button></div><nav class="menu-list"><a href="profile.html">Perfil <strong>›</strong></a><a href="studio.html">Meu Estúdio <strong>›</strong></a><a href="publish.html">Publicar mangá <strong>›</strong></a><a href="settings.html">Configurações <strong>›</strong></a><a href="login.html">Entrar <strong>›</strong></a></nav></div></dialog><main><span class="ey">LINKSTORY · DESCOBERTA</span><h1>Explorar.</h1><p class="intro">Aqui aparecem somente mangás que criadores realmente publicaram no LinkStory.</p><div class="search"><input id="search" placeholder="Buscar mangá, autor ou gênero"><button id="go">Buscar</button></div><div class="filters"><button class="filter active" data-f="Todos">Todos</button><button class="filter" data-f="Ação">Ação</button><button class="filter" data-f="Aventura">Aventura</button><button class="filter" data-f="Fantasia">Fantasia</button><button class="filter" data-f="Romance">Romance</button><button class="filter" data-f="Drama">Drama</button><button class="filter" data-f="Comédia">Comédia</button></div><section><span class="ey">PUBLICADOS</span><div class="grid" id="grid"><div class="empty" style="grid-column:1/-1"><strong>Nenhum mangá publicado ainda.</strong>Quando alguém publicar, ele aparecerá aqui.</div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js"></script><script src="manga-db.js"></script><script>(async()=>{const d=document.getElementById('menuDialog');openMenu.onclick=()=>d.showModal();closeMenu.onclick=()=>d.close();d.addEventListener('click',e=>{if(e.target===d)d.close()});const grid=document.getElementById('grid'),search=document.getElementById('search');let cards=[];try{const ms=await LinkStoryManga.publishedMangas();if(ms.length)grid.innerHTML='';ms.forEach(m=>{const a=document.createElement('a');a.className='card';a.dataset.genres=m.genres||'';a.dataset.text=(m.title+' '+(m.profiles?.display_name||'')+' '+(m.genres||'')).toLowerCase();a.href='manga.html?id='+m.id;a.innerHTML='<div class="cover">'+(m.cover_url?'<img src="'+m.cover_url+'" style="width:100%;height:100%;object-fit:cover">':m.title)+'</div><div class="info"><h3>'+m.title+'</h3><p>'+(m.profiles?.display_name||m.profiles?.username||'Criador')+'</p><div class="chips">'+(m.genres||'').split(',').map(x=>x.trim()).filter(Boolean).slice(0,3).map(x=>'<span class="chip">'+x+'</span>').join('')+'</div></div>';grid.append(a);cards.push(a)})}catch(e){console.error(e);grid.innerHTML='<div class="empty" style="grid-column:1/-1"><strong>Não foi possível carregar as publicações.</strong>Tente novamente.</div>'}function apply(){const q=search.value.trim().toLowerCase(),f=document.querySelector('.filter.active').dataset.f;cards.forEach(c=>c.classList.toggle('hidden',!!(q&&!c.dataset.text.includes(q))||(f!=='Todos'&&!c.dataset.genres.toLowerCase().includes(f.toLowerCase()))))}document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');apply()});search.oninput=apply;go.onclick=apply})();</script></body></html>
