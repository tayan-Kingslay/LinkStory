<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Perfil — LinkStory</title><style>:root{--b:#0b72e7;--i:#102033;--m:#66788d;--l:#dbe5ef}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#fff,#f4f9ff);color:var(--i);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{text-decoration:none;color:inherit}.top{height:68px;border-bottom:1px solid var(--l);display:flex;align-items:center;padding:0 16px}.back{width:42px;height:42px;border:1px solid var(--l);border-radius:50%;display:grid;place-items:center;font-size:25px;background:#fff}.brand{margin-left:auto;font-size:24px;font-weight:950}.brand b{color:var(--b)}main{width:min(900px,calc(100% - 24px));margin:auto;padding:35px 0 70px}.profile{display:flex;gap:22px;align-items:center;padding:20px 0 30px;border-bottom:1px solid var(--l)}.avatar{width:110px;height:110px;border:1px solid var(--l);border-radius:50%;display:grid;place-items:center;color:#9aabbd}.avatar svg{width:65px}.ey{font-size:11px;font-weight:900;letter-spacing:2.4px;color:var(--b)}h1{font-size:clamp(44px,7vw,68px);letter-spacing:-4px;margin:6px 0}.muted{color:var(--m);font-size:13px}.section{margin-top:32px}.head{display:flex;justify-content:space-between;align-items:end}.head h2{font-size:27px;margin:6px 0}.publish{color:var(--b);font-weight:900;font-size:13px}.empty{margin-top:15px;border:1px dashed var(--l);border-radius:15px;padding:45px 20px;text-align:center;color:var(--m);background:#fff}.empty strong{display:block;color:var(--i);margin-bottom:6px}.works{display:grid;gap:12px;margin-top:15px}.work{display:flex;gap:15px;align-items:center;border:1px solid var(--l);border-radius:15px;padding:12px;background:#fff}.cover{width:80px;height:108px;border-radius:9px;background:#eaf4ff center/cover no-repeat;display:grid;place-items:center;font-weight:900;color:#1b4f7e;flex:none}.info{flex:1;min-width:0}.info h3{margin:0 0 5px;font-size:19px}.info p{margin:0;color:var(--m);font-size:12px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.btn{border:1px solid var(--l);border-radius:9px;padding:9px 12px;background:#fff;color:var(--b);font-size:11px;font-weight:900}.primary{background:var(--b);color:#fff;border-color:var(--b)}@media(max-width:600px){.profile{gap:15px}.avatar{width:88px;height:88px}.cover{width:68px;height:92px}.work{align-items:flex-start}.actions{display:grid;grid-template-columns:1fr}}</style></head><body><header class="top"><a class="back" href="index.html">‹</a><a class="brand" href="index.html">Link<b>Story</b></a></header><main><section class="profile"><div class="avatar"><svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="4"><circle cx="50" cy="34" r="13"/><path d="M24 82c3-20 14-30 26-30s23 10 26 30"/><circle cx="50" cy="50" r="46"/></svg></div><div><span class="ey">LINKSTORY · PERFIL</span><h1 id="name">Perfil</h1><div class="muted" id="handle">Entre para ver suas obras.</div></div></section><section class="section"><div class="head"><div><span class="ey">PUBLICAÇÕES</span><h2>Minhas obras</h2></div><a class="publish" href="publish.html">Publicar →</a></div><div id="empty" class="empty"><strong>Nenhuma obra publicada.</strong>Quando você publicar, ela aparecerá aqui.</div><div id="works" class="works"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js"></script><script src="manga-db.js"></script><script>(async()=>{try{const s=await LinkStoryManga.session();if(!s){document.getElementById('name').textContent='Visitante';return}const p=await LinkStoryManga.currentProfile(),all=await LinkStoryManga.publishedMangas(),ms=all.filter(m=>m.creator_id===s.user.id);document.getElementById('name').textContent=p?.display_name||s.user.user_metadata?.full_name||'Usuário';document.getElementById('handle').textContent=p?.username?'@'+p.username:s.user.email||'';if(ms.length){document.getElementById('empty').style.display='none';const w=document.getElementById('works');ms.forEach(m=>{const d=document.createElement('div');d.className='work';d.innerHTML='<div class="cover">'+(m.cover_url?'<img src="'+m.cover_url+'" style="width:100%;height:100%;object-fit:cover">':m.title)+'</div><div class="info"><h3>'+m.title+'</h3><p>'+((m.genres||'').replaceAll(',',' · ')||'Mangá')+'</p><div class="actions"><a class="btn primary" href="manga.html?id='+m.id+'">Abrir mangá</a><a class="btn" href="publish.html?manga_id='+m.id+'">＋ Próximo capítulo</a></div></div>';w.append(d)})}}catch(e){console.error(e)}})();</script></body></html>
