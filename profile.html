<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Perfil — LinkStory</title><style>:root{--b:#0b72e7;--i:#102033;--m:#66788d;--l:#dbe5ef}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#fff,#f4f9ff);color:var(--i);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{text-decoration:none;color:inherit}.top{height:68px;border-bottom:1px solid var(--l);display:flex;align-items:center;padding:0 16px}.back{width:42px;height:42px;border:1px solid var(--l);border-radius:50%;display:grid;place-items:center;font-size:25px;background:#fff}.brand{margin-left:auto;font-size:24px;font-weight:950}.brand b{color:var(--b)}main{width:min(900px,calc(100% - 24px));margin:auto;padding:30px 0 70px}.profile{display:flex;gap:20px;align-items:center;padding:18px 0 26px;border-bottom:1px solid var(--l)}.avatar{width:92px;height:92px;border:1px solid var(--l);border-radius:50%;display:grid;place-items:center;color:#9aabbd}.avatar svg{width:58px}.ey{font-size:10px;font-weight:900;letter-spacing:2.2px;color:var(--b)}h1{font-size:48px;letter-spacing:-2px;margin:5px 0}.muted{color:var(--m);font-size:13px}.account-meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}.account-pill{display:inline-flex;align-items:center;padding:6px 9px;border:1px solid var(--l);border-radius:999px;background:#fff;color:var(--m);font-size:10px;font-weight:850}.account-pill strong{color:var(--b);margin-right:4px}.section{margin-top:30px}.head{display:flex;justify-content:space-between;align-items:end}.head h2{font-size:25px;margin:5px 0}.publish{color:var(--b);font-weight:900;font-size:13px}.empty{margin-top:15px;border:1px dashed var(--l);border-radius:15px;padding:45px 20px;text-align:center;color:var(--m);background:#fff}.empty strong{display:block;color:var(--i);margin-bottom:6px}.works{display:grid;gap:12px;margin-top:15px}.work{display:flex;gap:14px;align-items:center;border:1px solid var(--l);border-radius:15px;padding:12px;background:#fff}.cover{width:76px;height:104px;border-radius:9px;background:#eaf4ff center/contain no-repeat;display:grid;place-items:center;font-weight:900;color:#1b4f7e;flex:none;overflow:hidden}.cover img{width:100%;height:100%;object-fit:contain}.info{flex:1;min-width:0}.info h3{margin:0 0 5px;font-size:18px}.info p{margin:0;color:var(--m);font-size:12px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.btn{border:1px solid var(--l);border-radius:10px;padding:9px 11px;background:#fff;color:var(--b);font-size:11px;font-weight:900}.primary{background:var(--b);color:#fff;border-color:var(--b)}@media(max-width:600px){main{padding-top:22px}.profile{gap:14px}.avatar{width:78px;height:78px}.cover{width:62px;height:86px}.work{align-items:flex-start}.actions{display:grid;grid-template-columns:1fr 1fr}.btn{text-align:center;padding:9px 5px}.info h3{font-size:16px}h1{font-size:38px}}
/* LinkStory mobile-first visual system */
:root{--ls-blue:#0b72e7;--ls-deep:#07111f;--ls-ink:#101a28;--ls-muted:#77869a;--ls-line:#e7ebf0;--ls-soft:#f5f7fa}
body{background:#f7f8fa!important;color:var(--ls-ink)!important;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif!important}
.top,.topbar{height:62px!important;padding:0 14px!important;background:rgba(255,255,255,.78)!important;border:1px solid rgba(220,227,235,.8)!important;backdrop-filter:blur(18px)!important;position:sticky!important;top:10px!important;margin:0 10px!important;width:calc(100% - 20px)!important;border-radius:15px!important;box-shadow:0 8px 28px rgba(16,32,51,.07)!important;z-index:20!important}
.back,.menu,.menu-btn{width:38px!important;height:38px!important;border-radius:11px!important;border:1px solid var(--ls-line)!important;background:#fff!important;color:var(--ls-ink)!important}
.brand,.logo{font-size:21px!important;letter-spacing:-1.3px!important;margin-left:14px!important;display:flex!important;align-items:center!important}.brand img{display:block;width:122px;height:38px;object-fit:contain}
main{width:calc(100% - 28px)!important;padding:28px 0 70px!important}
.btn,.primary,.publish,.edit{border-radius:12px!important;min-height:46px;transition:.2s ease}
.btn:hover,.publish:hover,.edit:hover{transform:translateY(-1px)}
.card,.form,.social,.empty,.work,.settings-menu,.theme-option{border-radius:16px!important;box-shadow:0 8px 26px rgba(16,32,51,.05)}
h1{font-size:42px!important;letter-spacing:-2.5px!important}
h2{letter-spacing:-.8px}
.ey,.eyebrow{letter-spacing:2.5px!important}
@media(max-width:600px){
  .top,.topbar{top:8px!important}
  .cover-shell{width:min(290px,78vw)!important}
  .stats{border:0!important;background:#fff;border-radius:16px;padding:6px!important;box-shadow:0 8px 26px rgba(16,32,51,.05)}
  .stat{padding:15px!important;border-bottom:1px solid var(--ls-line)!important}
  .stat:last-child{border-bottom:0!important}
  .section{margin-top:28px!important}
  .work{padding:10px!important}
  .actions{gap:8px!important}
  .actions .btn{min-height:44px}
  .layout{gap:10px!important}
  .settings-menu{box-shadow:none!important}
  .appearance-options{grid-template-columns:1fr 1fr!important}
  .theme-preview{height:112px!important}
  .menu-dialog{border-radius:0!important}
}
</style></head><body><header class="top"><a class="back" href="index.html">‹</a><a class="brand" href="index.html" aria-label="LinkStory"><img src="assets/linkstory-logo.svg" alt="LinkStory"></a></header><main><section class="profile"><div class="avatar"><svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="4"><circle cx="50" cy="34" r="13"/><path d="M24 82c3-20 14-30 26-30s23 10 26 30"/><circle cx="50" cy="50" r="46"/></svg></div><div><span class="ey">LINKSTORY · PERFIL</span><h1 id="name">Perfil</h1><div class="muted" id="handle">Entre para ver suas obras.</div><div class="account-meta" id="accountMeta" hidden><span class="account-pill"><strong id="roleLabel">Leitor</strong></span><span class="account-pill"><strong>ID</strong> <span id="kxId">KX-</span></span></div></div></section><section class="section"><div class="head"><div><span class="ey">PUBLICAÇÕES</span><h2>Minhas obras</h2></div><a class="publish" href="publish.html">Publicar →</a></div><div id="empty" class="empty"><strong>Nenhuma obra publicada.</strong>Quando você publicar, ela aparecerá aqui.</div><div id="works" class="works"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js"></script><script src="manga-db.js"></script><script>(async()=>{try{const s=await LinkStoryManga.session();if(!s){document.getElementById('name').textContent='Visitante';return}const p=await LinkStoryManga.currentProfile(),all=await LinkStoryManga.publishedMangas(),ms=all.filter(m=>m.creator_id===s.user.id);document.getElementById('name').textContent=p?.display_name||s.user.user_metadata?.full_name||'Usuário';document.getElementById('handle').textContent=p?.username?'@'+p.username:s.user.email||'';if(p){document.getElementById('accountMeta').hidden=false;document.getElementById('roleLabel').textContent=p.role==='criador'?'Criador':'Leitor';document.getElementById('kxId').textContent=p.kx_id||'KX-';}if(ms.length){document.getElementById('empty').style.display='none';const w=document.getElementById('works');ms.forEach(m=>{const d=document.createElement('div');d.className='work';d.innerHTML='<div class="cover">'+(m.cover_url?'<img src="'+m.cover_url+'">':m.title)+'</div><div class="info"><h3>'+m.title+'</h3><p>'+((m.genres||'').replaceAll(',',' · ')||'Mangá')+'</p><div class="actions"><a class="btn primary" href="manga.html?id='+m.id+'">Abrir mangá</a><a class="btn" href="editar.html?id='+m.id+'">✎ Editar</a><a class="btn" href="publish.html?manga_id='+m.id+'">＋ Próximo capítulo</a></div></div>';w.append(d)})}}catch(e){console.error(e)}})();</script></body></html>
