   const s=Array.isArray(data)?data[0]:data;if(!s)throw new Error('Não foi possível consultar sua verificação.');
   if(s.verification_type&&V&&V.isValid(s.verification_type)){area.hidden=true;return;}
   if(s.request_status==='pending'){status.textContent='Sua solicitação está em análise.';return}
   if(s.request_status==='rejected')status.textContent='Sua solicitação foi recusada. Você pode solicitar novamente.';
   const followers=Number(s.follower_count||0),required=Number(s.required_followers||10000);
   if(followers>=required)button.hidden=false;
   else status.textContent=(followers.toLocaleString('pt-BR'))+' / '+required.toLocaleString('pt-BR')+' seguidores';
  }catch(e){status.textContent=e.message||'Não foi possível consultar sua verificação.';console.warn('Verification badge:',e)}
 }
 $('requestVerification').onclick=async()=>{
  const button=$('requestVerification'),status=$('verificationStatus');button.disabled=true;button.textContent='Enviando…';
  try{const{error}=await db.rpc('request_influencer_verification',{p_note:null});if(error)throw error;button.hidden=true;status.textContent='Solicitação enviada. A equipe LinkStory vai analisar sua conta.'}
  catch(e){status.textContent=e.message||'Não foi possível solicitar.';button.disabled=false;button.textContent='Solicitar selo de influenciador'}
 };

 function renderProfile(p){
  const profileName=$('name');profileName.replaceChildren();const profileNameText=document.createElement('span');profileNameText.textContent=p?.display_name||'Usuário';profileNameText.style.cssText='min-width:0;overflow-wrap:anywhere';profileName.append(profileNameText);if(window.LinkStoryVerification)LinkStoryVerification.decorate(profileName,p?.verification_type);
  $('handle').textContent=p?.username?'@'+p.username:'';
  $('bio').textContent=p?.bio||'';
  const avatar=$('profileAvatar');avatar.replaceChildren();
  if(p?.avatar_url){const img=document.createElement('img');img.src=p.avatar_url;img.alt='Foto de perfil';img.onerror=()=>{avatar.textContent=(p.display_name||'U').slice(0,1).toUpperCase()};avatar.append(img)}
  else avatar.textContent=(p?.display_name||'U').slice(0,1).toUpperCase();
 }


 function openEditor(){ $('editDisplayName').value=profile?.display_name||'';$('editAvatarFile').value='';$('avatarFileHint').textContent=profile?.avatar_url?'Foto atual mantida. Escolha outra para substituir.':'Escolha uma foto da galeria do celular.';$('editUsername').value=profile?.username||'';$('editBio').value=profile?.bio||'';setStatus('');$('editModal').showModal() }
 $('editProfile').onclick=openEditor;$('cancelEdit').onclick=()=>$('editModal').close();
 $('profileForm').onsubmit=async e=>{
  e.preventDefault();const display_name=$('editDisplayName').value.trim(),username=$('editUsername').value.trim(),bio=$('editBio').value.trim();let avatar_url=profile?.avatar_url||null;const avatarFile=$('editAvatarFile').files?.[0]||null;
  if(display_name.length<1||display_name.length>80)return setStatus('O nome público deve ter entre 1 e 80 caracteres.');
  if(!/^[A-Za-z0-9_]{3,30}$/.test(username))return setStatus('Use de 3 a 30 letras, números ou underline no usuário.');
  const save=$('saveProfile');save.disabled=true;save.textContent='Salvando…';setStatus('');
  try{
   if(avatarFile){
    if(!avatarFile.type.startsWith('image/'))throw new Error('Escolha um arquivo de imagem.');
    if(avatarFile.size>5*1024*1024)throw new Error('A foto deve ter no máximo 5 MB.');
    const ext=(avatarFile.type.split('/')[1]||'jpg').replace('jpeg','jpg');
    const path='avatars/'+user.id+'/profile-'+Date.now()+'.'+ext;
    const upload=await db.storage.from('linkstory-media').upload(path,avatarFile,{contentType:avatarFile.type,upsert:true});
    if(upload.error)throw upload.error;
    avatar_url=db.storage.from('linkstory-media').getPublicUrl(path).data.publicUrl;
   }
  }catch(error){save.disabled=false;save.textContent='Salvar alterações';setStatus(error.message||'Não foi possível enviar a foto.');return}
  const result=await db.from('profiles').update({display_name,username,avatar_url,bio,updated_at:new Date().toISOString()}).eq('id',user.id).select('id,username,display_name,role,bio,avatar_url,k_code,verification_type').single();
  save.disabled=false;save.textContent='Salvar alterações';
  if(result.error){setStatus(result.error.code==='23505'?'Esse nome de usuário já está em uso.':result.error.message||'Não foi possível salvar.');return}
  profile=result.data;renderProfile(profile);$('editModal').close();
 };
 try{
  const session=await db.auth.getSession();user=session.data.session?.user;
  if(!user){$('name').textContent='Visitante';$('handle').textContent='Entre para editar seu perfil.';return}
  const result=await getLinkStoryProfile();if(result.error)throw result.error;profile=result.data;
  renderProfile(profile);$('editProfile').hidden=false;
  const [myFollowers,myFollowing]=await Promise.all([
   db.from('follows').select('follower_id',{count:'exact',head:true}).eq('following_id',user.id),
   db.from('follows').select('following_id',{count:'exact',head:true}).eq('follower_id',user.id)
  ]);
  if(myFollowers.error)throw myFollowers.error;if(myFollowing.error)throw myFollowing.error;
  $('myFollowersCount').textContent=Number(myFollowers.count||0).toLocaleString('pt-BR');
  $('myFollowingCount').textContent=Number(myFollowing.count||0).toLocaleString('pt-BR');
  const networkDialog=$('myNetworkDialog');
  $('closeMyNetwork').onclick=()=>networkDialog.close();
  networkDialog.addEventListener('click',event=>{if(event.target===networkDialog)networkDialog.close()});
  async function openMyNetwork(kind){
   const list=$('myNetworkList'),title=kind==='followers'?'Seguidores':'Pessoas que você segue';
   $('myNetworkTitle').textContent=title;list.innerHTML='<div class="my-network-empty">Carregando pessoas…</div>';networkDialog.showModal();
   try{
    const field=kind==='followers'?'follower_id':'following_id';
    const rel=await db.from('follows').select(field).eq(kind==='followers'?'following_id':'follower_id',user.id);
    if(rel.error)throw rel.error;
    const ids=(rel.data||[]).map(item=>item[field]).filter(Boolean);
    if(!ids.length){list.innerHTML='<div class="my-network-empty">Ainda não há pessoas nesta lista.</div>';return}
    const people=await db.from('profiles').select('id,username,display_name,avatar_url').in('id',ids);
    if(people.error)throw people.error;
    list.replaceChildren();
    (people.data||[]).forEach(person=>{
     const link=document.createElement('a');link.className='my-network-person';link.href='public-profile.html?id='+encodeURIComponent(person.id);
     const avatar=person.avatar_url?document.createElement('img'):document.createElement('div');
     if(person.avatar_url){avatar.src=person.avatar_url;avatar.alt=''}else{avatar.className='my-network-avatar';avatar.textContent=(person.display_name||person.username||'U').slice(0,1).toUpperCase()}
     const copy=document.createElement('span'),name=document.createElement('strong'),handle=document.createElement('small');
     name.textContent=person.display_name||person.username||'Usuário';handle.textContent='@'+(person.username||'usuário');copy.append(name,handle);link.append(avatar,copy);list.append(link);
    });
   }catch(error){list.innerHTML='<div class="my-network-empty">Não foi possível carregar a lista: '+String(error.message||'tente novamente').replace(/[<>]/g,'')+'</div>'}
  }
  $('openMyFollowers').onclick=()=>openMyNetwork('followers');
  $('openMyFollowing').onclick=()=>openMyNetwork('following');
  await loadVerification();
  if(location.hash==='#edit')openEditor();
  const all=await LinkStoryManga.publishedMangas(),works=all.filter(m=>m.creator_id===user.id);
  if(works.length){$('empty').style.display='none';const container=$('works');works.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));works.forEach((m,index)=>{
   const d=document.createElement('div');d.className='work';const number=document.createElement('span');number.className='work-number';number.textContent=String(index+1).padStart(2,'0');d.append(number);const cover=document.createElement('div');cover.className='cover';
   if(m.cover_url){const img=document.createElement('img');img.src=m.cover_url;img.alt='Capa de '+(m.title||'mangá');img.loading='lazy';cover.append(img)}else cover.textContent=m.title||'Mangá';
   const info=document.createElement('div');info.className='info';const title=document.createElement('h3');title.textContent=m.title||'Sem título';
   const genre=document.createElement('p');genre.textContent=((m.genres||'').replaceAll(',',' · ')||'Mangá');
   const actions=document.createElement('div');actions.className='actions';
   [['Abrir mangá','manga.html?id='+encodeURIComponent(m.id),'btn primary'],['✎ Editar','editar.html?id='+encodeURIComponent(m.id),'btn'],['＋ Próximo capítulo','publish.html?manga_id='+encodeURIComponent(m.id),'btn']].forEach(([label,href,cls])=>{const a=document.createElement('a');a.className=cls;a.href=href;a.textContent=label;actions.append(a)});
   info.append(title,genre,actions);d.append(cover,info);container.append(d);
  })}
  const photoResult=await db.from('posts').select('id,media_url,body,created_at').eq('author_id',user.id).eq('media_type','image').not('media_url','is',null).order('created_at',{ascending:false}).limit(30);
  if(!photoResult.error&&(photoResult.data||[]).length){$('myPhotosSection').hidden=false;const grid=$('myPhotos');photoResult.data.forEach(post=>{const a=document.createElement('a');a.href='fy.html';a.setAttribute('aria-label',post.body||'Foto publicada');const img=document.createElement('img');img.src=post.media_url;img.alt=post.body||'Foto publicada';img.loading='lazy';a.append(img);grid.append(a)})}
 }catch(e){console.error(e);$('handle').textContent=e.message||'Não foi possível carregar o perfil.'}
})();
