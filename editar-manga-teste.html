<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b72e7"><title>Editar mangá — LinkStory</title><style>:root{--blue:#0b72e7;--ink:#142033;--muted:#687386;--line:#dfe7ef;--soft:#f7f9fc}*{box-sizing:border-box}body{margin:0;background:var(--soft);color:var(--ink);font-family:Inter,system-ui,sans-serif}.top{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 5%;gap:16px;position:sticky;top:0;z-index:5}.back{font-size:28px;text-decoration:none}.brand{font-size:23px;font-weight:950}.brand b{color:var(--blue)}.wrap{width:min(820px,92%);margin:auto;padding:28px 0 70px}.eyebrow{font-size:10px;letter-spacing:.16em;font-weight:900;color:var(--blue)}h1{font-size:clamp(30px,7vw,44px);letter-spacing:-1.7px;margin:7px 0 8px}.sub{color:var(--muted);font-size:13px;line-height:1.5}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:22px 0 14px}.tab{border:1px solid var(--line);background:#fff;border-radius:11px;padding:11px 7px;font-size:12px;font-weight:850;color:#62758a}.tab.active{background:var(--blue);border-color:var(--blue);color:#fff}.panel{display:none;background:#fff;border:1px solid var(--line);border-radius:17px;padding:20px}.panel.active{display:block}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}.field label{font-size:13px;font-weight:850}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:11px;padding:12px;color:var(--ink);background:#fff}.field textarea{min-height:120px}.upload{border:2px dashed #cbd7e4;border-radius:13px;min-height:170px;display:flex;align-items:center;justify-content:center;text-align:center;position:relative;padding:20px}.upload input{position:absolute;inset:0;opacity:0}.preview{display:none;margin-top:12px;text-align:center}.preview img{max-width:100%;max-height:280px;border-radius:10px}.pages{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}.page{position:relative;border:1px solid var(--line);border-radius:9px;overflow:hidden}.page img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover}.num{position:absolute;left:5px;top:5px;background:var(--ink);color:#fff;border-radius:5px;padding:3px 5px;font-size:10px;font-weight:800}.actions{display:flex;gap:9px;margin-top:18px}.btn{flex:1;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:11px;padding:12px;font-weight:850;text-align:center;text-decoration:none}.primary{background:var(--blue);border-color:var(--blue);color:#fff}.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:11px 15px;border-radius:11px;opacity:0;transition:.2s;font-size:12px}@media(max-width:600px){.tabs{grid-template-columns:1fr 1fr 1fr}.tab{font-size:11px}.panel{padding:17px}}</style></head><body><header class="top"><a class="back" href="desempenho-teste.html">‹</a><div class="brand">Link<b>Story</b></div></header><main class="wrap"><span class="eyebrow">LINKSTORY · EDIÇÃO</span><h1>Editar publicação</h1><p class="sub" id="sub">Altere somente a parte que você escolher.</p><nav class="tabs"><button class="tab active" data-panel="info">Informações</button><button class="tab" data-panel="cover">Capa</button><button class="tab" data-panel="chapter">Capítulo e páginas</button></nav><section class="panel active" id="info"><div class="field"><label>Título do mangá</label><input id="title"></div><div class="field"><label>Autor</label><input id="author"></div><div class="field"><label>Gênero</label><input id="genre"></div><div class="field"><label>Classificação</label><select id="rating"><option>Livre</option><option>10 anos</option><option>12 anos</option><option>14 anos</option><option>16 anos</option><option>18 anos</option></select></div><div class="field"><label>Descrição</label><textarea id="description"></textarea></div></section><section class="panel" id="cover"><div class="upload"><input id="coverInput" type="file" accept="image/jpeg,image/png,image/webp"><div><strong>＋ Trocar capa</strong><br><small>Selecione uma nova imagem</small></div></div><div class="preview" id="coverPreview"><img id="coverImg"></div></section><section class="panel" id="chapter"><div class="field"><label>Capítulo</label><input id="chapterNumber" inputmode="numeric"></div><div class="field"><label>Título do capítulo</label><input id="chapterTitle"></div><div class="upload"><input id="pageInput" type="file" accept="image/jpeg,image/png,image/webp" multiple><div><strong>＋ Adicionar páginas</strong><br><small>As novas páginas entram no final</small></div></div><div class="pages" id="pages"></div><p class="sub">A ordem mostrada aqui é a ordem publicada.</p></section><div class="actions"><a class="btn" href="desempenho-teste.html">Cancelar</a><button class="btn primary" id="save">Salvar alterações</button></div></main><div class="toast" id="toast"></div><script>const $=id=>document.getElementById(id),tabs=[...document.querySelectorAll('.tab')],panels=[...document.querySelectorAll('.panel')];let data=JSON.parse(localStorage.getItem('linkstory_test_manga')||'null'),newCover='',newPages=[];function toast(t){const x=$('toast');x.textContent=t;x.style.opacity=1;x.style.transform='translate(-50%,0)';setTimeout(()=>{x.style.opacity=0;x.style.transform='translate(-50%,20px)'},1800)}tabs.forEach(t=>t.onclick=()=>{tabs.forEach(x=>x.classList.remove('active'));panels.forEach(x=>x.classList.remove('active'));t.classList.add('active');$(t.dataset.panel).classList.add('active')});function dataUrl(file,max,q=.82){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(max/im.width,max/im.height,1),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL('image/webp',q))};im.onerror=reject;im.src=r.result};r.onerror=reject;r.readAsDataURL(file)})}function fill(){if(!data)return;$('title').value=data.title||'';$('author').value=data.author||'';$('genre').value=data.genre||'';$('rating').value=data.rating||'Livre';$('description').value=data.description||'';$('chapterNumber').value=data.chapterNumber||'001';$('chapterTitle').value=data.chapterTitle||'Sem título';if(data.cover){$('coverImg').src=data.cover;$('coverPreview').style.display='block'}renderPages(data.pages||[])}function renderPages(list){$('pages').innerHTML=list.map((src,i)=>`<div class="page"><img src="${src}"><span class="num">${i+1}</span></div>`).join('')}$('coverInput').onchange=async e=>{const f=e.target.files[0];if(f){newCover=await dataUrl(f,1200);$('coverImg').src=newCover;$('coverPreview').style.display='block'}};$('pageInput').onchange=async e=>{for(const f of e.target.files)newPages.push(await dataUrl(f,1400));renderPages([...(data?.pages||[]),...newPages]);e.target.value=''};$('save').onclick=()=>{if(!data){toast('Nenhum teste encontrado.');return}data.title=$('title').value.trim();data.author=$('author').value.trim();data.genre=$('genre').value.trim();data.rating=$('rating').value;data.description=$('description').value.trim();data.chapterNumber=$('chapterNumber').value.trim()||'001';data.chapterTitle=$('chapterTitle').value.trim()||'Sem título';if(newCover)data.cover=newCover;if(newPages.length)data.pages=[...(data.pages||[]),...newPages];try{localStorage.setItem('linkstory_test_manga',JSON.stringify(data));toast('Alterações salvas.');setTimeout(()=>location.href='desempenho-teste.html',700)}catch(e){toast('Não foi possível salvar. Tente imagens menores.')}};fill();</script></body></html>
