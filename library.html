<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f9fc"><title>Biblioteca — LinkStory</title>
<link rel="stylesheet" href="fonts.css?v=1"><link rel="stylesheet" href="theme-fixes.css?v=2">
<style>
:root{--blue:#0877ed;--ink:#17263a;--muted:#78879a;--line:#e5ebf2;--surface:#fff;--wash:#f6f8fb}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f7f9fc;color:var(--ink);font-family:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}a{color:inherit;text-decoration:none}
.topbar{height:62px;display:flex;align-items:center;gap:12px;padding:0 15px;background:rgba(255,255,255,.86);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.back,.menu-btn{width:38px;height:38px;border:1px solid var(--line);border-radius:12px;background:#fff;display:grid;place-items:center;flex:none;color:#40536b}.back{font-size:25px;line-height:1}.logo{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center}.logo img{width:120px;height:40px;object-fit:contain}.menu-btn{margin-left:auto;font-size:0}.menu-btn:before{content:"";width:16px;height:12px;border-top:2px solid currentColor;border-bottom:2px solid currentColor;position:relative}.menu-btn:after{content:"";position:absolute;width:16px;border-top:2px solid currentColor}
main{width:min(980px,calc(100% - 32px));margin:0 auto;padding:34px 0 112px}
.library-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:25px}.eyebrow{display:block;margin-bottom:8px;color:var(--blue);font-size:10px;font-weight:800;letter-spacing:1.8px;text-transform:uppercase}.library-heading h1{margin:0;font-size:clamp(29px,5vw,39px);line-height:1.05;letter-spacing:-1.4px;font-weight:800}.library-heading p{margin:9px 0 0;color:var(--muted);font-size:13px;line-height:1.55}
.heading-mark{width:52px;height:52px;border:1px solid #dce9f8;border-radius:17px;background:#edf5ff;color:var(--blue);display:grid;place-items:center;flex:none}.heading-mark svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs{display:flex;gap:7px;padding:5px;margin:0 0 23px;border:1px solid var(--line);border-radius:15px;background:#eef2f6;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tabs button{flex:1;min-width:max-content;min-height:40px;padding:0 16px;border:0;border-radius:11px;background:transparent;color:#77869a;font:700 12px "DM Sans",sans-serif;cursor:pointer;transition:.18s}.tabs button.active{background:#fff;color:var(--blue);box-shadow:0 2px 8px rgba(21,48,79,.08)}
.panel{display:none}.panel.active{display:block}.panel-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 2px 14px}.panel-top h2{margin:0;font-size:16px;font-weight:800;letter-spacing:-.3px}.count{color:#8492a4;font-size:11px;font-weight:700}
.library-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.library-card{min-width:0;display:flex;flex-direction:column;overflow:hidden;border:1px solid #e7edf4;border-radius:16px;background:#fff;box-shadow:0 5px 18px rgba(18,39,67,.045);transition:transform .18s,border-color .18s}.library-card:active{transform:scale(.985)}.library-cover{position:relative;aspect-ratio:3/4;display:grid;place-items:center;overflow:hidden;background:linear-gradient(145deg,#edf2f8,#f8fafc)}.library-cover img{width:100%;height:100%;object-fit:cover;display:block}.cover-fallback{padding:18px;text-align:center;color:#8291a4;font-size:13px;font-weight:800}.library-info{padding:12px 13px 14px;min-width:0}.library-info strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:800}.library-info small{display:block;margin-top:5px;color:var(--muted);font-size:10px;line-height:1.4}.continue-card{display:grid;grid-template-columns:116px minmax(0,1fr);gap:17px;padding:13px;border:1px solid #e5ebf2;border-radius:17px;background:#fff;box-shadow:0 5px 18px rgba(18,39,67,.045)}.continue-card .library-cover{aspect-ratio:3/4;border-radius:11px}.continue-card .library-info{display:flex;flex-direction:column;justify-content:center;padding:5px 4px}.continue-card .library-info strong{font-size:17px;white-space:normal}.continue-card .library-info small{font-size:11px;margin-top:8px}.continue-label{display:block;margin-bottom:7px;color:var(--blue);font-size:9px;font-weight:800;letter-spacing:1.3px;text-transform:uppercase}.continue-action{display:inline-flex;align-items:center;justify-content:center;align-self:flex-start;margin-top:14px;min-height:37px;padding:0 14px;border-radius:10px;background:var(--blue);color:#fff;font-size:11px;font-weight:800}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:48px 20px 44px;border:1px dashed #d9e3ee;border-radius:18px;background:linear-gradient(180deg,#fff,#fbfcfe)}.empty-icon{width:54px;height:54px;margin-bottom:15px;display:grid;place-items:center;border-radius:17px;background:#edf5ff;color:var(--blue)}.empty-icon svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.empty h3{margin:0;font-size:16px;font-weight:800}.empty p{max-width:360px;margin:8px 0 17px;color:var(--muted);font-size:12px;line-height:1.6}.empty a{display:inline-flex;align-items:center;justify-content:center;min-height:39px;padding:0 16px;border-radius:11px;background:var(--blue);color:white;font-size:11px;font-weight:800}.status{padding:20px;text-align:center;color:var(--muted);font-size:12px}.status.error{color:#b54747}
@media(max-width:700px){main{width:calc(100% - 28px);padding:26px 0 104px}.library-heading{margin-bottom:20px}.library-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.library-info{padding:10px 10px 12px}.library-info strong{font-size:12px}.continue-card{grid-template-columns:100px minmax(0,1fr);gap:12px;padding:10px}.continue-card .library-info strong{font-size:15px}.tabs button{padding:0 12px;font-size:11px}}
@media(max-width:370px){.continue-card{grid-template-columns:86px minmax(0,1fr)}.continue-action{min-height:34px;padding:0 10px}}
html[data-ls-theme="dark"] body{background:#101720;color:#edf3fb}html[data-ls-theme="dark"] .topbar{background:rgba(20,29,40,.9);border-color:#303d4d}html[data-ls-theme="dark"] .back,html[data-ls-theme="dark"] .menu-btn{background:#1b2735;border-color:#354355;color:#dce7f5}html[data-ls-theme="dark"] .tabs{background:#1a2634;border-color:#303d4d}html[data-ls-theme="dark"] .tabs button{color:#aab7c7}html[data-ls-theme="dark"] .tabs button.active,html[data-ls-theme="dark"] .library-card,html[data-ls-theme="dark"] .continue-card{background:#1b2735;border-color:#303d4d;color:#edf3fb}html[data-ls-theme="dark"] .library-cover{background:#253345}html[data-ls-theme="dark"] .empty{background:#172230;border-color:#354355}html[data-ls-theme="dark"] .empty h3{color:#edf3fb}html[data-ls-theme="dark"] .empty p,html[data-ls-theme="dark"] .library-info small{color:#9cabbc}html[data-ls-theme="dark"] .heading-mark,html[data-ls-theme="dark"] .empty-icon{background:#20354d;border-color:#38516d}
</style>  <link rel="stylesheet" href="visual-system.css?v=1">
</head>
<body>
<header class="topbar"><a class="logo" href="index.html" aria-label="LinkStory"><img src="assets/linkstory-logo.svg" alt="LinkStory"></a><button class="menu-btn" id="openMenu" aria-label="Abrir menu"></button></header>
<main>
  <section class="library-heading"><div><span class="eyebrow">Seu espaço pessoal</span><h1>Biblioteca</h1><p>Suas histórias favoritas, leituras e descobertas em um só lugar.</p></div><div class="heading-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v17H6.5A2.5 2.5 0 0 1 4 17.5z"/><path d="M4 17.5A2.5 2.5 0 0 1 6.5 15H20M8 7h8M8 10h8"/></svg></div></section>
  <nav class="tabs" aria-label="Seções da biblioteca"><button class="active" data-tab="reading">Continuar lendo</button><button data-tab="saved">Salvos</button><button data-tab="history">Histórico</button></nav>
  <section id="reading" class="panel active"><div class="panel-top"><h2>Retome de onde parou</h2><span class="count" id="readingCount"></span></div><div id="readingContent"><div class="status">Carregando suas leituras…</div></div></section>
  <section id="saved" class="panel"><div class="panel-top"><h2>Histórias guardadas</h2><span class="count" id="savedCount"></span></div><div id="savedContent"><div class="status">Carregando seus mangás salvos…</div></div></section>
  <section id="history" class="panel"><div class="panel-top"><h2>Leituras recentes</h2><span class="count" id="historyCount"></span></div><div id="historyContent"><div class="status">Carregando seu histórico…</div></div></section>
</main>
<script>
(()=>{const tabs=[...document.querySelectorAll('.tabs button')];tabs.forEach(b=>b.addEventListener('click',()=>{tabs.forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id===b.dataset.tab))}))})();
</script>
<script src="brand.js?v=4"></script><script src="global-nav.js?v=3"></script><script src="cleanup.js?v=1"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js?v=1"></script><script src="manga-db.js?v=1"></script>
<script>
(async()=>{
 const $=id=>document.getElementById(id);
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const fallback=(title)=>'<div class="cover-fallback">'+esc(title||'Mangá')+'</div>';
 const cover=(m)=>m?.cover_url?'<img src="'+esc(m.cover_url)+'" alt="Capa de '+esc(m.title)+'" loading="lazy" onerror="this.remove();this.parentElement.insertAdjacentHTML(\'beforeend\',\''+fallback(m.title).replace(/'/g,"\\'")+'\')">':fallback(m?.title);
 const empty=(icon,title,desc,cta='Explorar mangás')=>'<div class="empty"><div class="empty-icon"><svg viewBox="0 0 24 24">'+icon+'</svg></div><h3>'+title+'</h3><p>'+desc+'</p><a href="index.html">'+cta+'</a></div>';
 const bookIcon='<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v17H6.5A2.5 2.5 0 0 1 4 17.5z"/><path d="M4 17.5A2.5 2.5 0 0 1 6.5 15H20"/>';
 const clockIcon='<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>';
 const bookmarkIcon='<path d="M6 4h12v17l-6-4-6 4z"/>';
 const card=(m,meta,href)=>'<a class="library-card" href="'+href+'"><div class="library-cover">'+cover(m)+'</div><div class="library-info"><strong>'+esc(m?.title||'Mangá sem título')+'</strong><small>'+esc(meta)+'</small></div></a>';
 try{
   if(!window.LinkStoryManga)throw new Error('A biblioteca não conseguiu iniciar. Atualize a página e tente novamente.');
   const session=await LinkStoryManga.session();
   if(!session){
     $('readingContent').innerHTML=empty(clockIcon,'Entre para acompanhar suas leituras','Faça login para sincronizar seu progresso, guardar mangás e consultar seu histórico.','Entrar na conta').replace('href="index.html"','href="login.html"');
     $('savedContent').innerHTML=empty(bookmarkIcon,'Sua coleção começa aqui','Entre na sua conta e salve os mangás que quiser encontrar depois.','Entrar na conta').replace('href="index.html"','href="login.html"');
     $('historyContent').innerHTML=empty(clockIcon,'Seu histórico aparecerá aqui','Quando você começar a ler com sua conta, suas leituras recentes ficarão organizadas nesta seção.','Entrar na conta').replace('href="index.html"','href="login.html"');
     return;
   }
   const [progress,saved]=await Promise.all([LinkStoryManga.myProgress(),LinkStoryManga.mySaved()]);
   const validProgress=progress.filter(x=>x?.mangas);
   const validSaved=saved.filter(x=>x?.mangas);
   $('readingCount').textContent=validProgress.length?validProgress.length+' '+(validProgress.length===1?'leitura':'leituras'):'';
   $('savedCount').textContent=validSaved.length?validSaved.length+' '+(validSaved.length===1?'mangá':'mangás'):'';
   $('historyCount').textContent=validProgress.length?validProgress.length+' '+(validProgress.length===1?'registro':'registros'):'';
   if(validProgress.length){
     const x=validProgress[0],m=x.mangas,ch=x.manga_chapters||{};
     const chapter=Number(ch.chapter_number)||0;
     $('readingContent').innerHTML='<a class="continue-card" href="reader.html?manga_id='+encodeURIComponent(x.manga_id)+'&chapter_id='+encodeURIComponent(x.chapter_id)+'"><div class="library-cover">'+cover(m)+'</div><div class="library-info"><span class="continue-label">Última leitura</span><strong>'+esc(m.title)+'</strong><small>'+(chapter?'Capítulo '+String(chapter).padStart(3,'0'):'Continuar leitura')+(ch.title?' · '+esc(ch.title):'')+'</small><span class="continue-action">Continuar lendo&nbsp; →</span></div></a>';
   }else $('readingContent').innerHTML=empty(clockIcon,'Nenhuma leitura em andamento','Abra um mangá e comece a ler. Seu progresso será salvo aqui automaticamente.');
   if(validSaved.length){
     $('savedContent').innerHTML='<div class="library-grid">'+validSaved.map(x=>card(x.mangas,'Na sua coleção','manga.html?id='+encodeURIComponent(x.mangas.id))).join('')+'</div>';
   }else $('savedContent').innerHTML=empty(bookmarkIcon,'Nenhum mangá salvo ainda','Quando encontrar uma história que goste, toque em salvar para adicioná-la à sua coleção.');
   if(validProgress.length){
     $('historyContent').innerHTML='<div class="library-grid">'+validProgress.map(x=>card(x.mangas,(Number(x.manga_chapters?.chapter_number)?'Capítulo '+String(x.manga_chapters.chapter_number).padStart(3,'0'):'Leitura')+' · '+new Date(x.updated_at).toLocaleDateString('pt-BR'),'reader.html?manga_id='+encodeURIComponent(x.manga_id)+'&chapter_id='+encodeURIComponent(x.chapter_id))).join('')+'</div>';
   }else $('historyContent').innerHTML=empty(clockIcon,'Seu histórico está vazio','As histórias que você começar a ler aparecerão aqui, organizadas pela atividade mais recente.');
 }catch(e){
   console.error('LinkStory Library:',e);
   ['readingContent','savedContent','historyContent'].forEach(id=>$(id).innerHTML='<div class="status error">Não foi possível carregar esta seção. Tente atualizar a página.</div>');
 }
})();
</script>
<script src="global-nav.js"></script></body></html>
