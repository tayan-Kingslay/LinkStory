<script>

}catch(e){status.hidden=false;status.textContent=e.message||'Não foi possível abrir o Fy.'}}
async function loadTarget(id){const{data,error}=await db().from('posts').select('id,author_id,body,media_url,media_type,post_type,created_at,profiles:author_id(id,username,display_name,avatar_url)').eq('id',id).eq('post_type','video').eq('media_type','video').maybeSingle();if(error)throw error;if(!data)return;status.hidden=true;await renderWithStats([data]);}

const actions=document.createElement('div');actions.className='actions';actions.append(actionButton('like',stats.liked?'♥':'♡',stats.likes+'',stats.liked),actionButton('comment','▤',stats.comments+'',false),actionButton('share','↗','Compartilhar',false));if(!user||user.id!==p.author_id)actions.append(actionButton('follow',stats.following?'✓':'+',stats.following?'Seguindo':'Seguir',stats.following));
card.append(video,shade,details,actions);feed.append(card);if(!observer)observer=new IntersectionObserver(entries=>entries.forEach(entry=>{const v=entry.target.querySelector('video');if(entry.isIntersecting&&entry.intersectionRatio>.65){feed.querySelectorAll('video').forEach(other=>{if(other!==v)other.pause()});v.play().catch(()=>{})}else v.pause()}),{root:feed,threshold:[.2,.65,.9]});observer.observe(card)}
function actionButton(action,symbol,label,active){const b=document.createElement('button');b.type='button';b.className='action'+(active?' '+(action==='like'?'liked':'following'):'');b.dataset.action=action;b.innerHTML='<span class="bubble" aria-hidden="true">'+symbol+'</span><small>'+esc(label)+'</small>';b.setAttribute('aria-label',action==='like'?'Curtir vídeo':action==='comment'?'Abrir comentários':action==='share'?'Compartilhar vídeo':active?'Deixar de seguir':'Seguir criador');return b}
function updateAction(card,action,symbol,label,active){const b=card.querySelector('[data-action="'+action+'"]');if(!b)return;b.classList.toggle('liked',action==='like'&&active);b.classList.toggle('following',action==='follow'&&active);b.querySelector('.bubble').textContent=symbol;b.querySelector('small').textContent=label;b.setAttribute('aria-label',action==='like'?'Curtir vídeo':action==='follow'?(active?'Deixar de seguir':'Seguir criador'):'Abrir comentários')}
async function toggleLike(card,button){if(!user)return toast('Entre na sua conta para curtir vídeos.');button.disabled=true;const id=card.dataset.id,liked=card.dataset.liked==='true';try{if(liked){const{error}=await db().from('post_likes').delete().eq('post_id',id).eq('user_id',user.id);if(error)throw error}else{const{error}=await db().from('post_likes').insert({post_id:id,user_id:user.id});if(error&&error.code!=='23505')throw error}const next=!liked,count=Math.max(0,Number(card.dataset.likes)+(next?1:-1));card.dataset.liked=String(next);card.dataset.likes=String(count);updateAction(card,'like',next?'♥':'♡',String(count),next)}catch(e){toast(e.message||'Não foi possível curtir o vídeo.')}finally{button.disabled=false}}
async function toggleFollow(card,button){if(!user)return toast('Entre na sua conta para seguir criadores.');const id=card.dataset.author;if(id===user.id)return;button.disabled=true;const following=card.dataset.following==='true';try{if(following){const{error}=await db().from('follows').delete().eq('follower_id',user.id).eq('following_id',id);if(error)throw error}else{const{error}=await db().from('follows').insert({follower_id:user.id,following_id:id});if(error&&error.code!=='23505')throw error}card.dataset.following=String(!following);updateAction(card,'follow',following?'+':'✓',following?'Seguir':'Seguindo',!following)}catch(e){toast(e.message||'Não foi possível atualizar quem você segue.')}finally{button.disabled=false}}
async function shareVideo(card){const url=new URL(location.href);url.search='?video='+encodeURIComponent(card.dataset.id);try{if(navigator.share)await navigator.share({title:'Vídeo no LinkStory',url:url.href});else if(navigator.clipboard){await navigator.clipboard.writeText(url.href);toast('Link do vídeo copiado!')}else toast('Não foi possível compartilhar neste navegador.')}catch(e){if(e.name!=='AbortError')toast('Não foi possível compartilhar o vídeo.')}}
async function openComments(card){activePost=card.dataset.id;scrollBeforeComments=feed.scrollTop;const back=document.getElementById('commentsBackdrop');back.classList.add('open');back.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';document.getElementById('commentsList').textContent='Carregando comentários…';document.getElementById('commentInput').value='';document.getElementById('commentInput').placeholder=user?'Adicione um comentário…':'Entre para comentar';document.getElementById('sendComment').disabled=!user;try{const{data,error}=await db().from('comments').select('id,body,author_id,created_at,profiles:author_id(id,username,display_name,avatar_url)').eq('post_id',activePost).order('created_at',{ascending:true});if(error)throw error;const list=document.getElementById('commentsList');list.replaceChildren();if(!data?.length){list.innerHTML='<div class="comment-empty">Ainda não há comentários. Seja a primeira pessoa a comentar!</div>'}else data.forEach(c=>{const row=document.createElement('article');row.className='comment';const av=c.profiles?.avatar_url?document.createElement('img'):document.createElement('span');if(c.profiles?.avatar_url){av.src=c.profiles.avatar_url;av.alt=''}else{av.className='comment-avatar';av.textContent=userName(c.profiles).slice(0,2).toUpperCase()}const main=document.createElement('div');main.className='comment-main';const meta=document.createElement('div');meta.className='comment-meta';const name=document.createElement('strong');name.textContent=userName(c.profiles);const time=document.createElement('time');time.textContent=new Date(c.created_at).toLocaleString('pt-BR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});meta.append(name,time);const body=document.createElement('p');body.className='comment-body';body.textContent=c.body;main.append(meta,body);row.append(av,main);list.append(row)});card.dataset.comments=String(data?.length||0);updateAction(card,'comment','▤',String(data?.length||0),false)}catch(e){document.getElementById('commentsList').textContent='Não foi possível carregar os comentários: '+(e.message||'erro desconhecido')}}
function closeComments(){document.getElementById('commentsBackdrop').classList.remove('open');document.getElementById('commentsBackdrop').setAttribute('aria-hidden','true');document.body.style.overflow='';activePost=null}
async function sendComment(e){e.preventDefault();if(!user)return toast('Entre na sua conta para comentar.');const input=document.getElementById('commentInput'),body=input.value.trim();if(!body||!activePost)return;const send=document.getElementById('sendComment');send.disabled=true;try{const{data,error}=await db().from('comments').insert({post_id:activePost,author_id:user.id,body}).select('id,body,author_id,created_at,profiles:author_id(id,username,display_name,avatar_url)').single();if(error)throw error;const list=document.getElementById('commentsList');const empty=list.querySelector('.comment-empty');if(empty)empty.remove();const row=document.createElement('article');row.className='comment';const av=document.createElement('span');av.className='comment-avatar';av.textContent='EU';const main=document.createElement('div');main.className='comment-main';const meta=document.createElement('div');meta.className='comment-meta';const name=document.createElement('strong');name.textContent='Você';const time=document.createElement('time');time.textContent='Agora';meta.append(name,time);const p=document.createElement('p');p.className='comment-body';p.textContent=data.body;main.append(meta,p);row.append(av,main);list.append(row);list.scrollTop=list.scrollHeight;const card=feed.querySelector('[data-id="'+activePost+'"]');if(card){const n=Number(card.dataset.comments)+1;card.dataset.comments=String(n);updateAction(card,'comment','▤',String(n),false)}input.value='';toast('Comentário publicado!')}catch(err){toast(err.message||'Não foi possível publicar o comentário.')}finally{send.disabled=false}}
feed.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const card=b.closest('.video-card');if(!card)return;switch(b.dataset.action){case'like':return toggleLike(card,b);case'comment':return openComments(card);case'share':return shareVideo(card);case'follow':return toggleFollow(card,b)}});
document.getElementById('closeComments').addEventListener('click',closeComments);document.getElementById('commentsBackdrop').addEventListener('click',e=>{if(e.target.id==='commentsBackdrop')closeComments()});document.getElementById('commentForm').addEventListener('submit',sendComment);document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('commentsBackdrop').classList.contains('open'))closeComments()});document.addEventListener('visibilitychange',()=>{if(document.hidden)feed.querySelectorAll('video').forEach(v=>v.pause())});init();
})();
</script></body></html>
