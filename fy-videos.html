<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080d16"><title>Fy — LinkStory</title><link rel="stylesheet" href="visual-system.css?v=4"><style>
:root{--blue:#0b72e7;--ink:#102033;--muted:#718096;--line:#dce6f1}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#080d16;color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{overflow-x:hidden}.bar{position:fixed;z-index:20;top:0;left:0;right:0;height:62px;display:flex;align-items:center;gap:12px;padding:0 14px;background:linear-gradient(#05080dcc,transparent);pointer-events:none}.bar a,.bar button{pointer-events:auto}.back{width:38px;height:38px;border:1px solid #ffffff40;border-radius:12px;background:#101827aa;color:#fff;font-size:23px}.brand{font-size:21px;font-weight:950}.brand b{color:#8dbbff}.bar .spacer{flex:1}.bar .switch{display:flex;gap:4px;padding:4px;border:1px solid #ffffff30;border-radius:999px;background:#080d1680}.switch a{padding:7px 11px;color:#c4cede;font-size:12px;font-weight:850}.switch a.active{border-radius:999px;background:#fff;color:#102033}.feed{height:100svh;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior-y:contain;background:#080d16}.video-card{position:relative;min-height:100svh;height:100svh;scroll-snap-align:start;display:flex;align-items:center;justify-content:center;background:#090d15;isolation:isolate}.video-card video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#05070b}.shade{position:absolute;inset:35% 0 0;background:linear-gradient(transparent,#000b);pointer-events:none}.details{position:absolute;z-index:2;left:18px;right:76px;bottom:calc(24px + env(safe-area-inset-bottom));text-shadow:0 2px 8px #000}.creator{display:flex;align-items:center;gap:9px;margin-bottom:10px;font-size:13px;font-weight:900}.creator img,.avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;background:#dcecff;color:#0b72e7;display:grid;place-items:center}.caption{font-size:14px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}.actions{position:absolute;z-index:3;right:13px;bottom:calc(28px + env(safe-area-inset-bottom));display:grid;gap:18px}.actions button{width:48px;height:48px;border:1px solid #ffffff40;border-radius:50%;background:#10182799;color:#fff;font-size:20px}.status{position:absolute;inset:50% 20px auto;transform:translateY(-50%);text-align:center;color:#cbd5e1;font-size:13px;line-height:1.5}.load{position:fixed;left:50%;bottom:12px;z-index:10;transform:translateX(-50%);border:1px solid #ffffff40;border-radius:999px;background:#101827cc;color:#fff;padding:10px 16px;font-weight:800}.empty{padding:32px 20px;text-align:center;color:#cbd5e1}.empty a{display:inline-block;margin-top:14px;padding:11px 16px;border-radius:12px;background:#0b72e7;color:#fff;font-weight:850}@media(min-width:700px){.feed{max-width:480px;margin:0 auto;border-inline:1px solid #ffffff18}.bar{max-width:480px;left:50%;right:auto;width:100%;transform:translateX(-50%)}}@media(prefers-reduced-motion:reduce){.feed{scroll-behavior:auto}}
</style></head><body>
<header class="bar"><a class="back" href="fy.html" aria-label="Voltar">‹</a><a class="brand" href="fy.html">Link<b>Story</b></a><span class="spacer"></span><nav class="switch"><a href="fy.html">Pra você</a><a class="active" href="fy-videos.html">Fy</a></nav></header>
<main id="feed" class="feed" aria-label="Vídeos Fy"><div class="status" id="status">Carregando vídeos…</div></main><button class="load" id="loadMore" hidden>Carregar mais</button>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js"></script><script>
(()=>{'use strict';const db=()=>linkstorySupabase,feed=document.getElementById('feed'),status=document.getElementById('status'),more=document.getElementById('loadMore'),params=new URLSearchParams(location.search);let offset=0,loading=false,done=false,observer=null,profileId=params.get('profile')||null;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function init(){try{if(profileId==='me'){const{data}=await db().auth.getUser();if(!data.user)throw Error('Entre na sua conta para ver seus vídeos.');profileId=data.user.id}
await load();more.addEventListener('click',load);feed.addEventListener('scroll',()=>{if(feed.scrollTop+feed.clientHeight>=feed.scrollHeight-500)load()},{passive:true})}catch(e){status.textContent=e.message||'Não foi possível abrir o Fy.'}}
async function load(){if(loading||done)return;loading=true;more.disabled=true;try{let q=db().from('posts').select('id,author_id,body,media_url,media_type,created_at,profiles:author_id(id,username,display_name,avatar_url)').eq('post_type','video').eq('media_type','video').not('media_url','is',null).order('created_at',{ascending:false}).range(offset,offset+9);if(profileId)q=q.eq('author_id',profileId);const{data,error}=await q;if(error)throw error;const rows=data||[];if(!rows.length&&offset===0){status.textContent='Ainda não há vídeos por aqui.';status.className='empty';return}status.hidden=true;rows.forEach(render);offset+=rows.length;done=rows.length<10;more.hidden=done}catch(e){status.hidden=false;status.textContent='Não foi possível carregar os vídeos. '+(e.message||'Tente novamente.')}finally{loading=false;more.disabled=false}}
function render(p){const card=document.createElement('article');card.className='video-card';card.dataset.id=p.id;const video=document.createElement('video');video.src=p.media_url;video.playsInline=true;video.controls=true;video.preload='metadata';video.loop=true;video.muted=true;video.setAttribute('aria-label','Vídeo publicado por '+(p.profiles?.display_name||p.profiles?.username||'usuário'));const shade=document.createElement('div');shade.className='shade';const details=document.createElement('div');details.className='details';const creator=document.createElement('div');creator.className='creator';const av=p.profiles?.avatar_url?document.createElement('img'):document.createElement('span');if(p.profiles?.avatar_url){av.src=p.profiles.avatar_url;av.alt=''}else{av.className='avatar';av.textContent=(p.profiles?.display_name||p.profiles?.username||'LS').slice(0,2).toUpperCase()}const link=document.createElement('a');link.href='public-profile.html?id='+encodeURIComponent(p.author_id);link.textContent=p.profiles?.display_name||p.profiles?.username||'Criador';link.style.color='#fff';creator.append(av,link);const caption=document.createElement('div');caption.className='caption';caption.textContent=p.body||'';details.append(creator,caption);const actions=document.createElement('div');actions.className='actions';const share=document.createElement('button');share.type='button';share.textContent='↗';share.setAttribute('aria-label','Compartilhar vídeo');share.onclick=async()=>{const url=location.origin+location.pathname+'?video='+encodeURIComponent(p.id);try{if(navigator.share)await navigator.share({title:'Vídeo no LinkStory',url});else if(navigator.clipboard)await navigator.clipboard.writeText(url)}catch{}};actions.append(share);card.append(video,shade,details,actions);feed.append(card);if(!observer)observer=new IntersectionObserver(entries=>entries.forEach(entry=>{const v=entry.target.querySelector('video');if(entry.isIntersecting&&entry.intersectionRatio>.65){feed.querySelectorAll('video').forEach(other=>{if(other!==v)other.pause()});v.play().catch(()=>{})}else v.pause()}),{root:feed,threshold:[.2,.65,.9]});observer.observe(card)}
document.addEventListener('visibilitychange',()=>{if(document.hidden)feed.querySelectorAll('video').forEach(v=>v.pause())});init();
})();
</script></body></html>
