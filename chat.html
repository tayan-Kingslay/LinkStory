<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101820"><title>Conversa — LinkStory</title>
<link rel="stylesheet" href="visual-system.css?v=4"><link rel="stylesheet" href="visual-refresh.css?v=2">
<style>
:root{--bg:#f3f6fb;--panel:#fff;--line:#e1e9f2;--ink:#17263a;--muted:#7b8ba0;--blue:#1769d2}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;flex-direction:column}html body.chat-page{padding:0!important;margin:0!important;overflow:hidden!important}html body.chat-page #lsBottomNav,html body.chat-page #lsGlobalMenuButton,html body.chat-page #lsMenu{display:none!important}
header.chat-header{height:82px;flex:none;display:flex;align-items:center;gap:13px;padding:0 18px;background:rgba(255,255,255,.94);border-bottom:1px solid #e3eaf3;box-shadow:0 5px 22px rgba(20,48,82,.06);z-index:2}
.back{width:44px;height:44px;display:grid;place-items:center;border:1px solid #e1e9f2;border-radius:15px;color:#1769d2;background:#f7faff;text-decoration:none;font-size:27px;flex:none}
.peer-link{display:flex;align-items:center;gap:12px;min-width:0;flex:1;text-decoration:none;color:inherit;border-radius:16px;padding:5px 8px;transition:background .18s}
.peer-link:active{background:#f0f6ff}
.avatar{width:50px;height:50px;flex:none;border-radius:50%;background:#eaf3ff;color:#1769d2;display:grid;place-items:center;font-weight:900;overflow:hidden;border:2px solid #fff;box-shadow:0 3px 12px rgba(24,53,87,.12)}
.avatar img{width:100%;height:100%;object-fit:cover}
.who{min-width:0;flex:1}.who strong{display:block;font-size:16px;color:#17263a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.who small{display:block;color:#7b8ba0;font-size:12px;margin-top:4px}
.profile-chevron{font-size:28px;color:#9aabc0;line-height:1}
main{width:min(820px,100%);margin:0 auto;flex:1;min-height:0;display:flex;flex-direction:column;padding:0 16px;background:transparent}
.chat-body{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:13px;padding:24px 5px 18px;overscroll-behavior:contain}
.bubble{max-width:min(78%,560px);padding:14px 17px;border-radius:20px;background:#fff;color:#24364b;font-size:15px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:0 5px 18px rgba(27,53,83,.07);border:1px solid #e8eef5}
.bubble.mine{align-self:flex-end;background:linear-gradient(135deg,#197ce8,#1764c6);color:#fff;border:0;border-bottom-right-radius:7px}.bubble:not(.mine){align-self:flex-start;border-bottom-left-radius:7px}
.bubble time{display:block;font-size:10px;opacity:.68;margin-top:6px}
.inspiration{margin:auto;max-width:410px;text-align:center;padding:25px 20px;background:#fff;border:1px solid #e4ebf4;border-radius:22px;box-shadow:0 8px 26px rgba(24,53,87,.05)}
.spark{width:44px;height:44px;margin:0 auto 11px;border-radius:15px;background:#eaf3ff;color:#1769d2;display:grid;place-items:center;font-size:22px}
.inspiration strong{display:block;font-size:16px;color:#1b2c42}.inspiration p{font-size:13px;line-height:1.6;color:#7b8ba0;margin:8px 0 14px}
.inspiration button{border:1px solid #dce8f6;background:#f7faff;color:#1769d2;border-radius:999px;padding:10px 13px;margin:3px;font-size:11px;font-weight:800}
.compose-wrap{flex:none;padding:12px 0 calc(12px + env(safe-area-inset-bottom));background:transparent}
.compose{display:flex;align-items:flex-end;gap:10px;background:#fff;border:1px solid #e1e9f2;border-radius:22px;padding:9px;box-shadow:0 8px 28px rgba(24,53,87,.08)}
.compose textarea{flex:1;min-width:0;min-height:48px;max-height:120px;resize:none;border:1px solid #e4ebf3;border-radius:15px;outline:0;background:#f9fbfe;color:#17263a;font:inherit;font-size:15px;padding:13px 14px}
.compose textarea::placeholder{color:#94a2b3}
.send{height:48px;min-width:88px;border:0;border-radius:15px;background:linear-gradient(135deg,#197ce8,#1769d2);color:#fff;font-weight:850;box-shadow:0 5px 13px rgba(23,105,210,.2)}
.send:disabled{opacity:.55}
.status{min-height:17px;color:#7b8ba0;font-size:11px;padding:5px 5px}
@media(max-width:560px){header.chat-header{height:78px;padding:0 12px}.back{width:42px;height:42px}.avatar{width:48px;height:48px}.chat-body{padding:18px 2px}.bubble{max-width:88%}.compose-wrap{padding-bottom:calc(10px + env(safe-area-inset-bottom))}.compose{gap:8px;padding:8px;border-radius:19px}.compose textarea{min-height:48px;font-size:16px;padding:12px}.send{min-width:78px;height:48px}}

/* Chat: complete dark theme, matching the site's global dark palette. */
html[data-ls-theme="dark"],html[data-ls-theme="dark"] body{background:#101720!important;color:#f2f6fb!important;color-scheme:dark}
html[data-ls-theme="dark"] header.chat-header{background:rgba(20,28,38,.96)!important;border-bottom-color:#303b49!important;box-shadow:0 5px 22px rgba(0,0,0,.22)!important}
html[data-ls-theme="dark"] .back{background:#1c2633!important;border-color:#344255!important;color:#edf5ff!important}
html[data-ls-theme="dark"] .peer-link{color:#f2f6fb!important}
html[data-ls-theme="dark"] .peer-link:active{background:#202d3c!important}
html[data-ls-theme="dark"] .who strong{color:#f2f6fb!important}
html[data-ls-theme="dark"] .who small,html[data-ls-theme="dark"] .profile-chevron{color:#a8b5c5!important}
html[data-ls-theme="dark"] main{background:transparent!important}
html[data-ls-theme="dark"] .chat-body{background:#101720!important}
html[data-ls-theme="dark"] .bubble:not(.mine){background:#202d3b!important;color:#edf3fa!important;border-color:#344255!important;box-shadow:0 5px 18px rgba(0,0,0,.18)!important}
html[data-ls-theme="dark"] .bubble.mine{background:linear-gradient(135deg,#197ce8,#155db8)!important;color:#fff!important}
html[data-ls-theme="dark"] .inspiration{background:#1b2735!important;border-color:#344255!important;color:#edf3fa!important;box-shadow:0 8px 26px rgba(0,0,0,.2)!important}
html[data-ls-theme="dark"] .inspiration strong{color:#f2f6fb!important}
html[data-ls-theme="dark"] .inspiration p{color:#a8b5c5!important}
html[data-ls-theme="dark"] .spark{background:#203b59!important;color:#78b7ff!important}
html[data-ls-theme="dark"] .inspiration button{background:#223449!important;border-color:#3b536e!important;color:#91c5ff!important}
html[data-ls-theme="dark"] .compose-wrap{background:#101720!important}
html[data-ls-theme="dark"] .compose{background:#1b2735!important;border-color:#344255!important;box-shadow:0 8px 28px rgba(0,0,0,.22)!important}
html[data-ls-theme="dark"] .compose textarea{background:#111b27!important;border-color:#39495c!important;color:#f2f6fb!important;caret-color:#78b7ff}
html[data-ls-theme="dark"] .compose textarea::placeholder{color:#91a1b4!important}
html[data-ls-theme="dark"] .send{background:linear-gradient(135deg,#197ce8,#1769d2)!important;color:#fff!important}
html[data-ls-theme="dark"] .status{color:#a8b5c5!important}


/* Discreet per-message actions and inline editing. */
.message-row{display:flex;flex-direction:column;align-items:flex-start;max-width:100%;gap:3px}
.message-row.mine{align-items:flex-end}
.message-row .bubble{max-width:min(78vw,560px)}
.message-actions{position:relative;display:flex;justify-content:flex-start;padding:0 5px}
.message-row.mine .message-actions{justify-content:flex-end}
.message-options-trigger{width:30px;height:25px;border:0;border-radius:9px;background:transparent;color:#8795a7;font-size:22px;line-height:1;cursor:pointer;opacity:.72}
.message-options-trigger:active,.message-options-trigger:focus-visible{background:#e8eef6;opacity:1;outline:none}
.message-actions-menu{position:relative;display:flex;flex-wrap:wrap;gap:5px;margin:3px 0 7px;padding:7px;background:var(--panel);border:1px solid var(--line);border-radius:13px;box-shadow:0 8px 24px rgba(15,35,60,.13);z-index:3;max-width:min(88vw,370px)}
.message-actions-menu button,.message-edit-controls button{min-height:36px;padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--ink);font-size:12px;font-weight:700}
.message-actions-menu button.danger{color:#d34b55}
.message-edit{width:min(88vw,560px);padding:9px;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 5px 18px rgba(20,40,70,.08)}
.message-edit textarea{width:100%;min-height:72px;resize:vertical;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:14px}
.message-edit-controls{display:flex;justify-content:flex-end;gap:7px;margin-top:7px}
.message-edit-controls button:last-child{background:#1769d2;color:#fff;border-color:#1769d2}
.deleted-message{font-style:italic;opacity:.72}
html[data-ls-theme="dark"] .message-options-trigger{color:#a8b5c5}
html[data-ls-theme="dark"] .message-options-trigger:active,html[data-ls-theme="dark"] .message-options-trigger:focus-visible{background:#26364a}
html[data-ls-theme="dark"] .message-actions-menu,html[data-ls-theme="dark"] .message-edit{background:#1b2735;border-color:#344255;box-shadow:0 8px 24px rgba(0,0,0,.3)}
html[data-ls-theme="dark"] .message-actions-menu button,html[data-ls-theme="dark"] .message-edit-controls button{background:#202d3b;border-color:#3b4d61;color:#edf3fa}
html[data-ls-theme="dark"] .message-actions-menu button.danger{color:#ff9b9b}
html[data-ls-theme="dark"] .message-edit textarea{background:#111b27;border-color:#3b4d61;color:#edf3fa}
html[data-ls-theme="dark"] .message-edit-controls button:last-child{background:#1769d2;color:#fff;border-color:#1769d2}


/* iPhone/Safari: keep the conversation and composer inside the visible area
   when the software keyboard opens; prevent automatic input zoom. */
:root{--chat-vh:100dvh}
html,body{height:100%;min-height:0;overflow:hidden}
body{height:var(--chat-vh,100dvh);min-height:0}
main{min-height:0;overflow:hidden}
.chat-body{min-height:0;overscroll-behavior:contain}
.compose-wrap{flex:none;position:relative;padding-bottom:calc(8px + env(safe-area-inset-bottom))}
.compose textarea{font-size:16px!important;line-height:1.35;touch-action:manipulation}
@media(max-width:560px){.compose textarea{font-size:16px!important}}

</style></head><body class="chat-page">
<header class="chat-header"><a class="back" href="messages.html" aria-label="Voltar às mensagens">‹</a><a class="peer-link" id="peerProfileLink" href="#" aria-label="Ver perfil"><div class="avatar" id="avatar">L</div><span class="who"><strong id="name">Conversa</strong><small id="handle">LinkStory</small></span><span class="profile-chevron">›</span></a></header>
<main><div class="chat-body" id="chatBody"><div class="inspiration"><div class="spark">✦</div><strong>Histórias também começam com uma conversa.</strong><p>Um incentivo simples pode mudar o dia de alguém.</p></div></div>
<div class="compose-wrap"><form class="compose" id="chatForm"><textarea id="chatInput" rows="1" maxlength="5000" placeholder="Escreva uma mensagem…" disabled></textarea><button class="send" id="sendButton" disabled>Enviar</button></form><div class="status" id="status" role="status"></div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js"></script><script src="verification.js?v=1"></script>
<script>
(async()=>{
 const db=linkstorySupabase,$=id=>document.getElementById(id);let user=null,conversation=null,poll=null,loadingMessages=false,lastMessageSignature='';
 const vv=window.visualViewport;
 const syncChatViewport=()=>document.documentElement.style.setProperty('--chat-vh',Math.round(vv?.height||window.innerHeight)+'px');
 syncChatViewport();vv?.addEventListener('resize',syncChatViewport);vv?.addEventListener('scroll',syncChatViewport);window.addEventListener('resize',syncChatViewport);
 $('chatInput').addEventListener('focus',syncChatViewport);
 const friendId=new URLSearchParams(location.search).get('friend');
 const clock=v=>new Date(v).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
 function setStatus(v){$('status').textContent=v}
 function avatar(p){$('avatar').replaceChildren();if(p.avatar_url){const img=document.createElement('img');img.src=p.avatar_url;img.alt='';$('avatar').append(img)}else $('avatar').textContent=(p.display_name||p.username||'L').slice(0,1).toUpperCase()}
 function inspiration(){const box=document.createElement('div');box.className='inspiration';box.innerHTML='<div class="spark">✦</div><strong>Que tal começar com algo positivo?</strong><p>Escolha uma mensagem para enviar e deixe a conversa começar com boas energias.</p><button type="button" data-text="Oi! Como está seu dia?">Perguntar como está</button><button type="button" data-text="Continue criando. Sua história merece ser vista!">Incentivar a criar</button><button type="button" data-text="Passei aqui para desejar um ótimo dia!">Desejar um bom dia</button>';box.querySelectorAll('[data-text]').forEach(b=>b.onclick=()=>{$('chatInput').value=b.dataset.text;$('chatInput').focus()});return box}
 function closeMessageMenus(except){document.querySelectorAll('.message-actions-menu').forEach(m=>{if(m!==except)m.remove()})}
 function renderMessage(m,box){
  const mine=m.sender_id===user.id,wrap=document.createElement('div');wrap.className='message-row'+(mine?' mine':'');
  const b=document.createElement('div');b.className='bubble'+(mine?' mine':'');
  if(m.deleted_for_all_at){b.classList.add('deleted-message');b.textContent='Esta mensagem foi apagada.'}
  else {
   const bodyText=m.body||'',urlPattern=/(https?:\/\/[^\s]+)/g;let cursor=0,match;
   while((match=urlPattern.exec(bodyText))){b.append(document.createTextNode(bodyText.slice(cursor,match.index)));const link=document.createElement('a');link.href=match[0];link.textContent=match[0];link.target='_blank';link.rel='noopener noreferrer';link.style.cssText='color:inherit;text-decoration:underline;text-underline-offset:3px';b.append(link);cursor=match.index+match[0].length}
   b.append(document.createTextNode(bodyText.slice(cursor)));
  }
  const t=document.createElement('time');t.textContent=clock(m.created_at)+(m.edited_at?' · editada':'');b.append(t);wrap.append(b);
  if(!m.deleted_for_all_at){
   const actions=document.createElement('div');actions.className='message-actions';
   const trigger=document.createElement('button');trigger.type='button';trigger.className='message-options-trigger';trigger.setAttribute('aria-label','Opções da mensagem');trigger.title='Opções da mensagem';trigger.textContent='⋯';
   trigger.onclick=()=>{
    const existing=wrap.querySelector('.message-actions-menu');closeMessageMenus(existing);
    if(existing){existing.remove();return}
    const menu=document.createElement('div');menu.className='message-actions-menu';
    const add=(label,fn,cls='')=>{const btn=document.createElement('button');btn.type='button';btn.className=cls;btn.textContent=label;btn.onclick=async()=>{menu.remove();await fn()};menu.append(btn)};
    if(mine)add('Editar mensagem',()=>beginEdit(m,b,wrap));
    add('Apagar para mim',()=>deleteForMe(m.id),'danger');
    if(mine)add('Apagar para todos',()=>deleteForEveryone(m.id),'danger');
    actions.append(menu);
   };
   actions.append(trigger);wrap.append(actions);
  }
  box.append(wrap);
 }
 async function deleteForMe(id){if(!confirm('Apagar esta mensagem somente para você?'))return;const r=await db.rpc('hide_direct_message_for_me',{p_message_id:id});if(r.error){setStatus(r.error.message);return}await loadMessages()}
 async function deleteForEveryone(id){if(!confirm('Apagar esta mensagem para todos os participantes?'))return;const r=await db.rpc('delete_direct_message_for_everyone',{p_message_id:id});if(r.error){setStatus(r.error.message);return}await loadMessages()}
 function beginEdit(m,b,wrap){
  const editor=document.createElement('div');editor.className='message-edit';const input=document.createElement('textarea');input.maxLength=5000;input.value=m.body;input.setAttribute('aria-label','Editar mensagem');
  const controls=document.createElement('div');controls.className='message-edit-controls';
  const cancel=document.createElement('button');cancel.type='button';cancel.textContent='Cancelar';cancel.onclick=()=>editor.remove();
  const save=document.createElement('button');save.type='button';save.textContent='Salvar';save.onclick=async()=>{const value=input.value.trim();if(!value)return;save.disabled=true;const r=await db.rpc('edit_direct_message',{p_message_id:m.id,p_body:value});if(r.error){setStatus(r.error.message);save.disabled=false;return}await loadMessages()};
  controls.append(cancel,save);editor.append(input,controls);wrap.insertBefore(editor,wrap.querySelector('.message-actions'));input.focus();input.setSelectionRange(input.value.length,input.value.length);
 }
 async function loadMessages(){
  if(!conversation||loadingMessages||document.visibilityState==='hidden'||document.querySelector('.message-edit,.message-actions-menu'))return;
  loadingMessages=true;
  try{
   const r=await db.from('messages').select('id,sender_id,body,created_at,edited_at,deleted_for_all_at').eq('conversation_id',conversation).order('created_at',{ascending:true});
   if(r.error){setStatus(r.error.message);return}
   const rows=r.data||[],signature=JSON.stringify(rows.map(m=>[m.id,m.body,m.edited_at,m.deleted_for_all_at,m.created_at]));
   if(signature===lastMessageSignature){setStatus('');return}
   lastMessageSignature=signature;
   const box=$('chatBody'),bottom=box.scrollHeight-box.scrollTop-box.clientHeight<80;
   box.replaceChildren();if(!rows.length)box.append(inspiration());else rows.forEach(m=>renderMessage(m,box));
   if(bottom)box.scrollTop=box.scrollHeight;setStatus('');
  }catch(e){setStatus(e.message||'Não foi possível atualizar as mensagens.')}
  finally{loadingMessages=false}
 }
 $('chatForm').onsubmit=async e=>{e.preventDefault();const body=$('chatInput').value.trim();if(!body||!conversation)return;const btn=$('sendButton');btn.disabled=true;const r=await db.from('messages').insert({conversation_id:conversation,sender_id:user.id,body});btn.disabled=false;if(r.error){setStatus(r.error.message||'Não foi possível enviar.');return}$('chatInput').value='';await loadMessages()};
 const s=await db.auth.getSession();user=s.data.session?.user;if(!user){location.href='login.html?next='+encodeURIComponent('chat.html?friend='+friendId);return}
 if(!friendId){setStatus('Escolha uma pessoa para conversar.');return}
 const p=await db.from('profiles').select('id,username,display_name,avatar_url,verification_type').eq('id',friendId).maybeSingle();if(p.error)throw p.error;if(!p.data)throw new Error('Pessoa não encontrada.');$('name').textContent=p.data.display_name||p.data.username||'Conversa';if(window.LinkStoryVerification)LinkStoryVerification.decorate($('name'),p.data.verification_type);$('handle').textContent='@'+(p.data.username||'LinkStory');avatar(p.data);$('peerProfileLink').href='public-profile.html?id='+encodeURIComponent(p.data.id);
 const c=await db.rpc('create_or_get_direct_conversation',{p_friend_id:friendId});if(c.error)throw c.error;conversation=c.data;$('chatInput').disabled=false;$('sendButton').disabled=false;await loadMessages();poll=setInterval(loadMessages,5000);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')loadMessages()});window.addEventListener('beforeunload',()=>clearInterval(poll));
})().catch(e=>{document.getElementById('status').textContent=e.message||'Não foi possível abrir a conversa.'});
</script></body></html>
