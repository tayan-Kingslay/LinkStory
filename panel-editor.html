<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Organizar quadrinhos · LinkStory</title>
<link rel="stylesheet" href="visual-system.css?v=4"><link rel="stylesheet" href="mobile.css?v=3"><link rel="stylesheet" href="at3-global.css?v=2"><link rel="stylesheet" href="visual-refresh.css?v=2">
<style>
:root{--pe-bg:#0b1220;--pe-card:#121b2b;--pe-line:#ffffff20;--pe-muted:#9aa9bc;--pe-blue:#1976d2}
body{background:var(--pe-bg);color:#fff;margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:30px}
.pe-head{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;padding:12px 16px;background:#0b1220ed;border-bottom:1px solid var(--pe-line);backdrop-filter:blur(14px)}
.pe-back,.pe-btn{min-height:44px;border:1px solid var(--pe-line);border-radius:12px;background:#ffffff0b;color:#fff;padding:10px 14px;text-decoration:none;font-weight:700}
.pe-head-title{min-width:0;flex:1}.pe-head-title strong,.pe-head-title small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pe-head-title small{color:var(--pe-muted);font-size:11px;margin-top:3px}
.pe-wrap{width:min(920px,calc(100% - 24px));margin:20px auto}
.pe-card{background:var(--pe-card);border:1px solid var(--pe-line);border-radius:18px;padding:16px;margin-bottom:14px}
.pe-card h1{font-size:22px;margin:0 0 6px}.pe-card p{color:#b8c4d3;font-size:13px;line-height:1.5;margin:0}
.pe-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.pe-btn.primary{background:var(--pe-blue);border-color:var(--pe-blue)}.pe-btn:disabled{opacity:.45}
.pe-page{position:relative;max-width:720px;margin:16px auto 0;line-height:0;touch-action:pan-y;user-select:none}
.pe-page img{display:block;width:100%;height:auto;border-radius:8px;pointer-events:none}
.pe-overlay{position:absolute;inset:0;cursor:crosshair;touch-action:none}
.pe-selection{position:absolute;border:2px solid #37a2ff;background:#1976d233;pointer-events:none}
.pe-selection b{position:absolute;left:0;top:0;transform:translateY(-100%);background:#1976d2;color:white;font-size:11px;padding:3px 7px;line-height:1.2}
.pe-list{display:grid;gap:8px;margin-top:14px}.pe-item{display:flex;align-items:center;gap:8px;padding:9px;border:1px solid var(--pe-line);border-radius:12px;background:#ffffff06;line-height:1.3}.pe-item strong{font-size:13px;flex:1}.pe-item small{display:block;color:var(--pe-muted);font-size:10px;margin-top:3px}.pe-item button{min-width:38px;min-height:38px;border:1px solid var(--pe-line);border-radius:9px;background:#ffffff08;color:white}
.pe-status{font-size:12px;color:#b8c4d3;margin-top:10px;min-height:18px}.pe-pages{display:flex;gap:8px;overflow:auto;padding:4px 0 10px}.pe-page-tab{flex:0 0 auto;border:1px solid var(--pe-line);border-radius:10px;background:#ffffff08;color:white;padding:9px 12px}.pe-page-tab.active{background:var(--pe-blue);border-color:var(--pe-blue)}
@media(max-width:600px){.pe-wrap{width:calc(100% - 16px);margin:12px auto}.pe-card{padding:13px}.pe-head{padding:9px}.pe-card h1{font-size:19px}}
</style>
</head>
<body>
<header class="pe-head"><a class="pe-back" id="back" href="javascript:history.back()" aria-label="Voltar">‹</a><div class="pe-head-title"><strong id="mangaTitle">LinkStory</strong><small id="chapterTitle">Organizador de quadrinhos</small></div><button class="pe-btn primary" id="save" disabled>Salvar</button></header>
<main class="pe-wrap">
<section class="pe-card"><h1>Separe os quadrinhos</h1><p>Marque cada quadro arrastando o dedo ou o mouse sobre a página. A arte original será preservada. Depois, organize a ordem de leitura antes de salvar.</p><div class="pe-toolbar"><button class="pe-btn" id="undo" disabled>Desfazer seleção</button><button class="pe-btn" id="clear">Limpar esta página</button></div><div class="pe-status" id="status" aria-live="polite">Carregando capítulo…</div></section>
<section class="pe-card"><strong>Páginas do capítulo</strong><div class="pe-pages" id="pageTabs"></div><div class="pe-page" id="pageStage"><img id="pageImage" alt="Página do mangá"><div class="pe-overlay" id="overlay"></div></div><div class="pe-list" id="panelList"></div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js"></script><script src="manga-db.js?v=20261110-3"></script>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),q=new URLSearchParams(location.search),chapterId=q.get('chapter_id'),mangaId=q.get('manga_id');
let chapter=null,manga=null,pages=[],pageIndex=0,drag=null,dirty=false;
const setStatus=t=>$('status').textContent=t;
const clamp=n=>Math.max(0,Math.min(1,n));
function current(){return pages[pageIndex]}
function markDirty(){dirty=true;$('save').disabled=false}
function renderTabs(){const box=$('pageTabs');box.replaceChildren();pages.forEach((p,i)=>{const b=document.createElement('button');b.className='pe-page-tab'+(i===pageIndex?' active':'');b.textContent='Página '+(i+1)+(p.panels.length?' · '+p.panels.length:'');b.onclick=()=>{pageIndex=i;render()};box.append(b)})}
function renderPanels(){const box=$('panelList');box.replaceChildren();current().panels.forEach((p,i)=>{const row=document.createElement('div');row.className='pe-item';const name=document.createElement('strong');name.textContent='Quadrinho '+(i+1);const meta=document.createElement('small');meta.textContent='Área selecionada: '+Math.round(p.width*100)+'% × '+Math.round(p.height*100)+'%';name.append(meta);const up=document.createElement('button');up.textContent='↑';up.disabled=i===0;up.setAttribute('aria-label','Mover quadrinho para cima');up.onclick=()=>{const a=current().panels;a.splice(i-1,0,a.splice(i,1)[0]);markDirty();render()};const down=document.createElement('button');down.textContent='↓';down.disabled=i===current().panels.length-1;down.setAttribute('aria-label','Mover quadrinho para baixo');down.onclick=()=>{const a=current().panels;a.splice(i+1,0,a.splice(i,1)[0]);markDirty();render()};const del=document.createElement('button');del.textContent='×';del.setAttribute('aria-label','Excluir quadrinho');del.onclick=()=>{current().panels.splice(i,1);markDirty();render()};row.append(name,up,down,del);box.append(row)})}
function renderOverlay(){const overlay=$('overlay');overlay.replaceChildren();current().panels.forEach((p,i)=>{const d=document.createElement('div');d.className='pe-selection';d.style.left=(p.x*100)+'%';d.style.top=(p.y*100)+'%';d.style.width=(p.width*100)+'%';d.style.height=(p.height*100)+'%';const label=document.createElement('b');label.textContent=String(i+1);d.append(label);overlay.append(d)})}
function render(){const p=current();$('pageImage').src=p.image_url;$('pageImage').alt='Página '+(pageIndex+1);renderTabs();renderPanels();renderOverlay();$('undo').disabled=!p.panels.length;setStatus('Página '+(pageIndex+1)+' de '+pages.length+' · '+p.panels.length+' quadrinho(s) marcados.')}
function point(e){const r=$('overlay').getBoundingClientRect();return{x:clamp((e.clientX-r.left)/r.width),y:clamp((e.clientY-r.top)/r.height)}}
$('overlay').addEventListener('pointerdown',e=>{if(e.button!==undefined&&e.button!==0)return;drag=point(e);$('overlay').setPointerCapture(e.pointerId);const d=document.createElement('div');d.className='pe-selection';d.id='pe-draft';$('overlay').append(d)});
$('overlay').addEventListener('pointermove',e=>{if(!drag)return;const p=point(e),d=$('pe-draft');if(!d)return;d.style.left=Math.min(drag.x,p.x)*100+'%';d.style.top=Math.min(drag.y,p.y)*100+'%';d.style.width=Math.abs(p.x-drag.x)*100+'%';d.style.height=Math.abs(p.y-drag.y)*100+'%'});
$('overlay').addEventListener('pointerup',e=>{if(!drag)return;const end=point(e),start=drag;drag=null;const x=Math.min(start.x,end.x),y=Math.min(start.y,end.y),w=Math.abs(end.x-start.x),h=Math.abs(end.y-start.y);$('pe-draft')?.remove();if(w<.025||h<.025){setStatus('A seleção ficou muito pequena. Arraste para marcar a área do quadrinho.');return}current().panels.push({x,y,width:w,height:h});markDirty();render()});
$('undo').onclick=()=>{current().panels.pop();markDirty();render()};$('clear').onclick=()=>{if(!current().panels.length)return;current().panels=[];markDirty();render()};
$('save').onclick=async()=>{const b=$('save');b.disabled=true;b.textContent='Salvando…';try{for(const p of pages){const{error}=await linkstorySupabase.from('manga_pages').update({panels:p.panels.map((x,i)=>({...x,order:i+1}))}).eq('id',p.id);if(error)throw error}dirty=false;b.textContent='Salvo';setStatus('Quadrinhos salvos. O leitor por quadrinho já poderá usar esta sequência.')}catch(e){console.error(e);b.textContent='Salvar';b.disabled=false;setStatus('Não foi possível salvar: '+(e.message||'verifique sua conexão'))}};
(async()=>{try{if(!chapterId||!mangaId)throw Error('Capítulo não informado.');const session=await LinkStoryManga.session();if(!session)throw Error('Entre na sua conta para organizar os quadrinhos.');manga=await LinkStoryManga.mangaById(mangaId);if(!manga||manga.creator_id!==session.user.id)throw Error('Somente o criador da obra pode organizar os quadrinhos.');chapter=await LinkStoryManga.chapterWithPages(chapterId);if(!chapter||chapter.manga_id!==mangaId)throw Error('Capítulo não encontrado.');pages=chapter.pages.map(p=>({id:p.id,image_url:p.image_url,panels:Array.isArray(p.panels)?p.panels:[]}));if(!pages.length)throw Error('Este capítulo ainda não tem páginas.');$('mangaTitle').textContent=manga.title;$('chapterTitle').textContent='Capítulo '+chapter.chapter_number+' · '+(chapter.title||'');$('back').href='manga.html?id='+mangaId;render()}catch(e){setStatus(e.message||'Não foi possível abrir o organizador.');$('save').disabled=true;console.error(e)}})();
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}})
})();
</script>
</body></html>
