<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1220"><title>LinkStory Reader</title><style>:root{--blue:#1976d2;--muted:#8e9aaa;--reader:#0b1220;--reader2:#121b2b;--paper:#fff}*{box-sizing:border-box}body{margin:0;background:var(--reader);color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.top{height:68px;position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;padding:0 14px;background:#0b1220f2;border-bottom:1px solid #ffffff12;backdrop-filter:blur(15px)}.back{width:40px;height:40px;border:1px solid #ffffff18;border-radius:50%;display:grid;place-items:center;color:#fff;text-decoration:none;font-size:25px}.mark{width:38px;height:38px;border-radius:9px;background:#ffffff10;overflow:hidden;display:grid;place-items:center;color:#9db2c9;font-size:9px;font-weight:900}.mark img{width:100%;height:100%;object-fit:contain}.meta{min-width:0}.meta strong,.meta span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta strong{font-size:14px}.meta span{font-size:10px;color:var(--muted);margin-top:2px}.chapter{margin-left:auto;text-align:right;min-width:120px}.chapter small{display:block;font-size:8px;color:var(--muted);letter-spacing:1.2px}.chapter strong{display:block;font-size:11px;margin-top:2px}.chapter em{display:block;font-style:normal;color:#b9c4d2;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pages{width:min(900px,100%);margin:auto}.page{display:block;width:100%;height:auto;background:#fff}.page.placeholder{min-height:65vh;display:grid;place-items:center;color:#7e8998;font-size:13px}.end{width:min(900px,100%);margin:auto;padding:18px 14px 110px}.card{background:var(--reader2);border:1px solid #ffffff10;border-radius:18px;padding:20px}.card h2{font-size:18px;margin:0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.action{border:1px solid #ffffff16;background:#ffffff08;color:#fff;border-radius:10px;padding:10px 13px}.action.active{background:var(--blue);border-color:var(--blue)}.controls{position:fixed;z-index:20;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:4px;padding:5px;background:#121b2bf2;border:1px solid #ffffff16;border-radius:15px}.controls button{height:40px;min-width:40px;border:0;border-radius:10px;background:transparent;color:#fff}.controls .primary{background:var(--blue)}@media(max-width:600px){.top{height:62px;padding:0 9px}.chapter{min-width:100px}.meta strong{font-size:13px}.pages{padding:0}.end{padding-bottom:105px}.controls{bottom:9px}}</style></head><body><header class="top"><a class="back" href="index.html">‹</a><div class="mark" id="mark">LS</div><div class="meta"><strong id="title">Tuketon</strong><span id="author">Tayan Kingslay</span></div><div class="chapter"><small>LENDO AGORA</small><strong id="chapter">Capítulo 001</strong><em id="chapterTitle">O começo</em></div></header><main class="pages" id="pages"></main><section class="end"><div class="card"><h2>Fim do capítulo</h2><div class="actions"><button class="action" id="like">♥ Curtir</button><button class="action" id="save">🔖 Salvar</button><button class="action" id="share">↗ Compartilhar</button></div></div></section><nav class="controls"><button onclick="scrollTo({top:0,behavior:'smooth'})">↑</button><button id="counter">1 / 1</button><button onclick="scrollBy({top:innerHeight*.85,behavior:'smooth'})">↓</button><button class="primary" onclick="location.href='index.html'">⌂</button></nav><script>(()=>{const q=new URLSearchParams(location.search);let data=null;try{data=JSON.parse(localStorage.getItem('linkstory_test_manga')||localStorage.getItem('linkstory_published_manga')||'null')}catch{}const title=q.get('manga')||data?.title||'Tuketon';const record=data&&(!q.get('manga')||data.title===q.get('manga'))?data:null;const author=q.get('author')||record?.author||'Tayan Kingslay';const chapter=q.get('chapter')||record?.chapterNumber||'001';const chapterTitle=q.get('chapterTitle')||record?.chapterTitle||'O começo';document.title=title+' — '+chapterTitle+' — LinkStory';document.getElementById('title').textContent=title;document.getElementById('author').textContent=author;document.getElementById('chapter').textContent='Capítulo '+chapter;document.getElementById('chapterTitle').textContent=chapterTitle;if(record?.logo){const img=document.createElement('img');img.src=record.logo;img.alt='Logo de '+title;document.getElementById('mark').replaceChildren(img)}const list=document.getElementById('pages');const source=record?.pages||[];if(source.length){source.forEach((src,i)=>{const img=document.createElement('img');img.className='page';img.src=src;img.alt='Página '+(i+1);list.appendChild(img)});document.getElementById('counter').textContent='1 / '+source.length}else{const empty=document.createElement('div');empty.className='page placeholder';empty.textContent='Nenhuma página publicada neste capítulo.';list.appendChild(empty)}document.getElementById('like').onclick=e=>e.currentTarget.classList.toggle('active');document.getElementById('save').onclick=e=>e.currentTarget.classList.toggle('active');document.getElementById('share').onclick=async()=>{try{await navigator.share({title:title+' — '+chapterTitle,url:location.href})}catch{try{await navigator.clipboard.writeText(location.href)}catch{}}};const key='linkstory-last-reading-v1';try{localStorage.setItem(key,JSON.stringify({title,author,chapter,chapterTitle,url:location.href,updatedAt:Date.now()}))}catch{}})();</script></body></html>
