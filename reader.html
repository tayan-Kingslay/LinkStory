<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LinkStory Reader</title><style>:root{--b:#1976d2;--r:#0b1220;--m:#8e9aaa}*{box-sizing:border-box}body{margin:0;background:var(--r);color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.top{height:132px;display:flex;align-items:center;padding:0 14px;background:#0b1220f5;border-bottom:1px solid #ffffff12;position:sticky;top:0;z-index:5}.back{width:48px;height:48px;border:1px solid #ffffff18;border-radius:50%;display:grid;place-items:center;color:#fff;text-decoration:none;font-size:32px}.mark{position:absolute;left:50%;transform:translateX(-50%);width:205px;height:90px;display:grid;place-items:center}.mark img{width:100%;height:100%;object-fit:contain}.fallback{font-size:22px;font-weight:900}.chap{margin-left:auto;text-align:right}.chap small{display:block;font-size:8px;color:var(--m);letter-spacing:1.3px}.chap strong{display:block;margin-top:4px}.chap em{display:block;color:#b9c4d2;font-style:normal;font-size:11px}.pages{width:min(900px,100%);margin:auto}.page{display:block;width:100%;height:auto;background:#fff}.empty{min-height:70vh;display:grid;place-items:center;color:#8995a5}.end{width:min(900px,100%);margin:auto;padding:20px 14px 90px}.panel{background:#121b2b;border:1px solid #ffffff10;border-radius:16px;padding:18px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.btn{border:1px solid #ffffff16;background:#ffffff08;color:#fff;border-radius:10px;padding:10px 14px;font-weight:800}.btn.active,.primary{background:var(--b);border-color:var(--b)}.stars button{border:0;background:none;color:#8290a2;font-size:25px;padding:2px}.stars button.active{color:#f2b01e}.comment{display:flex;gap:8px;margin-top:12px}.comment input{flex:1;padding:11px;border:0;border-radius:9px}.comment button{border:0;border-radius:9px;background:var(--b);color:#fff;padding:0 14px;font-weight:800}.comments{margin-top:15px}.c{border-top:1px solid #ffffff12;padding:12px 0}.c strong{font-size:12px}.c p{font-size:13px;color:#c5ced9;margin:5px 0}.controls{position:fixed;bottom:9px;left:50%;transform:translateX(-50%);display:flex;gap:4px;padding:5px;background:#121b2bf2;border:1px solid #ffffff16;border-radius:15px;z-index:10}.controls button{height:40px;min-width:40px;border:0;border-radius:10px;background:transparent;color:#fff}.controls .primary{background:var(--b)}@media(min-width:701px){.top{height:158px}.mark{width:300px;height:132px}.fallback{font-size:34px}.chap small{font-size:12px}.chap strong{font-size:25px}.chap em{font-size:20px}}@media(max-width:600px){.top{height:108px}.mark{width:150px;height:70px}.chap{max-width:105px}.chap strong{font-size:12px}.chap em{font-size:10px;max-width:105px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.comment{display:grid}.comment button{height:42px}}</style></head><body><header class="top"><a class="back" id="back">‹</a><div class="mark" id="mark"></div><div class="chap"><small>LENDO AGORA</small><strong id="chapter">Capítulo</strong><em id="chapterTitle"></em></div></header><main><div class="pages" id="pages"><div class="empty">Carregando…</div></div></main><section class="end"><div class="panel"><strong>Gostou deste capítulo?</strong><div class="actions"><button class="btn" id="like">♥ Curtir</button><button class="btn" id="save">🔖 Salvar</button></div><div class="stars" id="stars"></div><div class="comment"><input id="commentText" maxlength="1000" placeholder="Comente sobre o mangá"><button id="commentBtn">Comentar</button></div><div class="comments" id="comments"></div></div></section><nav class="controls"><button onclick="scrollTo({top:0,behavior:'smooth'})">↑</button><button id="counter">1 / 1</button><button onclick="scrollBy({top:innerHeight*.85,behavior:'smooth'})">↓</button><button class="primary" id="home">⌂</button></nav><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js"></script><script src="manga-db.js"></script><script>(async()=>{const $=id=>document.getElementById(id),q=new URLSearchParams(location.search);try{const m=await LinkStoryManga.mangaById(q.get('manga_id'));if(!m)throw Error('notfound');const cs=await LinkStoryManga.chapters(m.id);const ch=await LinkStoryManga.chapterWithPages(q.get('chapter_id')||cs[0]?.id);if(!ch)throw Error('chapter');$('back').href='manga.html?id='+m.id;$('home').onclick=()=>location.href='manga.html?id='+m.id;$('chapter').textContent='Capítulo '+String(ch.chapter_number).padStart(3,'0');$('chapterTitle').textContent=ch.title||'';if(m.logo_url){const i=document.createElement('img');i.src=m.logo_url;i.alt='Logo de '+m.title;$('mark').append(i)}else{$('mark').innerHTML='<span class="fallback">'+m.title+'</span>'}const box=$('pages');box.innerHTML='';if(!ch.pages.length)box.innerHTML='<div class="empty">Este capítulo ainda não possui páginas.</div>';ch.pages.forEach((p,i)=>{const img=document.createElement('img');img.className='page';img.src=p.image_url;img.alt='Página '+(i+1);box.append(img)});let idx=0;const setCounter=()=>{$('counter').textContent='Capítulo '+String(ch.chapter_number).padStart(3,'0')};setCounter();let count=(await LinkStoryManga.stats(m.id)).likes,liked=await LinkStoryManga.liked(m.id);$('like').textContent='♥ '+count+' Curtir'+(count===1?'':'s');$('like').classList.toggle('active',liked);$('like').onclick=async()=>{try{if(!await LinkStoryManga.session())return location.href='login.html';liked=await LinkStoryManga.toggleLike(m.id);count=Math.max(0,count+(liked?1:-1));$('like').textContent='♥ '+count+' Curtir'+(count===1?'':'s');$('like').classList.toggle('active',liked)}catch{}};let my=await LinkStoryManga.myRating(m.id);for(let n=1;n<=5;n++){const b=document.createElement('button');b.textContent='★';b.className=n<=my?'active':'';b.onclick=async()=>{try{if(!await LinkStoryManga.session())return location.href='login.html';await LinkStoryManga.rate(m.id,n);my=n;document.querySelectorAll('.stars button').forEach((x,i)=>x.classList.toggle('active',i<n))}catch{}};$('stars').append(b)}async function comments(){const arr=await LinkStoryManga.comments(m.id),box=$('comments');box.innerHTML='';arr.forEach(c=>{const d=document.createElement('div');d.className='c';d.innerHTML='<strong>'+((c.profiles?.display_name||c.profiles?.username||'Usuário'))+'</strong><p>'+c.body+'</p>';box.append(d)});if(!arr.length)box.innerHTML='<small style="color:#8e9aaa">Ainda não há comentários.</small>'}comments();$('commentBtn').onclick=async()=>{const v=$('commentText').value.trim();if(!v)return;try{if(!await LinkStoryManga.session())return location.href='login.html';await LinkStoryManga.addComment(m.id,v);$('commentText').value='';comments()}catch{}};try{localStorage.setItem('linkstory-last-reading-v1',JSON.stringify({mangaId:m.id,chapterId:ch.id,updatedAt:Date.now()}))}catch{}}catch(e){console.error(e);$('pages').innerHTML='<div class="empty">Não foi possível carregar este capítulo.</div>'}})();</script></body></html>
