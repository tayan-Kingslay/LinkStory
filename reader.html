<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1220"><title>LinkStory Reader</title><style>:root{--blue:#1976d2;--muted:#8e9aaa;--reader:#0b1220;--reader2:#121b2b}*{box-sizing:border-box}body{margin:0;background:var(--reader);color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.top{height:158px;position:sticky;top:0;z-index:10;display:flex;align-items:center;padding:0 24px;background:#0b1220f5;border-bottom:1px solid #ffffff12;backdrop-filter:blur(15px);position:relative}.back{width:58px;height:58px;border:1px solid #ffffff18;border-radius:50%;display:grid;place-items:center;color:#fff;text-decoration:none;font-size:38px;line-height:1;flex:none;z-index:2}.mark{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:300px;height:132px;display:grid;place-items:center;overflow:hidden;padding:0;background:transparent}.mark img{display:block;width:100%;height:100%;object-fit:contain}.fallback-title{font-size:34px;font-weight:900;letter-spacing:-1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:300px}.chapter{margin-left:auto;text-align:right;min-width:170px;z-index:2}.chapter small{display:block;font-size:12px;color:var(--muted);letter-spacing:2.4px}.chapter strong{display:block;font-size:25px;margin-top:5px}.chapter em{display:block;font-style:normal;color:#b9c4d2;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}.pages{width:min(900px,100%);margin:auto}.page{display:block;width:100%;height:auto;background:#fff}.page.placeholder{min-height:65vh;display:grid;place-items:center;color:#7e8998;font-size:13px}.end{width:min(900px,100%);margin:auto;padding:18px 14px 110px}.card{background:var(--reader2);border:1px solid #ffffff10;border-radius:18px;padding:20px}.card h2{font-size:18px;margin:0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.action{border:1px solid #ffffff16;background:#ffffff08;color:#fff;border-radius:10px;padding:10px 13px}.action.active{background:var(--blue);border-color:var(--blue)}.controls{position:fixed;z-index:20;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:4px;padding:5px;background:#121b2bf2;border:1px solid #ffffff16;border-radius:15px}.controls button{height:40px;min-width:40px;border:0;border-radius:10px;background:transparent;color:#fff}.controls .primary{background:var(--blue)}@media(max-width:700px){.top{height:145px;padding:0 14px}.back{width:48px;height:48px;font-size:32px}.mark{width:235px;height:105px}.fallback-title{font-size:25px;max-width:235px}.chapter{min-width:125px}.chapter small{font-size:9px;letter-spacing:1.7px}.chapter strong{font-size:18px}.chapter em{font-size:14px;max-width:180px}.pages{padding:0}.end{padding-bottom:105px}.controls{bottom:9px}}@media(max-width:430px){.top{height:132px;padding:0 10px}.back{width:42px;height:42px;font-size:28px}.mark{width:205px;height:90px}.fallback-title{font-size:20px;max-width:205px}.chapter{min-width:95px}.chapter small{font-size:7px;letter-spacing:1.2px}.chapter strong{font-size:14px}.chapter em{font-size:11px;max-width:130px}}</style></head><body><header class="top"><a class="back" href="index.html" aria-label="Voltar">‹</a><div class="mark" id="mark"></div><div class="chapter"><small>LENDO AGORA</small><strong id="chapter">Capítulo 001</strong><em id="chapterTitle">O começo</em></div></header><main class="pages" id="pages"></main><section class="end"><div class="card"><h2>Fim do capítulo</h2><div class="actions"><button class="action" id="like">♥ Curtir</button><button class="action" id="save">🔖 Salvar</button><button class="action" id="share">↗ Compartilhar</button></div></div></section><nav class="controls"><button onclick="scrollTo({top:0,behavior:'smooth'})">↑</button><button id="counter">1 / 1</button><button onclick="scrollBy({top:innerHeight*.85,behavior:'smooth'})">↓</button><button class="primary" onclick="location.href='index.html'">⌂</button></nav><script>(()=>{const q=new URLSearchParams(location.search);let data=null;try{data=JSON.parse(localStorage.getItem('linkstory_published_manga')||localStorage.getItem('linkstory_test_manga')||'null')}catch{}const title=q.get('manga')||data?.title||'Tuketon',record=data&&(!q.get('manga')||data.title===q.get('manga'))?data:null,author=q.get('author')||record?.author||'Tayan Kingslay',chapter=q.get('chapter')||record?.chapterNumber||'001',chapterTitle=q.get('chapterTitle')||record?.chapterTitle||'O começo';document.title=title+' — '+chapterTitle+' — LinkStory';$('chapter').textContent='Capítulo '+chapter;$('chapterTitle').textContent=chapterTitle;const useLogo=record?.logoEnabled!==false&&!!record?.logo;if(useLogo){const img=document.createElement('img');img.src=record.logo;img.alt='Logo de '+title;$('mark').replaceChildren(img)}else{const span=document.createElement('span');span.className='fallback-title';span.textContent=title;$('mark').replaceChildren(span)}const source=record?.pages||[],list=$('pages');if(source.length){source.forEach((src,i)=>{const img=document.createElement('img');img.className='page';img.src=src;img.alt='Página '+(i+1);list.appendChild(img)});$('counter').textContent='1 / '+source.length}else{const empty=document.createElement('div');empty.className='page placeholder';empty.textContent='Nenhuma página publicada neste capítulo.';list.appendChild(empty)}$('like').onclick=e=>e.currentTarget.classList.toggle('active');$('save').onclick=e=>e.currentTarget.classList.toggle('active');$('share').onclick=async()=>{try{await navigator.share({title:title+' — '+chapterTitle,url:location.href})}catch{try{await navigator.clipboard.writeText(location.href)}catch{}}};try{localStorage.setItem('linkstory-last-reading-v1',JSON.stringify({title,author,chapter,chapterTitle,url:location.href,updatedAt:Date.now()}))}catch{}})();function $(id){return document.getElementById(id)}</script></body></html>
