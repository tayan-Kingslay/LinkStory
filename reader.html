rEach(c=>{const d=document.createElement('div');d.className='c';const who=document.createElement('strong');who.textContent=c.profiles?.display_name||c.profiles?.username||'Usuário';if(window.LinkStoryVerification)LinkStoryVerification.decorate(who,c.profiles?.verification_type);const body=document.createElement('p');body.textContent=c.body||'';d.append(who,body);box.append(d);if(window.LinkStoryGuard&&c.id)window.LinkStoryGuard.mountReportButton(d,{target_type:'comment',target_id:c.id},'Denunciar comentário')});if(!arr.length)box.innerHTML='<div class="comments-empty"><strong>Comece a conversa.</strong><small>Este espaço ainda não tem comentários.</small></div>'}try{await comments()}catch(error){console.warn('Falha ao carregar comentários.',error);$('comments').innerHTML='<div class="comments-error" role="status">Não foi possível carregar os comentários. Tente novamente.</div>'}const placeCommentsClose=()=>{const box=$('comments'),close=$('commentsClose');if(!box||!close||!box.classList.contains('show'))return;close.style.top=Math.max(12,innerHeight-box.offsetHeight+12)+'px';close.style.bottom='auto'};const toggleComments=on=>{const box=$('comments'),backdrop=$('commentBackdrop'),close=$('commentsClose'),toggle=$('commentsToggle');box.classList.toggle('show',on);backdrop.hidden=!on;close.hidden=!on;toggle.setAttribute('aria-expanded',String(on));document.body.style.overflow=on?'hidden':'';if(on){placeCommentsClose();close.focus()}else{close.style.top='';close.style.bottom='';toggle.focus()}};addEventListener('resize',placeCommentsClose);$('commentsToggle').onclick=()=>toggleComments(true);$('commentsClose').onclick=()=>toggleComments(false);$('commentBackdrop').onclick=()=>toggleComments(false);$('commentBtn').onclick=async()=>{const v=$('commentText').value.trim();if(!v)return;try{if(!await LinkStoryManga.session())return location.href='login.html';await LinkStoryManga.addComment(m.id,v);$('commentText').value='';try{await comments()}catch(error){$('comments').innerHTML='<div class="comments-error" role="status">Seu comentário foi enviado, mas a lista não pôde ser atualizada.</div>'}}catch(error){console.warn('Falha ao enviar comentário.',error);const box=$('comments');box.innerHTML='<div class="comments-error" role="status">Não foi possível enviar. Confira sua conexão e tente novamente.</div>';toggleComments(true)}};try{localStorage.setItem('linkstory-last-reading-v1',JSON.stringify({mangaId:m.id,chapterId:ch.id,updatedAt:Date.now()}))}catch{}

(()=>{const $=id=>document.getElementById(id);const counter=$('counter');const update=()=>{const pages=[...document.querySelectorAll('.reader-page')];if(!pages.length){counter.textContent='0 / 0';return;}let best=0,score=-Infinity;pages.forEach((p,i)=>{const r=p.getBoundingClientRect(),visible=Math.max(0,Math.min(r.bottom,innerHeight)-Math.max(r.top,0)),s=visible/Math.max(1,Math.min(r.height,innerHeight));if(s>score){score=s;best=i}});counter.textContent=(best+1)+' / '+pages.length};$('toTop')?.addEventListener('click',()=>scrollTo({top:0,behavior:'smooth'}));$('toBottom')?.addEventListener('click',()=>scrollBy({top:innerHeight*.82,behavior:'smooth'}));addEventListener('scroll',update,{passive:true});addEventListener('resize',update);document.querySelectorAll('.reader-page').forEach(p=>p.addEventListener('load',update,{once:true}));const focusToggle=document.createElement('button');focusToggle.type='button';focusToggle.className='reader-focus-toggle';focusToggle.setAttribute('aria-label','Alternar leitura sem distrações');focusToggle.textContent='◉';focusToggle.style.cssText='position:fixed;right:16px;top:76px;z-index:70;width:38px;height:38px;border:1px solid #ffffff20;border-radius:50%;background:#151c26;color:#dce8f5;font-size:16px;opacity:.78';focusToggle.addEventListener('click',()=>{document.body.classList.toggle('reading-focus');focusToggle.textContent=document.body.classList.contains('reading-focus')?'◎':'◉';focusToggle.style.opacity=document.body.classList.contains('reading-focus')?'0.48':'0.78'});document.body.append(focusToggle);document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.body.classList.remove('reading-focus');$('comments')?.classList.remove('show');if($('commentBackdrop'))$('commentBackdrop').hidden=true;if($('commentsClose'))$('commentsClose').hidden=true;document.body.style.overflow=''}if(e.target?.matches?.('input,textarea,select,[contenteditable="true"]'))return;if(e.key==='ArrowDown')scrollBy({top:innerHeight*.8,behavior:'smooth'});if(e.key==='ArrowUp')scrollBy({top:-innerHeight*.8,behavior:'smooth'})});setTimeout(update,350);})();
