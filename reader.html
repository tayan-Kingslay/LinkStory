<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1220"><title>LinkStory Reader</title><style>:root{--blue:#1976d2;--muted:#8e9aaa;--reader:#0b1220;--reader2:#121b2b}*{box-sizing:border-box}body{margin:0;background:var(--reader);color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.top{height:132px;position:sticky;top:0;z-index:20;display:flex;align-items:center;padding:0 14px;background:#0b1220f5;border-bottom:1px solid #ffffff12;backdrop-filter:blur(15px);position:relative}.back{width:48px;height:48px;border:1px solid #ffffff18;border-radius:50%;display:grid;place-items:center;color:#fff;text-decoration:none;font-size:32px;line-height:1;flex:none;z-index:3}.mark{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:205px;height:90px;display:grid;place-items:center;overflow:hidden;background:transparent}.mark img{display:block;width:100%;height:100%;object-fit:contain}.fallback-title{font-size:20px;font-weight:900;letter-spacing:-1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:205px}.chapter{margin-left:auto;text-align:right;min-width:95px;z-index:3}.chapter small{display:block;font-size:7px;color:var(--muted);letter-spacing:1.2px}.chapter strong{display:block;font-size:14px;margin-top:4px}.chapter em{display:block;font-style:normal;color:#b9c4d2;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}.pages{width:min(900px,100%);margin:auto}.page{display:block;width:100%;height:auto;background:#fff}.placeholder{min-height:65vh;display:grid;place-items:center;color:#7e8998;font-size:13px}.end{width:min(900px,100%);margin:auto;padding:18px 14px 110px}.card{background:var(--reader2);border:1px solid #ffffff10;border-radius:18px;padding:20px}.card h2{font-size:18px;margin:0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.action,.mode-btn{border:1px solid #ffffff16;background:#ffffff08;color:#fff;border-radius:10px;padding:10px 13px}.action.active,.mode-btn.active{background:var(--blue);border-color:var(--blue)}.controls{position:fixed;z-index:30;left:50%;bottom:9px;transform:translateX(-50%);display:flex;gap:4px;padding:5px;background:#121b2bf2;border:1px solid #ffffff16;border-radius:15px}.controls button{height:40px;min-width:40px;border:0;border-radius:10px;background:transparent;color:#fff}.controls .primary{background:var(--blue)}.modebar{display:flex;gap:7px;margin:0 0 16px}.mode-btn{font-size:12px;font-weight:800}.book-wrap{display:none;min-height:calc(100vh - 150px);padding:28px 12px 110px;place-items:center;perspective:1600px}.book{position:relative;width:min(820px,96vw);height:min(72vh,650px);transform-style:preserve-3d}.book:before,.book:after{content:"";position:absolute;top:3%;bottom:3%;width:50%;background:#f8f6ef;box-shadow:0 12px 35px #0008}.book:before{left:0;border-radius:8px 2px 2px 8px;transform-origin:right center}.book:after{right:0;border-radius:2px 8px 8px 2px;transform-origin:left center}.sheet{position:absolute;top:3%;bottom:3%;left:50%;width:50%;transform-origin:left center;transform-style:preserve-3d;transition:transform .65s cubic-bezier(.2,.75,.2,1);z-index:4}.sheet.flipped{transform:rotateY(-180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;background:#fff;overflow:hidden;box-shadow:0 5px 18px #0005}.face img{width:100%;height:100%;object-fit:contain;display:block}.face.back{transform:rotateY(180deg);border-radius:2px 8px 8px 2px}.left-page,.right-page{position:absolute;top:3%;bottom:3%;width:50%;background:#fff;overflow:hidden;box-shadow:0 5px 18px #0005}.left-page{left:0;border-radius:8px 2px 2px 8px}.right-page{right:0;border-radius:2px 8px 8px 2px}.left-page img,.right-page img{width:100%;height:100%;object-fit:contain;display:block}.book-hint{text-align:center;color:#aeb9c8;font-size:12px;margin-top:16px}.book-nav{display:flex;justify-content:space-between;width:min(820px,96vw);margin-top:12px}.book-nav button{border:1px solid #ffffff18;background:#121b2b;color:#fff;border-radius:10px;padding:11px 16px;font-weight:800}.reading-normal{display:block}.reading-book{display:none}.book-mode .reading-normal{display:none}.book-mode .reading-book{display:grid}.book-mode .modebar{justify-content:center}.book-title{font-size:12px;color:#aeb9c8;text-align:center;margin-top:-8px;margin-bottom:12px}@media(min-width:701px){.top{height:158px}.mark{width:300px;height:132px}.fallback-title{font-size:34px;max-width:300px}.chapter{min-width:170px}.chapter small{font-size:12px;letter-spacing:2.4px}.chapter strong{font-size:25px}.chapter em{font-size:20px;max-width:260px}}@media(max-width:600px){.book{height:65vh}.book-wrap{padding-top:20px}.face img,.left-page img,.right-page img{object-fit:contain}}</style></head><body><header class="top"><a class="back" href="index.html" aria-label="Voltar">‹</a><div class="mark" id="mark"></div><div class="chapter"><small>LENDO AGORA</small><strong id="chapter">Capítulo 001</strong><em id="chapterTitle">O começo</em></div></header><main><section class="reading-normal" id="normal"><div class="modebar" style="justify-content:center"><button class="mode-btn active" id="normalBtn">📄 Página</button><button class="mode-btn" id="bookBtn">📖 Livro 3D</button></div><div class="pages" id="pages"></div></section><section class="reading-book" id="bookMode"><div class="book-wrap"><div><div class="book-title">Livro 3D · toque no lado direito para avançar e no esquerdo para voltar</div><div class="book" id="book"><div class="left-page"><img id="leftImg" alt="Página esquerda"></div><div class="right-page"><img id="rightImg" alt="Página direita"></div><div class="sheet" id="sheet"><div class="face"><img id="frontImg" alt="Página atual"></div><div class="face back"><img id="backImg" alt="Próxima página"></div></div></div><div class="book-nav"><button id="prevBook">← Anterior</button><button id="nextBook">Próxima →</button></div><div class="book-hint" id="bookCounter">Página 1 de 1</div></div></div></section></main><section class="end"><div class="card"><h2>Fim do capítulo</h2><div class="actions"><button class="action" id="like">♥ Curtir</button><button class="action" id="save">🔖 Salvar</button><button class="action" id="share">↗ Compartilhar</button></div></div></section><nav class="controls"><button onclick="scrollTo({top:0,behavior:'smooth'})">↑</button><button id="counter">1 / 1</button><button onclick="scrollBy({top:innerHeight*.85,behavior:'smooth'})">↓</button><button class="primary" onclick="location.href='index.html'">⌂</button></nav><script>(()=>{const $=id=>document.getElementById(id),q=new URLSearchParams(location.search);let data=null;try{data=JSON.parse(localStorage.getItem('linkstory_published_manga')||localStorage.getItem('linkstory_test_manga')||'null')}catch{}const title=q.get('manga')||data?.title||'Tuketon',record=data&&(!q.get('manga')||data.title===q.get('manga'))?data:null,author=q.get('author')||record?.author||'Tayan Kingslay',chapter=q.get('chapter')||record?.chapterNumber||'001',chapterTitle=q.get('chapterTitle')||record?.chapterTitle||'O começo';document.title=title+' — '+chapterTitle+' — LinkStory';$('chapter').textContent='Capítulo '+chapter;$('chapterTitle').textContent=chapterTitle;const mark=$('mark');if(record?.logoEnabled!==false&&record?.logo){const img=document.createElement('img');img.src=record.logo;img.alt='Logo de '+title;mark.replaceChildren(img)}else{const span=document.createElement('span');span.className='fallback-title';span.textContent=title;mark.replaceChildren(span)}const source=record?.pages||[],list=$('pages');if(source.length){source.forEach((src,i)=>{const img=document.createElement('img');img.className='page';img.src=src;img.alt='Página '+(i+1);list.appendChild(img)});$('counter').textContent='1 / '+source.length}else{const empty=document.createElement('div');empty.className='page placeholder';empty.textContent='Nenhuma página publicada neste capítulo.';list.appendChild(empty)}let index=0;function showBook(){const n=source.length||1,left=Math.max(0,index-1),right=Math.min(n-1,index),next=Math.min(n-1,index+1);$('leftImg').src=source[left]||'';$('rightImg').src=source[right]||'';$('frontImg').src=source[index]||'';$('backImg').src=source[next]||'';$('bookCounter').textContent='Página '+(index+1)+' de '+n;$('counter').textContent=(index+1)+' / '+n;$('prevBook').disabled=index<=0;$('nextBook').disabled=index>=n-1}function next(){if(index>=source.length-1)return;index++;$('sheet').classList.remove('flipped');void $('sheet').offsetWidth;$('sheet').classList.add('flipped');setTimeout(showBook,350)}function prev(){if(index<=0)return;index--;showBook();$('sheet').classList.remove('flipped')}function mode(book){document.body.classList.toggle('book-mode',book);if(book)showBook()}$('normalBtn').onclick=()=>{mode(false);$('normalBtn').classList.add('active');$('bookBtn').classList.remove('active')};$('bookBtn').onclick=()=>{mode(true);$('bookBtn').classList.add('active');$('normalBtn').classList.remove('active')};$('nextBook').onclick=next;$('prevBook').onclick=prev;$('book').addEventListener('click',e=>{const r=$('book').getBoundingClientRect();(e.clientX-r.left>r.width/2?next:prev)()});let sx=0;$('book').addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});$('book').addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>45)(dx<0?next:prev)()},{passive:true});$('like').onclick=e=>e.currentTarget.classList.toggle('active');$('save').onclick=e=>e.currentTarget.classList.toggle('active');$('share').onclick=async()=>{try{await navigator.share({title:title+' — '+chapterTitle,url:location.href})}catch{try{await navigator.clipboard.writeText(location.href)}catch{}}};try{localStorage.setItem('linkstory-last-reading-v1',JSON.stringify({title,author,chapter,chapterTitle,url:location.href,updatedAt:Date.now()}))}catch{}})();</script></body></html>
