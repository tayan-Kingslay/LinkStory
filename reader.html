<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LinkStory Reader</title><style>:root{--b:#1976d2;--r:#0b1220;--m:#8e9aaa}*{box-sizing:border-box}body{margin:0;background:var(--r);color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.top{height:108px;display:grid;grid-template-columns:46px 1fr 46px;align-items:center;padding:0 12px;background:#0b1220f5;border-bottom:1px solid #ffffff12;position:sticky;top:0;z-index:20}.back,.menu{width:42px;height:42px;border:1px solid #ffffff18;border-radius:50%;display:grid;place-items:center;color:#fff;text-decoration:none;font-size:28px;background:transparent}.menu{font-size:0}.menu:before{content:'☰';font-size:21px}.reader-title{text-align:center;min-width:0;padding:0 35px;line-height:1}.reader-title small{display:block;color:var(--m);font-size:9px;letter-spacing:2px;line-height:1.1}.reader-title strong{display:block;font-size:22px;line-height:1.15;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.reader-title em{display:block;color:#b9c4d2;font-style:normal;font-size:14px;line-height:1.15;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chapter-no{position:absolute;right:64px;top:27px;color:#b9c4d2;font-size:12px;font-weight:800}.pages{width:min(900px,100%);margin:auto}.reader-page{display:block;width:100%;max-width:100%;height:auto;object-fit:contain;background:#fff;margin:0 auto 8px;border:0;border-radius:0;position:static}.empty{min-height:70vh;display:grid;place-items:center;color:#8995a5}.end{width:min(900px,100%);margin:auto;padding:20px 14px 90px}.panel{background:#121b2b;border:1px solid #ffffff10;border-radius:16px;padding:18px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.btn{border:1px solid #ffffff16;background:#ffffff08;color:#fff;border-radius:10px;padding:10px 14px;font-weight:800}.btn.active,.primary{background:var(--b);border-colo </head><body><header class="top"><a class="back" id="back" aria-label="Voltar">‹</a><div class="reader-title"><small>LENDO AGORA</small><strong id="mark">Mangá</strong><em id="chapterTitle"></em></div><div class="reader-right"><a class="experience-mode-link" id="experienceMode" href="#" aria-label="Abrir Modo Experiência">Experiência</a><div class="chapter-no" id="chapter">001</div><button class="menu" aria-label="Menu"></button></div></header><main><div class="pages" id="pages"><div class="empty">Carregando páginas…</div></div></main><section class="end"><div class="panel"><strong>Gostou deste capítulo?</strong><div class="actions"><button class="btn" id="like">♥ Curtir</button><button class="btn" id="save">🔖 Salvar</button><a class="btn" id="editPanels" href="#" hidden>Organizar quadrinhos</a></div><div class="stars" id="stars"></div><div class="comment"><input id="commentText" maxlength="1000" placeholder="Comente sobre o mangá"><button id="commentBtn">Comentar</button></div><div class="comments" id="comments"></div></div></section><nav class="controls"><button onclick="scrollTo({top:0,behavior:'smooth'})">↑</button><button id="counter">1 / 1</button><button onclick="scrollBy({top:innerHeight*.85,behavior:'smooth'})">↓</button><button class="primary" id="home">⌂</button></nav><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js"></script><script src="guard.js"></script><script src="verification.js?v=1"></script><script src="manga-db.js?v=20261110-2"></script><script>(async()=>{const $=id=>document.getElementById(id),q=new URLSearchParams(location.search);try{const m=await LinkStoryManga.mangaById(q.get('manga_id'));if(!m)throw Error('notfound');const cs=await LinkStoryManga.chapters(m.id),requestedNumber=q.get('chapter_number'),requestedId=q.get('chapter_id');let ch=requestedId?await LinkStoryManga.chapterWithPages(requestedId):null;if(requestedNumber&&(!ch||String(ch.chapter_number)!==String(requestedNumber))) {const match=cs.find(x=>String(x.chapter_number)===String(requestedNumber));if(match)ch=await LinkStoryManga.chapterWithPages(match.id)}if(!ch)ch=await LinkStoryManga.chapterWithPages(cs[0]?.id);if(!ch||ch.manga_id!==m.id)throw Error('chapter');try{const editorSession=await LinkStoryManga.session();if(editorSession?.user?.id===m.creator_id){const editorLink=$('editPanels');editorLink.href='panel-editor.html?manga_id='+encodeURIComponent(m.id)+'&chapter_id='+encodeURIComponent(ch.id);editorLink.hidden=false}}catch(editorError){console.warn('Não foi possível verificar o acesso ao organizador.',editorError)}if(window.LinkStoryGuard){const reportArea=document.querySelector('.panel .actions');window.LinkStoryGuard.mountReportButton(reportArea,{target_type:'chapter',target_id:ch.id});}
$('back').href='manga.html?id='+m.id;$('home').onclick=()=>location.href='manga.html?id='+m.id;$('experienceMode').href='reader-experience.html?manga_id='+encodeURIComponent(m.id)+'&chapter_id='+encodeURIComponent(ch.id)+'&return_to=reader';$('chapter').textContent=String(ch.chapter_number).padStart(3,'0');$('chapterTitle').textContent=ch.title||'';$('mark').textContent=m.title||'Mangá';const box=$('pages');box.innerHTML='';if(!ch.pages.length)box.innerHTML='<div class="empty">Este capítulo ainda não possui páginas.</div>';ch.pages.forEach((p,i)=>{const img=document.createElement('img');img.className='reader-page';img.src=p.image_url;img.alt='Página '+(i+1);img.loading=i<2?'eager':'lazy';img.decoding='async';if(i<2)img.fetchPriority='high';img.onerror=()=>{img.alt='Não foi possível carregar a página '+(i+1);img.style.minHeight='180px';img.style.background='#eee';img.style.objectFit='contain';};box.append(img)});$('counter').textContent='1 / '+ch.pages.length;let count=(await LinkStoryManga.stats(m.id)).likes,liked=await LinkStoryManga.liked(m.id);$('like').textContent='♥ '+count+' Curtir'+(count===1?'':'s');$('like').classList.toggle('active',liked);$('like').onclick=async()=>{try{if(!await LinkStoryManga.session())return location.href='login.html';liked=await LinkStoryManga.toggleLike(m.id);count=Math.max(0,count+(liked?1:-1));$('like').textContent='♥ '+count+' Curtir'+(count===1?'':'s');$('like').classList.toggle('active',liked)}catch{}};let my=await LinkStoryManga.myRating(m.id);for(let n=1;n<=5;n++){const b=document.createElement('button');b.textContent='★';b.className=n<=my?'active':'';b.onclick=async()=>{try{if(!await LinkStoryManga.session())return location.href='login.html';await LinkStoryManga.rate(m.id,n);my=n;document.querySelectorAll('.stars button').forEach((x,i)=>x.classList.toggle('active',i<n))}catch{}};$('stars').append(b)}async function comments(){const arr=await LinkStoryManga.comments(m.id),box=$('comments');box.innerHTML='';arr.forEach(c=>{const d=document.createElement('div');d.className='c';const who=document.createElement('strong');who.textContent=c.profiles?.display_name||c.profiles?.username||'Usuário';if(window.LinkStoryVerification)LinkStoryVerification.decorate(who,c.profiles?.verification_type);const body=document.createElement('p');body.textContent=c.body||'';d.append(who,body);box.append(d);if(window.LinkStoryGuard&&c.id)window.LinkStoryGuard.mountReportButton(d,{target_type:'comment',target_id:c.id},'Denunciar comentário')});if(!arr.length)box.innerHTML='<small style="color:#8e9aaa">Ainda não há comentários.</small>'}comments();$('commentBtn').onclick=async()=>{const v=$('commentText').value.trim();if(!v)return;try{if(!await LinkStoryManga.session())return location.href='login.html';await LinkStoryManga.addComment(m.id,v);$('commentText').value='';comments()}catch{}};try{localStorage.setItem('linkstory-last-reading-v1',JSON.stringify({mangaId:m.id,chapterId:ch.id,updatedAt:Date.now()}))}catch{}
try{await LinkStoryManga.saveProgress(m.id,ch.id)}catch{}
try{const sv=await LinkStoryManga.saved(m.id);$('save').classList.toggle('active',sv);$('save').textContent=sv?'🔖 Salvo':'🔖 Salvar';$('save').onclick=async()=>{try{if(!await LinkStoryManga.session())return location.href='login.html';const on=await LinkStoryManga.toggleSaved(m.id);$('save').classList.toggle('active',on);$('save').textContent=on?'🔖 Salvo':'🔖 Salvar'}catch{}}}catch{}
}catch(e){console.error(e);$('pages').innerHTML='<div class="empty">Não foi possível carregar este capítulo.</div>'}})();</script></body></html>
