<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>Leitor — LinkStory</title>
<style>
:root{--blue:#1976d2;--muted:#8e9aaa;--reader:#0b1220;--reader2:#121b2b;--paper:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--reader);color:#fff;overflow-x:hidden}button,a{font:inherit;cursor:pointer}a{text-decoration:none;color:inherit}
.reader-top{height:72px;position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:11px;padding:0 16px;background:#0b1220f2;border-bottom:1px solid #ffffff12;backdrop-filter:blur(18px)}.back{width:40px;height:40px;border:1px solid #ffffff1a;border-radius:50%;background:#ffffff08;color:#fff;font-size:23px;display:grid;place-items:center}.work-mark{width:40px;height:40px;border-radius:9px;background:#ffffff10;border:1px solid #ffffff18;display:grid;place-items:center;overflow:hidden;color:#9db2c9;font-size:9px;font-weight:900}.work-mark img{width:100%;height:100%;object-fit:contain}.work-meta{min-width:0}.work-meta strong{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.work-meta span{display:block;font-size:10px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chapter{margin-left:auto;text-align:right;min-width:125px}.chapter small{display:block;font-size:8px;color:var(--muted);letter-spacing:1.4px;font-weight:850}.chapter strong{display:block;font-size:12px;margin-top:2px}.chapter em{display:block;font-style:normal;color:#b9c4d2;font-size:9px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pages{width:min(900px,100%);margin:0 auto;padding:0 12px 45px}.manga-page{background:var(--paper);margin:0 auto 14px;box-shadow:0 18px 55px #00000055;position:relative;overflow:hidden}.page-art{display:block;width:100%;aspect-ratio:3/4;background:linear-gradient(145deg,#dbeafe 0%,#ffffff 43%,#b9d9f8 100%);position:relative}.page-art:before{content:"";position:absolute;width:42%;height:62%;left:10%;bottom:7%;border-radius:52% 48% 42% 58%;background:linear-gradient(160deg,#fff,#c7def4);transform:rotate(-8deg);opacity:.9}.page-art:after{content:"";position:absolute;width:35%;height:72%;right:8%;top:8%;border-radius:45% 55% 52% 48%;background:linear-gradient(145deg,#8bb9e5,#eef7ff);transform:rotate(13deg);opacity:.82}.page-number{position:absolute;right:16px;bottom:12px;color:#7e8998;font-size:9px;letter-spacing:1px}
.chapter-end{width:min(900px,100%);margin:0 auto;padding:10px 16px 110px}.end-card{background:#121b2b;border:1px solid #ffffff10;border-radius:18px;padding:22px}.end-heading{display:flex;align-items:center;justify-content:space-between;gap:15px}.end-heading h2{font-size:18px;margin:0}.end-heading span{font-size:11px;color:var(--muted)}.actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}.action{border:1px solid #ffffff16;background:#ffffff08;color:#fff;border-radius:11px;padding:10px 13px;font-size:12px}.action.active{background:var(--blue);border-color:var(--blue)}.rating{margin-top:20px;padding-top:18px;border-top:1px solid #ffffff10}.rating-label{font-size:11px;color:var(--muted);margin-bottom:10px}.stars{display:flex;gap:5px}.star{width:32px;height:32px;border:1px solid #ffffff16;background:#ffffff08;border-radius:8px;color:#ffd45a}.comment-box{display:flex;gap:8px;margin-top:18px}.comment-box input{min-width:0;flex:1;background:#0b1220;border:1px solid #ffffff14;border-radius:10px;padding:11px 12px;color:#fff;outline:none}.comment-box button{border:0;border-radius:10px;padding:0 15px;background:var(--blue);color:#fff;font-weight:800}.comments{margin-top:18px}.comment{padding:12px 0;border-top:1px solid #ffffff0d}.comment b{font-size:11px}.comment p{margin:5px 0 0;font-size:11px;color:#b7c0cc}
.reader-controls{position:fixed;z-index:25;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:4px;padding:5px;border:1px solid #ffffff16;background:#121b2bf0;border-radius:15px;box-shadow:0 15px 40px #0008;backdrop-filter:blur(16px)}.reader-controls button{height:42px;min-width:42px;border:0;background:transparent;color:#fff;border-radius:11px;font-size:17px}.reader-controls button:hover{background:#ffffff12}.reader-controls .counter{padding:0 12px;font-size:11px;color:#b8c2ce}.reader-controls .primary{background:var(--blue)}
@media(max-width:600px){.reader-top{height:64px;padding:0 10px;gap:9px}.back{width:36px;height:36px}.work-mark{width:34px;height:34px}.work-meta strong{font-size:13px}.work-meta span{font-size:9px}.chapter{min-width:105px}.chapter strong{font-size:10px}.chapter em{font-size:8px}.pages{padding:0 0 30px}.manga-page{margin-bottom:8px}.chapter-end{padding:8px 12px 105px}.end-card{padding:17px}.reader-controls{bottom:10px}.reader-controls button{height:40px;min-width:40px}}
</style>
</head>
<body>
<header class="reader-top">
<a class="back" href="index.html" aria-label="Voltar">‹</a>
<div class="work-mark" id="workLogo">LOGO</div>
<div class="work-meta"><strong id="topTitle">Tuketon</strong><span id="topAuthor">Kairox Studio</span></div>
<div class="chapter"><small>LENDO AGORA</small><strong id="chapterName">Capítulo 1</strong><em id="chapterTitle">O começo</em></div>
</header>
<main class="pages" id="pages">
<article class="manga-page"><div class="page-art"></div><span class="page-number">01</span></article>
<article class="manga-page"><div class="page-art" style="background:linear-gradient(145deg,#fff1df 0%,#fff 45%,#f4c8b7 100%);filter:hue-rotate(15deg)"></div><span class="page-number">02</span></article>
</main>
<section class="chapter-end">
<div class="end-card"><div class="end-heading"><h2>Fim do capítulo</h2><span id="endChapter">Capítulo 1</span></div><div class="actions"><button class="action active" onclick="this.classList.toggle('active')">♥ 128</button><button class="action" onclick="document.querySelector('.comment-box input').focus()">💬 Comentar</button><button class="action">↗ Compartilhar</button><button class="action">🔖 Salvar</button></div><div class="rating"><div class="rating-label">Avalie este capítulo</div><div class="stars"><button class="star">★</button><button class="star">★</button><button class="star">★</button><button class="star">★</button><button class="star">★</button></div></div><div class="comments"><div class="comment-box"><input placeholder="Escreva um comentário..." aria-label="Comentário"><button>Enviar</button></div><div class="comment"><b>Leitor</b><p>Esse capítulo ficou muito bom!</p></div></div></div>
</section>
<nav class="reader-controls" aria-label="Controles do leitor"><button onclick="scrollTo({top:0,behavior:'smooth'})">↑</button><button class="counter" id="counter">1 / 2</button><button onclick="scrollBy({top:innerHeight*.85,behavior:'smooth'})">↓</button><button class="primary" onclick="location.href='index.html'">⌂</button></nav>
<script>
const params=new URLSearchParams(location.search),title=params.get('manga')||'Tuketon',author=params.get('author')||'Kairox Studio',chapter=params.get('chapter')||'1',chapterTitle=params.get('chapterTitle')||'O começo';document.querySelector('#topTitle').textContent=title;document.querySelector('#topAuthor').textContent=author;document.querySelector('#chapterName').textContent='Capítulo '+chapter;document.querySelector('#chapterTitle').textContent=chapterTitle;document.querySelector('#endChapter').textContent='Capítulo '+chapter;
const pages=[...document.querySelectorAll('.manga-page')],counter=document.querySelector('#counter');const update=()=>{let best=0,dist=Infinity;pages.forEach((p,i)=>{const d=Math.abs(p.getBoundingClientRect().top-78);if(d<dist){dist=d;best=i}});counter.textContent=(best+1)+' / '+pages.length};addEventListener('scroll',update,{passive:true});update();
</script>
</body>
</html>
