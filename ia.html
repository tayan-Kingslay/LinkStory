<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>LinkStory IA</title>
<meta name="description" content="Converse com o personagem do LinkStory.">
<link rel="icon" type="image/svg+xml" href="assets/linkstory-logo.svg">
<style>
:root{color-scheme:light;--black:#050505;--white:#fff;--line:#111}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#fff;color:#050505;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit}
.app{height:100dvh;min-height:100svh;display:flex;flex-direction:column;background:#fff}
.top{height:88px;flex:0 0 88px;background:#050505;color:#fff;display:flex;align-items:center;padding:calc(env(safe-area-inset-top) + 9px) 20px 10px;gap:13px}
.brand-mark{width:55px;height:55px;flex:0 0 55px;border-radius:50%;overflow:hidden;background:#fff;display:grid;place-items:center}
.brand-mark img{width:100%;height:100%;object-fit:cover}
.brand-copy{min-width:0;display:flex;flex-direction:column;gap:3px}
.brand-copy strong{font-size:24px;line-height:1;font-weight:800;letter-spacing:-.8px}
.brand-copy span{font-size:15px;font-weight:400;color:#e8e8e8}
.status{margin-left:auto;display:flex;align-items:center;gap:6px;color:#ddd;font-size:11px;white-space:nowrap}
.status:before{content:"";width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px #ffffff25}
.stage{position:relative;flex:1;min-height:0;overflow:hidden;background:#fff;display:flex;align-items:center;justify-content:center}
.character-wrap{position:relative;width:min(56vw,310px);height:min(68%,520px);display:flex;align-items:center;justify-content:center;transition:transform .25s ease}
.character{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;user-select:none;-webkit-user-drag:none}
.mouth{position:absolute;width:10px;height:3px;left:69%;top:22%;border-radius:50%;background:#050505;opacity:0;transform:scaleX(.35);transform-origin:center;pointer-events:none}
.character-wrap.is-speaking{animation:talkBob .72s ease-in-out infinite}
.character-wrap.is-speaking .mouth{opacity:1;animation:mouthTalk .22s ease-in-out infinite alternate}
.character-wrap.is-thinking{animation:thinkMove 1.6s ease-in-out infinite}
@keyframes talkBob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-3px) rotate(.6deg)}}
@keyframes mouthTalk{from{transform:scaleX(.45) scaleY(.7)}to{transform:scaleX(1.35) scaleY(2.2)}}
@keyframes thinkMove{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.user-live{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);width:min(88%,620px);padding:11px 17px;border:2px solid #050505;border-radius:24px;background:#fff;color:#050505;font-size:15px;line-height:1.35;text-align:center;box-shadow:0 4px 0 #00000008;max-height:86px;overflow:hidden;display:none}
.user-live.visible{display:block;animation:popIn .18s ease-out}
.stage-hint{position:absolute;top:17px;left:50%;transform:translateX(-50%);font-size:12px;color:#777;white-space:nowrap;opacity:0;transition:opacity .2s}
.stage-hint.visible{opacity:1}
@keyframes popIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
.bottom{min-height:92px;flex:0 0 auto;background:#050505;color:#fff;padding:11px 14px calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:9px}
.circle-btn{width:54px;height:54px;flex:0 0 54px;border:0;border-radius:50%;background:#fff;color:#050505;display:grid;place-items:center;cursor:pointer}
.circle-btn svg{width:26px;height:26px;display:block}
.composer{height:54px;min-width:0;flex:1;display:flex;align-items:center;gap:6px;border:2px solid #fff;border-radius:30px;padding:0 9px 0 17px;background:#050505}
#message{min-width:0;flex:1;height:42px;max-height:42px;resize:none;border:0;outline:0;background:transparent;color:#fff;font-size:15px;line-height:42px;padding:0;white-space:nowrap;overflow:hidden}
#message::placeholder{color:#dedede;opacity:1}
.mic{width:34px;height:38px;flex:0 0 34px;border:0;background:transparent;color:#fff;display:grid;place-items:center;cursor:pointer}
.mic svg{width:24px;height:24px}
.mic.active{color:#bdbdbd;animation:micPulse .8s infinite alternate}
@keyframes micPulse{to{opacity:.4}}
#send{width:54px;height:54px;flex:0 0 54px;border:0;border-radius:50%;background:#fff;color:#050505;display:grid;place-items:center;cursor:pointer}
#send svg{width:27px;height:27px}
#send:disabled{opacity:.45;cursor:wait}
.history-panel{position:fixed;z-index:10;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center}
.history-panel.open{display:flex}
.history-sheet{width:100%;max-width:760px;height:min(76dvh,720px);background:#fff;color:#050505;border-radius:24px 24px 0 0;display:flex;flex-direction:column;overflow:hidden;padding-bottom:env(safe-area-inset-bottom);animation:sheetIn .2s ease-out}
@keyframes sheetIn{from{transform:translateY(30px);opacity:.6}to{transform:translateY(0);opacity:1}}
.history-head{height:62px;flex:0 0 62px;display:flex;align-items:center;justify-content:space-between;padding:0 19px;border-bottom:1px solid #ddd}
.history-head strong{font-size:17px}
.close-history{width:36px;height:36px;border:1px solid #ddd;border-radius:50%;background:#fff;font-size:22px;line-height:1}
.history-list{flex:1;overflow:auto;padding:17px;display:flex;flex-direction:column;gap:13px}
.history-empty{margin:auto;text-align:center;color:#777;font-size:14px}
.history-item{border:1px solid #ddd;border-radius:15px;padding:12px 13px;display:flex;flex-direction:column;gap:8px}
.history-role{font-size:10px;font-weight:800;letter-spacing:1px;color:#666;text-transform:uppercase}
.history-text{font-size:14px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.copy-btn{align-self:flex-end;border:1px solid #bbb;border-radius:18px;background:#fff;padding:6px 11px;font-size:11px;color:#111}
@media(max-width:520px){.top{height:88px;flex-basis:88px;padding-left:18px;padding-right:17px}.brand-mark{width:55px;height:55px;flex-basis:55px}.brand-copy strong{font-size:23px}.brand-copy span{font-size:15px}.status{font-size:10px}.character-wrap{width:min(67vw,300px);height:min(66%,470px)}.user-live{font-size:14px;bottom:13px}.bottom{gap:8px;padding-left:13px;padding-right:13px}.circle-btn,#send{width:53px;height:53px;flex-basis:53px}.composer{height:53px;padding-left:14px;padding-right:7px}#message{font-size:14px}.history-sheet{height:78dvh}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
<header class="top">
<div class="brand-mark"><img src="assets/linkstory-logo.svg" alt="Logo LinkStory"></div>
<div class="brand-copy"><strong>Linkstory</strong><span>IA Online</span></div>
<div class="status" id="status">Online</div>
</header>
<main class="stage" id="stage">
<div class="stage-hint" id="hint" aria-live="polite"></div>
<div class="character-wrap" id="characterWrap">
<img class="character" src="data:image/jpeg;base64,__MASCOT_B64__" alt="Personagem original do LinkStory">
<span class="mouth" aria-hidden="true"></span>
</div>
<div class="user-live" id="liveMessage" aria-live="polite"></div>
</main>
<footer class="bottom">
<button class="circle-btn" id="historyButton" type="button" aria-label="Abrir histórico" title="Histórico">
<svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
</button>
<form class="composer" id="chatForm">
<textarea id="message" rows="1" maxlength="1200" placeholder="Escreva uma mensagem..." aria-label="Escreva uma mensagem"></textarea>
<button class="mic" id="mic" type="button" aria-label="Falar mensagem" title="Ditado por voz">
<svg viewBox="0 0 24 24" fill="none"><rect x="9" y="2.5" width="6" height="12" rx="3" stroke="currentColor" stroke-width="1.8"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3.5M9 21.5h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
</button>
</form>
<button id="send" type="submit" form="chatForm" aria-label="Enviar mensagem">
<svg viewBox="0 0 24 24" fill="none"><path d="M12 19V5m-7 7 7-7 7 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
</button>
</footer>
</div>
<div class="history-panel" id="historyPanel" role="dialog" aria-modal="true" aria-label="Histórico da conversa">
<section class="history-sheet">
<header class="history-head"><strong>Histórico da conversa</strong><button class="close-history" id="closeHistory" type="button" aria-label="Fechar">×</button></header>
<div class="history-list" id="historyList"><p class="history-empty">Suas conversas aparecerão aqui.</p></div>
</section>
</div>
<script>
(()=>{
"use strict";
const form=document.getElementById("chatForm"),input=document.getElementById("message"),send=document.getElementById("send"),mic=document.getElementById("mic");
const live=document.getElementById("liveMessage"),wrap=document.getElementById("characterWrap"),hint=document.getElementById("hint"),status=document.getElementById("status");
const historyPanel=document.getElementById("historyPanel"),historyList=document.getElementById("historyList");
let history=[],busy=false,recognition=null;
const STORE_KEY="linkstory-character-history-v1";
function loadHistory(){try{const saved=JSON.parse(localStorage.getItem(STORE_KEY)||"[]");if(Array.isArray(saved))history=saved.slice(-100)}catch(e){history=[]}}
function saveHistory(){try{localStorage.setItem(STORE_KEY,JSON.stringify(history.slice(-100)))}catch(e){setHint("Não foi possível guardar o histórico neste dispositivo.")}}
function setHint(text){hint.textContent=text||"";hint.classList.toggle("visible",!!text)}
function addHistory(role,content){history.push({role,content:String(content||""),time:Date.now()});saveHistory()}
function showLive(text){live.textContent=text;live.classList.add("visible")}
function hideLive(){live.classList.remove("visible");live.textContent=""}
function speak(text){
return new Promise(resolve=>{
 if(!("speechSynthesis" in window)||!("SpeechSynthesisUtterance" in window)){resolve(false);return}
 window.speechSynthesis.cancel();
 const utterance=new SpeechSynthesisUtterance(text);utterance.lang="pt-BR";utterance.rate=1;utterance.pitch=1.05;
 utterance.onstart=()=>{wrap.classList.add("is-speaking");setHint("Respondendo…")};
 utterance.onend=()=>{wrap.classList.remove("is-speaking");setHint("");resolve(true)};
 utterance.onerror=()=>{wrap.classList.remove("is-speaking");setHint("");resolve(false)};
 window.speechSynthesis.speak(utterance);
});
}
function renderHistory(){
 historyList.replaceChildren();
 if(!history.length){const empty=document.createElement("p");empty.className="history-empty";empty.textContent="Suas conversas aparecerão aqui.";historyList.append(empty);return}
 history.forEach(item=>{
  const card=document.createElement("article");card.className="history-item";
  const role=document.createElement("span");role.className="history-role";role.textContent=item.role==="user"?"Você":"LinkStory IA";
  const content=document.createElement("div");content.className="history-text";content.textContent=item.content;
  const copy=document.createElement("button");copy.className="copy-btn";copy.type="button";copy.textContent="Copiar mensagem";
  copy.addEventListener("click",async()=>{try{await navigator.clipboard.writeText(item.content);copy.textContent="Copiado!"}catch(e){copy.textContent="Não foi possível copiar"}});
  card.append(role,content,copy);historyList.append(card);
 });
 historyList.scrollTop=historyList.scrollHeight;
}
async function ask(value){
 const question=String(value||"").trim();if(!question||busy)return;
 busy=true;send.disabled=true;mic.disabled=true;input.value="";showLive(question);setHint("Pensando…");wrap.classList.add("is-thinking");
 try{
  const response=await fetch("/api/site-assistant",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:question,history:history.slice(-12).map(item=>({role:item.role,content:item.content}))})});
  const data=await response.json().catch(()=>({}));
  if(!response.ok||!data.answer)throw new Error(data.error||"Não consegui responder agora. Tente novamente.");
  const answer=String(data.answer).trim();
  wrap.classList.remove("is-thinking");
  await speak(answer);
  addHistory("user",question);addHistory("assistant",answer);
  hideLive();
  if(!("speechSynthesis" in window))setHint("Resposta salva no histórico. Áudio não disponível neste navegador.");
  else setHint("");
 }catch(error){
  wrap.classList.remove("is-thinking");hideLive();setHint(error.message||"Ocorreu um erro. Tente novamente.");
  addHistory("user",question);
 }finally{
  busy=false;send.disabled=false;mic.disabled=false;input.focus();
 }
}
form.addEventListener("submit",event=>{event.preventDefault();ask(input.value)});
input.addEventListener("keydown",event=>{if(event.key==="Enter"&&!event.shiftKey){event.preventDefault();form.requestSubmit()}});
document.getElementById("historyButton").addEventListener("click",()=>{renderHistory();historyPanel.classList.add("open")});
document.getElementById("closeHistory").addEventListener("click",()=>historyPanel.classList.remove("open"));
historyPanel.addEventListener("click",event=>{if(event.target===historyPanel)historyPanel.classList.remove("open")});
if("webkitSpeechRecognition" in window||"SpeechRecognition" in window){
 const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;recognition=new SpeechRecognition();recognition.lang="pt-BR";recognition.interimResults=false;
 recognition.onstart=()=>mic.classList.add("active");recognition.onend=()=>mic.classList.remove("active");
 recognition.onresult=event=>{input.value=event.results[0][0].transcript;input.focus()};
 recognition.onerror=()=>setHint("Não consegui ouvir. Você pode digitar sua mensagem.");
 mic.addEventListener("click",()=>{try{recognition.start()}catch(e){recognition.stop()}});
}else{mic.addEventListener("click",()=>setHint("O ditado por voz não é compatível com este navegador."))}
loadHistory();
})();
</script>
</body>
</html>
