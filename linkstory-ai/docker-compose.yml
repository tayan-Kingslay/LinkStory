services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 10

  ollama-init:
    image: ollama/ollama:latest
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ollama_models:/root/.ollama
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: "ollama pull llama3.1:8b && ollama pull nomic-embed-text"

  prepare-audio:
    build: .
    restart: "no"
    env_file:
      - .env
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      LINKSTORY_CHAT_DB: /data/conversations.sqlite3
      LINKSTORY_CHROMA_DIR: /data/chroma
      HF_HOME: /data/models/hf
      LINKSTORY_TTS_CACHE: /data/models/tts
      LINKSTORY_MODELS_READY_FILE: /data/models/.ready
    volumes:
      - linkstory_ai_data:/data
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    command: ["python", "prepare_models.py"]

  index-knowledge:
    build: .
    restart: "no"
    env_file:
      - .env
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      LINKSTORY_CHAT_DB: /data/conversations.sqlite3
      LINKSTORY_CHROMA_DIR: /data/chroma
      HF_HOME: /data/models/hf
      LINKSTORY_TTS_CACHE: /data/models/tts
      LINKSTORY_MODELS_READY_FILE: /data/models/.ready
    volumes:
      - linkstory_ai_data:/data
      - ../:/source:ro
    depends_on:
      prepare-audio:
        condition: service_completed_successfully
    command: ["python", "ingest.py", "/source"]

  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      LINKSTORY_CHAT_DB: /data/conversations.sqlite3
      LINKSTORY_CHROMA_DIR: /data/chroma
      HF_HOME: /data/models/hf
      LINKSTORY_TTS_CACHE: /data/models/tts
      LINKSTORY_MODELS_READY_FILE: /data/models/.ready
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - linkstory_ai_data:/data
    depends_on:
      index-knowledge:
        condition: service_completed_successfully
      ollama:
        condition: service_healthy

volumes:
  ollama_models:
  linkstory_ai_data:
