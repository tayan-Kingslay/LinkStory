services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      LINKSTORY_CHAT_DB: /data/conversations.sqlite3
      LINKSTORY_CHROMA_DIR: /data/chroma
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - linkstory_ai_data:/data
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  ollama_models:
  linkstory_ai_data:
