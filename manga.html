<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mangá — LinkStory</title><style>:root{--b:#0b72e7;--i:#102033;--m:#66788d;--l:#dbe5ef}*{box-sizing:border-box}body{margin:0;color:var(--i);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{text-decoration:none;color:inherit}.top{height:68px;border-bottom:1px solid var(--l);display:flex;align-items:center;padding:0 16px;gap:14px;position:sticky;top:0;background:#fffffff5;z-index:5}.back,.menu{width:42px;height:42px;border:1px solid var(--l);border-radius:50%;background:#fff;display:grid;place-items:center}.back{font-size:25px}.brand{font-size:24px;font-weight:950}.brand b{color:var(--b)}.menu{margin-left:auto;font-size:0}.menu:before{content:'☰';font-size:18px}main{width:min(1060px,calc(100% - 32px));margin:auto;padding:38px 0 80px}.head{display:grid;grid-template-columns:300px 1fr;gap:42px}.cover{aspect-ratio:3/4;border:1px solid var(--l);border-radius:18px;background:#eaf4ff center/cover no-repeat;display:grid;place-items:center;font-weight:950;color:#1b4f7e;overflow:hidden}.ey{font-size:11px;font-weight:900;letter-spacing:2.5px;color:var(--b)}h1{font-size:clamp(42px,6vw,70px);letter-spacing:-4px;line-height:.95;margin:9px 0}.author{color:var(--m);margin-bottom:20px}.desc{max-width:680px;color:#42566d;line-height:1.7}.actions{display:flex;gap:9px;flex-wrap:wrap;margin:24px 0}.btn{border:1px solid var(--l);background:#fff;border-radius:10px;padding:12px 16px;font-weight:900}.primary{background:var(--b);color:#fff;border-color:var(--b)}.stats{display:flex;gap:30px;border-block:1px solid var(--l);padding:18px 0;margin-top:34px}.stat strong{display:block;font-size:18px}.stat span{font-size:11px;color:var(--m)}section.block{margin-top:40px}.block h2{font-size:25px;margin:6px 0 14px}.chapter{display:flex;align-items:center;gap:14px;padding:15px 4px;border-block:1px solid var(--l)}.chapter-num{width:44px;height:44px;border-radius:10px;background:#eaf4ff;color:var(--b);display:grid;place-items:center;font-weight:950}.chapter-info{flex:1}.chapter-info strong{display:block}.chapter-info small{color:var(--m)}.chev{font-size:25px;color:#7890a7}.social{border:1px solid var(--l);border-radius:15px;padding:18px;margin-top:18px}.social button{border:1px solid var(--l);background:#fff;border-radius:10px;padding:10px 14px;font-weight:800}.social button.active{background:var(--b);color:#fff}.stars button{border:0;background:none;font-size:25px;padding:3px;cursor:pointer;color:#9aa9b8}.stars button.active{color:#f2b01e}.comment{display:flex;gap:8px;margin-top:12px}.comment input{flex:1;border:1px solid var(--l);border-radius:10px;padding:11px}.comment button{background:var(--b);color:#fff;border:0;border-radius:10px;padding:0 15px;font-weight:800}.comments{margin-top:14px}.one-comment{padding:12px 0;border-top:1px solid var(--l)}.one-comment strong{font-size:12px}.one-comment p{margin:5px 0;color:#42566d;font-size:13px}.empty{padding:45px 0;text-align:center;color:var(--m)}@media(max-width:720px){main{width:calc(100% - 24px);padding-top:28px}.head{grid-template-columns:1fr;gap:24px}.cover{max-width:280px;width:100%;margin:auto}.stats{justify-content:space-between;gap:12px}.actions a{flex:1;text-align:center}.comment{display:grid;grid-template-columns:1fr}.comment button{height:44px}.top{padding:0 12px}}</style></head><body><header class="top"><a class="back" href="explore.html">‹</a><a class="brand" href="index.html">Link<b>Story</b></a><button class="menu" aria-label="Menu"></button></header><main id="main"><div class="empty">Carregando mangá…</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js"></script><script src="manga-db.js"></script><script>(async()=>{const $=id=>document.getElementById(id),q=new URLSearchParams(location.search);try{const m=await LinkStoryManga.mangaById(q.get('id')||q.get('manga_id'))||await LinkStoryManga.mangaByTitle(q.get('manga')||'');if(!m)throw Error('notfound');const cs=await LinkStoryManga.chapters(m.id),st=await LinkStoryManga.stats(m.id),me=await LinkStoryManga.session(),mine=me?.user?.id===m.creator_id;document.title=m.title+' — LinkStory';$('main').innerHTML=`<section class="head"><div class="cover" id="cover">${m.cover_url?'':'<span>'+m.title+'</span>'}</div><div><span class="ey">MANGÁ · LINKSTORY</span><h1>${m.title}</h1><div class="author">por ${m.profiles?.display_name||m.profiles?.username||'Criador'}</div><p class="desc">${m.description||'Sem descrição.'}</p><div class="actions"><a class="btn primary" href="reader.html?manga_id=${m.id}&chapter_id=${cs[0]?.id||''}">Começar a ler</a>${mine?`<a class="btn" href="publish.html?manga_id=${m.id}">＋ Adicionar próximo capítulo</a>`:''}</div></div></section><section class="stats"><div class="stat"><strong>${cs.length}</strong><span>Capítulo${cs.length===1?'':'s'}</span></div><div class="stat"><strong>${m.age_rating||'Livre'}</strong><span>Classificação</span></div><div class="stat"><strong>${st.likes}</strong><span>Likes</span></div><div class="stat"><strong>${st.average?st.average.toFixed(1):'—'}</strong><span>Avaliação</span></div></section><section class="block"><span class="ey">LEITURA</span><h2>Capítulos</h2><div id="chapters"></div></section><section class="social"><strong>O que achou?</strong><div class="actions"><button id="like">♥ ${st.likes} Curtidas</button></div><div class="stars" id="stars"></div><div class="comment"><input id="commentText" maxlength="1000" placeholder="Escreva um comentário"><button id="commentBtn">Comentar</button></div><div class="comments" id="comments"></div></section></section>`;if(m.cover_url)$('cover').style.backgroundImage=`url("${m.cover_url}")`;const cl=$('chapters');cs.forEach(c=>{const a=document.createElement('a');a.className='chapter';a.href=`reader.html?manga_id=${m.id}&chapter_id=${c.id}`;a.innerHTML=`<div class="chapter-num">${String(c.chapter_number).padStart(3,'0')}</div><div class="chapter-info"><strong>${c.title}</strong><small>Capítulo ${String(c.chapter_number).padStart(3,'0')}</small></div><span class="chev">›</span>`;cl.append(a)});const liked=await LinkStoryManga.liked(m.id);$('like').classList.toggle('active',liked);$('like').onclick=async()=>{try{if(!await LinkStoryManga.session())return location.href='login.html';const on=await LinkStoryManga.toggleLike(m.id);$('like').classList.toggle('active',on);$('like').textContent='♥ '+(on?st.likes+1:Math.max(0,st.likes-1))+' Curtidas'}catch{}};let mineRate=await LinkStoryManga.myRating(m.id);for(let i=1;i<=5;i++){const b=document.createElement('button');b.textContent='★';b.className=i<=mineRate?'active':'';b.onclick=async()=>{try{if(!await LinkStoryManga.session())return location.href='login.html';await LinkStoryManga.rate(m.id,i);mineRate=i;document.querySelectorAll('.stars button').forEach((x,n)=>x.classList.toggle('active',n<i))}catch{}};$('stars').append(b)}async function loadComments(){const arr=await LinkStoryManga.comments(m.id),box=$('comments');box.innerHTML='';if(!arr.length){box.innerHTML='<div class="empty">Ainda não há comentários.</div>';return}arr.forEach(c=>{const d=document.createElement('div');d.className='one-comment';d.innerHTML=`<strong>${c.profiles?.display_name||c.profiles?.username||'Usuário'}</strong><p>${c.body}</p>`;box.append(d)})}$('commentBtn').onclick=async()=>{const v=$('commentText').value.trim();if(!v)return;try{if(!await LinkStoryManga.session())return location.href='login.html';await LinkStoryManga.addComment(m.id,v);$('commentText').value='';loadComments()}catch{}};loadComments()}catch(e){console.error(e);$('main').innerHTML='<div class="empty">Não foi possível carregar este mangá.</div>'}})();</script></body></html>
