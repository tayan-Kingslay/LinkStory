<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mangá — LinkStory</title>
<style>
:root{--blue:#0b72e7;--ink:#102033;--muted:#66788d;--line:#dbe5ef;--soft:#eaf4ff}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);background:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
a{text-decoration:none;color:inherit}
.top{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 16px;gap:14px;position:sticky;top:0;background:#fffffff5;z-index:5}
.back,.menu{width:42px;height:42px;border:1px solid var(--line);border-radius:50%;background:#fff;display:grid;place-items:center}
.back{font-size:25px}.brand{font-size:24px;font-weight:950}.brand b{color:var(--blue)}
.menu{margin-left:auto;font-size:0}.menu:before{content:"☰";font-size:18px}

main{width:min(900px,calc(100% - 28px));margin:auto;padding:34px 0 100px}
.manga-view{display:flex;flex-direction:column;align-items:center}
.cover-shell{width:min(340px,82vw);aspect-ratio:3/4;border:1px solid var(--line);border-radius:22px;overflow:hidden;background:var(--soft);box-shadow:0 14px 35px rgba(16,32,51,.10)}
.cover{width:100%;height:100%;background:center/contain no-repeat}
.actions{width:min(620px,100%);display:grid;gap:10px;margin:24px auto 0}
.actions.reading{grid-template-columns:1fr}
.actions.creator{grid-template-columns:1fr 1fr}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:14px;padding:13px 12px;min-height:52px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:900;font-size:14px}
.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.creator-label{margin-top:24px;font-size:10px;font-weight:900;letter-spacing:2px;color:var(--muted);text-align:center}

.stats{width:min(760px,100%);display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:30px auto 0;padding:16px 0;border-block:1px solid var(--line)}
.stat{text-align:center}.stat strong{display:block;font-size:20px}.stat span{font-size:11px;color:var(--muted)}

.block{width:min(760px,100%);margin:34px auto 0}
.ey{font-size:10px;font-weight:900;letter-spacing:2px;color:var(--blue)}
.block h2{font-size:24px;margin:6px 0 12px}
.chapter{display:flex;align-items:center;gap:14px;padding:13px 4px;border-block:1px solid var(--line)}
.chapter-num{width:42px;height:42px;border-radius:10px;background:var(--soft);color:var(--blue);display:grid;place-items:center;font-weight:950}
.chapter-info{flex:1}.chapter-info strong{display:block}.chapter-info small{color:var(--muted)}.chev{font-size:25px;color:#7890a7}

.social{width:min(760px,100%);border:1px solid var(--line);border-radius:15px;padding:18px;margin:28px auto 0}
.social button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;font-weight:800}
.social button.active{background:var(--blue);color:#fff}
.stars button{border:0;background:none;font-size:25px;padding:3px;cursor:pointer;color:#9aa9b8}
.stars button.active{color:#f2b01e}
.creator-profile{width:min(620px,100%);display:flex;align-items:center;gap:12px;margin:22px auto 0;padding:12px 14px;border:1px solid var(--line);border-radius:15px;background:#fff;color:var(--ink);text-decoration:none;box-shadow:0 5px 18px rgba(16,32,51,.04)}.creator-profile:focus-visible{outline:2px solid #65a9ff;outline-offset:3px}.creator-avatar{width:46px;height:46px;flex:0 0 46px;display:grid;place-items:center;overflow:hidden;border-radius:50%;background:var(--soft);color:var(--blue);font-weight:900}.creator-avatar img{width:100%;height:100%;object-fit:cover}.creator-copy{min-width:0;flex:1}.creator-copy strong{display:flex;align-items:center;gap:4px;flex-wrap:wrap;font-size:14px}.creator-copy small{display:block;margin-top:3px;color:var(--muted);font-size:11px}.creator-arrow{color:var(--blue);font-size:12px;font-weight:850;white-space:nowrap}.manga-comment-author{display:inline-flex;align-items:center;gap:4px;color:inherit;text-decoration:none;font-weight:850}.manga-comment-author:focus-visible{outline:2px solid #65a9ff;outline-offset:3px;border-radius:4px}.comment{display:flex;gap:8px;margin-top:12px}
.comment input{flex:1;border:1px solid var(--line);border-radius:10px;padding:11px}
.comment button{background:var(--blue);color:#fff;border:0;border-radius:10px;padding:0 15px;font-weight:800}
.comments{margin-top:14px}.one-comment{padding:12px 0;border-top:1px solid var(--line)}
.one-comment strong{font-size:12px}.one-comment p{margin:5px 0;color:#42566d;font-size:13px}
.empty{padding:45px 0;text-align:center;color:var(--muted)}

@media(max-width:600px){
 .top{padding:0 12px}
 main{padding-top:24px}
 .cover-shell{width:min(300px,82vw);border-radius:20px}
 .actions.creator{grid-template-columns:1fr}
 .stats{gap:4px}.stat strong{font-size:18px}.stat span{font-size:10px}
 .social{padding:15px}
 .comment{display:grid}.comment button{height:42px}
}
/* LinkStory mobile-first visual system */
:root{--ls-blue:#0b72e7;--ls-deep:#07111f;--ls-ink:#101a28;--ls-muted:#77869a;--ls-line:#e7ebf0;--ls-soft:#f5f7fa}
body{background:#f7f8fa!important;color:var(--ls-ink)!important;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif!important}
.top,.topbar{height:62px!important;padding:0 14px!important;background:rgba(255,255,255,.78)!important;border:1px solid rgba(220,227,235,.8)!important;backdrop-filter:blur(18px)!important;position:sticky!important;top:10px!important;margin:0 10px!important;width:calc(100% - 20px)!important;border-radius:15px!important;box-shadow:0 8px 28px rgba(16,32,51,.07)!important;z-index:20!important}
.back,.menu,.menu-btn{width:38px!important;height:38px!important;border-radius:11px!important;border:1px solid var(--ls-line)!important;background:#fff!important;color:var(--ls-ink)!important}
.brand,.logo{font-size:21px!important;letter-spacing:-1.3px!important}

.btn:hover,.publish:hover,.edit:hover{transform:translateY(-1px)}
.card,.form,.social,.empty,.work,.settings-menu,.theme-option{border-radius:16px!important;box-shadow:0 8px 26px rgba(16,32,51,.05)}
h1{font-size:42px!important;letter-spacing:-2.5px!important}
h2{letter-spacing:-.8px}
.ey,.eyebrow{letter-spacing:2.5px!important}
@media(max-width:600px){
  .top,.topbar{top:8px!important}
  .cover-shell{width:min(290px,78vw)!important}
  .stats{border:0!important;background:#fff;border-radius:16px;padding:6px!important;box-shadow:0 8px 26px rgba(16,32,51,.05)}
  .stat{padding:15px!important;border-bottom:1px solid var(--ls-line)!important}
  .stat:last-child{border-bottom:0!important}
  .section{margin-top:28px!important}
  .work{padding:10px!important}
  .actions{gap:8px!important}
  .actions .btn{min-height:44px}
  .layout{gap:10px!important}
  .settings-menu{box-shadow:none!important}
  .appearance-options{grid-template-columns:1fr 1fr!important}
  .theme-preview{height:112px!important}
  .menu-dialog{border-radius:0!important}
}
.credit-list{display:grid;gap:9px}.credit-person{display:flex;align-items:center;gap:11px;padding:11px 13px;background:#fff;border:1px solid var(--line);border-radius:13px}.credit-person img,.credit-avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;display:grid;place-items:center;background:var(--soft);color:var(--blue);font-weight:900;flex:none}.credit-person a{font-weight:850;font-size:13px}.credit-person small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.creator-follow{min-height:40px;padding:0 15px;border:1px solid #0b72e7;border-radius:11px;background:#0b72e7;color:#fff;font-weight:850;font-size:12px;cursor:pointer}.creator-follow.following{background:#fff;color:#0b72e7}.creator-follow:disabled{opacity:.6}.creator-follow-wrap{width:min(620px,100%);display:flex;justify-content:flex-end;margin:-12px auto 0}.credit-person{flex-wrap:wrap}.credit-person .creator-follow{margin-left:auto}</style>

<body>
<header class="top">
<a class="back" href="index.html" aria-label="Voltar">‹</a>
<a class="brand" href="index.html">Link<b>Story</b></a>
<button class="menu" aria-label="Menu"></button>
</header>

<main id="main"><div class="empty">Carregando mangá…</div></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
<script src="guard.js"></script>
<script src="verification.js?v=1"></script><script src="manga-db.js?v=20261110-1"></script>
<script>
(async()=>{
 const $=id=>document.getElementById(id),q=new URLSearchParams(location.search);
 try{
  const m=await LinkStoryManga.mangaById(q.get("id")||q.get("manga_id"))||await LinkStoryManga.mangaByTitle(q.get("manga")||"");
  if(!m)throw Error("notfound");
  const cs=await LinkStoryManga.chapters(m.id),st=await LinkStoryManga.stats(m.id),me=await LinkStoryManga.session();
  const mine=!!me?.user?.id&&me.user.id===m.creator_id;
  document.title=m.title+" — LinkStory";

  $("main").innerHTML=
  '<section class="manga-view">'+
    '<div class="cover-shell"><div class="cover" id="cover"></div></div>'+
    '<div class="actions reading">'+
      '<a class="btn primary" href="reader.html?manga_id='+m.id+'&chapter_id='+(cs[0]?.id||"")+'">Começar a ler</a>'+
    '</div>'+
    '<div class="creator-label">AUTOR PRINCIPAL</div>'+
    '<a class="creator-profile" href="public-profile.html?id='+encodeURIComponent(m.creator_id)+'" aria-label="Ver perfil de '+String(m.profiles?.display_name||m.profiles?.username||'criador').replace(/&/g,'&amp;').replace(/"/g,'&quot;')+'"><span class="creator-avatar">'+(m.profiles?.avatar_url?'<img src="'+String(m.profiles.avatar_url).replace(/"/g,'&quot;')+'" alt="">':String((m.profiles?.display_name||m.profiles?.username||'C').slice(0,1)).replace(/</g,'&lt;'))+'</span><span class="creator-copy"><strong>'+String(m.profiles?.display_name||m.profiles?.username||'Criador').replace(/&/g,'&amp;').replace(/</g,'&lt;')+(window.LinkStoryVerification?.html(m.profiles?.verification_type)||'')+'</strong><small>@'+String(m.profiles?.username||'criador').replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</small></span><span class="creator-arrow">Ver perfil ›</span></a>'+
    (mine?
      '<div class="creator-label">PAINEL DO CRIADOR</div>'+
      '<div class="actions creator">'+
        '<a class="btn" href="editar.html?id='+m.id+'">✎ Editar mangá</a>'+
        '<a class="btn" href="publish.html?manga_id='+m.id+'">＋ Próximo capítulo</a>'+
      '</div>':'')+
  '</section>'+
  '<section class="stats">'+
    '<div class="stat"><strong>'+cs.length+'</strong><span>Capítulo'+(cs.length===1?"":"s")+'</span></div>'+
    '<div class="stat"><strong>'+(m.age_rating||"Livre")+'</strong><span>Classificação</span></div>'+
    '<div class="stat"><strong>'+st.likes+'</strong><span>Likes</span></div>'+
    '<div class="stat"><strong>'+(st.average?st.average.toFixed(1):"—")+'</strong><span>Avaliação</span></div>'+
  '</section>'+
  '<section class="block"><span class="ey">LEITURA</span><h2>Capítulos</h2><div id="chapters"></div></section>'+
  '<section class="social"><strong>O que achou?</strong>'+
    '<div class="actions"><button id="like" type="button" aria-pressed="false"><svg class="like-heart" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 8.8c0 5.2-8.8 11-8.8 11s-8.8-5.8-8.8-11a4.7 4.7 0 0 1 8.8-2.1 4.7 4.7 0 0 1 8.8 2.1Z"/></svg><span class="like-count">'+st.likes+'</span><span>Curtidas</span></button></div>'+
    '<div class="stars" id="stars"></div>'+
    '<div class="comment"><input id="commentText" maxlength="1000" placeholder="Escreva um comentário"><button id="commentBtn">Comentar</button></div>'+
    '<div class="comments" id="comments"></div>'+
  '</section>';

  async function mountFollowButton(targetId,anchor){
   if(!targetId||!anchor)return;
   if(me?.user?.id===targetId)return;
   const button=document.createElement('button');button.type='button';button.className='creator-follow';button.textContent='Seguir';
   if(!me?.user?.id){button.textContent='Entrar para seguir';button.onclick=()=>location.href='login.html';}
   else{
    const viewer=me.user.id,existing=await linkstorySupabase.from('follows').select('follower_id').eq('follower_id',viewer).eq('following_id',targetId).maybeSingle();
    if(existing.error){button.textContent='Indisponível';button.disabled=true}
    else{
     let following=!!existing.data;
     const paint=()=>{button.textContent=following?'Seguindo':'Seguir';button.classList.toggle('following',following);button.setAttribute('aria-pressed',String(following))};paint();
     button.onclick=async()=>{button.disabled=true;try{if(following){const r=await linkstorySupabase.from('follows').delete().eq('follower_id',viewer).eq('following_id',targetId);if(r.error)throw r.error;following=false}else{const r=await linkstorySupabase.from('follows').insert({follower_id:viewer,following_id:targetId});if(r.error)throw r.error;following=true}paint()}catch(error){alert(error.message||'Não foi possível atualizar o acompanhamento.')}finally{button.disabled=false}};
    }
   }
   anchor.insertAdjacentElement('afterend',button);
  }
  const creatorAnchor=document.querySelector('.creator-profile');
  if(creatorAnchor)await mountFollowButton(m.creator_id,creatorAnchor);
  const credits=await LinkStoryManga.collaboratorsForManga(m.id);if(credits.length){const section=document.createElement('section');section.className='block';const eyebrow=document.createElement('span');eyebrow.className='ey';eyebrow.textContent='PRODUÇÃO';const heading=document.createElement('h2');heading.textContent='Colaboradores';const list=document.createElement('div');list.className='credit-list';credits.forEach(async person=>{const row=document.createElement('div');row.className='credit-person';const avatar=person.profiles?.avatar_url?document.createElement('img'):document.createElement('div');if(person.profiles?.avatar_url){avatar.src=person.profiles.avatar_url;avatar.alt=''}else{avatar.className='credit-avatar';avatar.textContent=(person.profiles?.display_name||person.profiles?.username||'U').slice(0,1).toUpperCase()}const copy=document.createElement('div'),link=document.createElement('a'),role=document.createElement('small');link.href='public-profile.html?id='+encodeURIComponent(person.user_id);link.textContent=person.profiles?.display_name||person.profiles?.username||'Colaborador';role.textContent=person.role;copy.append(link,role);row.append(avatar,copy);await mountFollowButton(person.user_id,row.querySelector("a"));list.append(row)});section.append(eyebrow,heading,list);document.querySelector('.stats').before(section)}
  if(window.LinkStoryGuard){const reportArea=document.querySelector('.social');window.LinkStoryGuard.mountReportButton(reportArea,{target_type:'manga',target_id:m.id});window.LinkStoryGuard.mountBlockButton(reportArea,m.creator_id,'Bloquear criador');}

  if(m.cover_url)$("cover").style.backgroundImage='url("'+m.cover_url.replace(/"/g,'&quot;')+'")';

  const cl=$("chapters");
  cs.forEach(c=>{
   const a=document.createElement("a");
   a.className="chapter";
   a.href="reader.html?manga_id="+encodeURIComponent(m.id)+"&chapter_id="+encodeURIComponent(c.id)+"&chapter_number="+encodeURIComponent(c.chapter_number);
   a.innerHTML='<div class="chapter-num">'+String(c.chapter_number).padStart(3,"0")+'</div>'+
     '<div class="chapter-info"><strong>'+c.title+'</strong><small>Capítulo '+String(c.chapter_number).padStart(3,"0")+'</small></div>'+
     '<span class="chev">›</span>';
   cl.append(a);
  });

  let liked=await LinkStoryManga.liked(m.id);
  $("like").classList.toggle("active",liked);$("like").setAttribute("aria-pressed",String(liked));
  $("like").onclick=async()=>{
   try{
    if(!await LinkStoryManga.session())return location.href="login.html";
    const on=await LinkStoryManga.toggleLike(m.id);
    $("like").classList.toggle("active",on);$("like").setAttribute("aria-pressed",String(on));
    $("like").querySelector(".like-count").textContent=on?st.likes+1:Math.max(0,st.likes-1);
   }catch{}
  };

  let mineRate=await LinkStoryManga.myRating(m.id);
  for(let i=1;i<=5;i++){
   const b=document.createElement("button");b.textContent="★";b.className=i<=mineRate?"active":"";
   b.onclick=async()=>{
    try{
     if(!await LinkStoryManga.session())return location.href="login.html";
     await LinkStoryManga.rate(m.id,i);mineRate=i;
     document.querySelectorAll(".stars button").forEach((x,n)=>x.classList.toggle("active",n<i));
    }catch{}
   };
   $("stars").append(b);
  }

  async function loadComments(){
   const arr=await LinkStoryManga.comments(m.id),box=$("comments");box.innerHTML="";
   if(!arr.length){box.innerHTML='<div class="empty">Ainda não há comentários.</div>';return}
   arr.forEach(c=>{
    const d=document.createElement("div");d.className="one-comment";
    const who=document.createElement("a");who.className="manga-comment-author";who.href="public-profile.html?id="+encodeURIComponent(c.profiles?.id||c.author_id);const whoName=document.createElement("strong");whoName.textContent=c.profiles?.display_name||c.profiles?.username||"Usuário";who.append(whoName);if(window.LinkStoryVerification)LinkStoryVerification.decorate(who,c.profiles?.verification_type);const body=document.createElement("p");body.textContent=c.body||"";d.append(who,body);
    box.append(d);
    if(window.LinkStoryGuard&&c.id)window.LinkStoryGuard.mountReportButton(d,{target_type:'comment',target_id:c.id},'Denunciar comentário');
   });
  }

  $("commentBtn").onclick=async()=>{
   const v=$("commentText").value.trim();if(!v)return;
   try{
    if(!await LinkStoryManga.session())return location.href="login.html";
    await LinkStoryManga.addComment(m.id,v);$("commentText").value="";loadComments();
   }catch{}
  };
  loadComments();
 }catch(e){
  console.error(e);
  $("main").innerHTML='<div class="empty">Não foi possível carregar este mangá.</div>';
 }
})();
</script>
</body>
</html>
