<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>LinkStory — Mangás para ler e publicar</title>
<link rel="icon" type="image/svg+xml" href="assets/linkstory-logo.svg">
<style>
:root{--b:#0b72e7;--i:#102033;--m:#66788d;--l:#dbe5ef}
*{box-sizing:border-box}
html,body{width:100%;max-width:100%;overflow-x:hidden}body{margin:0;background:#fff;color:var(--i);font-family:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
a{text-decoration:none;color:inherit}
.header{height:68px;border-bottom:1px solid var(--l);display:flex;align-items:center;padding:0 max(16px,calc((100% - 1080px)/2));gap:12px;background:#fff;position:sticky;top:0;z-index:20}
.logo img{display:block;width:132px;height:44px;object-fit:contain}
.header-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.circle{width:40px;height:40px;border:1px solid var(--l);border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--i)}
.search{font-size:22px}.menu{font-size:0}.menu:before{content:'☰';font-size:21px}
.login{border:1px solid #cfe1f2;border-radius:11px;padding:9px 13px;color:var(--b);font-size:13px;font-weight:800}
main{width:100%!important;max-width:none!important;margin:0;padding:0 0 100px}
.home-hero{width:100%;height:auto;aspect-ratio:8 / 3;position:relative;overflow:hidden;background:#17283d}
.home-hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center center;display:block}


.catalog{margin-top:34px}
.shelf{margin:0 0 42px}
.shelf-head{display:flex;align-items:center;justify-content:space-between;padding:0 16px;margin-bottom:13px}
.shelf-title{font-size:29px;line-height:1;font-weight:800;letter-spacing:-1px;margin:0}
.shelf-link{font-size:12px;color:var(--b);font-weight:800}
.track{display:flex;gap:12px;overflow-x:auto;padding:0 16px 9px;scroll-snap-type:x proximity;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.book{position:relative;flex:0 0 184px;height:275px;border-radius:2px;overflow:hidden;background:#edf3f8;scroll-snap-align:start;box-shadow:0 7px 18px rgba(16,32,51,.12)}
.book img{display:block;width:100%;height:100%;object-fit:cover}
.book:after{content:"";position:absolute;inset:42% 0 0;background:linear-gradient(0deg,rgba(0,0,0,.86),transparent);pointer-events:none}
.book-info{position:absolute;z-index:2;left:11px;right:10px;bottom:11px;color:#fff}
.book-meta{display:block;font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.book-title{display:block;font-size:17px;font-weight:900;line-height:1.05;text-shadow:0 2px 7px rgba(0,0,0,.5)}
.rank{position:absolute;z-index:4;right:0;top:0;width:50px;height:50px;background:#ed302f;color:#fff;display:grid;place-items:center;font-size:24px;font-weight:900}
.age{position:absolute;z-index:4;left:9px;top:9px;background:#ed302f;color:#fff;border-radius:5px;padding:6px 7px;font-size:10px;font-weight:900}
.empty{margin:0 16px;border:1px dashed var(--l);border-radius:12px;padding:26px 16px;text-align:center;color:var(--m)}
.empty strong{display:block;color:var(--i);margin-bottom:4px}
.creator{width:min(1080px,calc(100% - 32px));margin:4px auto 0;background:var(--b);color:#fff;border-radius:16px;padding:24px;display:flex;justify-content:space-between;align-items:center;gap:20px}
.creator .ey{font-size:10px;letter-spacing:2px;font-weight:900;color:#d8edff}
.creator h2{font-size:25px;margin:4px 0}.creator p{margin:0;color:#e6f3ff;font-size:13px}
.creator a{background:#fff;color:var(--b);padding:10px 14px;border-radius:10px;font-size:12px;font-weight:900;white-space:nowrap}
.menu-dialog{width:min(100%,560px);height:100dvh;max-height:none;margin:0 0 0 auto;border:0;padding:0;background:#fff}
.menu-wrap{height:100%;padding:24px 20px}.menu-head{display:flex;justify-content:space-between;align-items:center;padding-bottom:20px;border-bottom:1px solid var(--l)}
.menu-head strong{color:var(--b);letter-spacing:3px}.close{border:0;background:none;font-size:36px}
.menu-list a{display:flex;justify-content:space-between;padding:19px 0;border-bottom:1px solid var(--l);font-size:17px;font-weight:700}
.menu-list strong{font-size:26px;color:#71879d;font-weight:400}
@media(max-width:720px){
 .header{height:62px;padding:0 12px}.logo img{width:124px;height:40px}.circle{width:38px;height:38px}.login{font-size:12px;padding:8px 11px}.header-actions{gap:6px}
 .home-hero{height:auto;aspect-ratio:8 / 3}
 .catalog{margin-top:30px}.shelf{margin-bottom:34px}.shelf-head{padding:0 12px}.shelf-title{font-size:27px}.track{padding-left:12px;padding-right:12px;gap:10px}
 .book{flex-basis:166px;height:252px}.book-title{font-size:16px}.rank{width:46px;height:46px;font-size:22px}
 .creator{display:block;padding:21px;margin-top:0}.creator a{display:inline-flex;margin-top:15px}
}
@media(max-width:420px){
 .login{display:none}.home-hero{height:auto;aspect-ratio:8 / 3}.book{flex-basis:154px;height:235px}.shelf-title{font-size:25px}
}
html[data-ls-theme="dark"] body{background:#0f1114!important;color:#f5f7fa!important}
html[data-ls-theme="dark"] .header{background:#111317!important;border-color:#30343a!important}
html[data-ls-theme="dark"] .circle{background:#181b20!important;color:#fff!important;border-color:#343941!important}
html[data-ls-theme="dark"] .login{border-color:#343941!important}
html[data-ls-theme="dark"] .empty{border-color:#30343a!important;color:#aab3be!important}
html[data-ls-theme="dark"] .empty strong{color:#fff!important}
html[data-ls-theme="dark"] .menu-dialog{background:#151515!important;color:#fff!important}
</style>
</head>
<body>
<header class="header">
<a class="logo" href="index.html" aria-label="LinkStory"><img src="assets/linkstory-logo.svg" alt="LinkStory"></a>
<div class="header-actions">
<button class="circle search" id="openSearch" aria-label="Buscar">⌕</button>
<button class="circle menu" id="openMenu" aria-label="Abrir menu"></button>
<a class="login" href="login.html">Entrar</a>
</div>
</header>
<main>
<section class="home-hero" id="feature">
<div class="empty" style="position:absolute;inset:0;margin:0;border:0;border-radius:0;display:grid;place-items:center;color:#fff;background:#17283d"><strong style="color:#fff">Ainda não há mangás publicados.</strong></div>
</section>
<div class="catalog">
<section class="shelf" id="popularShelf"><div class="shelf-head"><h2 class="shelf-title">Mais populares</h2></div><div class="track" id="popularTrack"></div></section>
<section class="shelf" id="recentShelf"><div class="shelf-head"><h2 class="shelf-title">Recém-publicados</h2></div><div class="track" id="recentTrack"></div></section>
<section class="shelf" id="allShelf"><div class="shelf-head"><h2 class="shelf-title">Mais histórias</h2></div><div class="track" id="allTrack"></div></section>
</div>
<section class="creator"><div><span class="ey">PARA CRIADORES</span><h2>Publique sua história no LinkStory.</h2><p>Crie sua obra, adicione capítulos e encontre leitores.</p></div><a href="publish.html">Publicar mangá →</a></section>
</main>
<dialog class="menu-dialog" id="menuDialog"><div class="menu-wrap"><div class="menu-head"><strong>LINKSTORY</strong><button class="close" id="closeMenu">×</button></div><nav class="menu-list"><a href="profile.html">Perfil <strong>›</strong></a><a href="studio.html">Meu Estúdio <strong>›</strong></a><a href="publish.html">Publicar mangá <strong>›</strong></a><a href="settings.html">Configurações <strong>›</strong></a><a href="login.html">Entrar <strong>›</strong></a></nav></div></dialog>
<dialog class="menu-dialog" id="searchDialog"><div class="menu-wrap"><div class="menu-head"><strong>BUSCAR</strong><button class="close" id="closeSearch">×</button></div><input id="searchInput" placeholder="Buscar mangá, autor ou gênero" style="width:100%;height:52px;border:1px solid #dbe5ef;border-radius:12px;padding:0 15px;font:inherit;margin-top:22px"><div id="searchResults" style="margin-top:15px"></div></div></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script><script src="manga-db.js"></script>
<script>
(async()=>{
const feature=document.getElementById('feature'),shelves=[document.getElementById('popularShelf'),document.getElementById('recentShelf'),document.getElementById('allShelf')],tracks=[document.getElementById('popularTrack'),document.getElementById('recentTrack'),document.getElementById('allTrack')];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
let mangas=[];try{mangas=await LinkStoryManga.publishedMangas()}catch(e){console.error(e)}
if(!mangas.length){shelves.forEach(s=>s.style.display='none')}
const stats=await Promise.all(mangas.map(async m=>{try{return{m,s:await LinkStoryManga.stats(m.id)}}catch{return{m,s:{likes:0,ratings:0,average:0}}}}));
const popular=stats.slice().sort((a,b)=>(b.s.likes||0)-(a.s.likes||0)||(b.s.ratings||0)-(a.s.ratings||0)).map(x=>x.m),recent=mangas.slice().reverse();
feature.innerHTML='<img src="assets/poster-teste.svg" alt="Pôster de teste do LinkStory">';
const makeBook=(m,rank)=>{const a=document.createElement('a');a.className='book';a.href='manga.html?id='+encodeURIComponent(m.id);const genre=Array.isArray(m.genres)?m.genres.join(' · '):String(m.genres||'Mangá');a.innerHTML=(rank?'<span class="rank">'+rank+'</span>':'')+'<span class="age">'+esc(m.age_rating||'Livre')+'</span>'+(m.cover_url?'<img src="'+esc(m.cover_url)+'" alt="'+esc(m.title)+'">':'')+'<span class="book-info"><span class="book-meta">'+esc(genre)+'</span><span class="book-title">'+esc(m.title)+'</span></span>';return a};
const render=(track,items,ranked)=>{track.innerHTML='';items.forEach((m,i)=>track.appendChild(makeBook(m,ranked&&i<3?i+1:0)))};
render(tracks[0],popular,true);render(tracks[1],recent,false);render(tracks[2],mangas,false);
const searchInput=document.getElementById('searchInput'),searchResults=document.getElementById('searchResults');
searchInput.addEventListener('input',()=>{const q=searchInput.value.trim().toLowerCase(),filtered=mangas.filter(m=>((m.title||'')+' '+(Array.isArray(m.genres)?m.genres.join(' '):(m.genres||''))).toLowerCase().includes(q)).slice(0,8);searchResults.innerHTML=filtered.map(m=>'<a href="manga.html?id='+encodeURIComponent(m.id)+'" style="display:block;padding:12px 0;border-bottom:1px solid #dbe5ef;font-weight:700">'+esc(m.title)+'</a>').join('')||(q?'Nenhum resultado.':'')});
})();
const menu=document.getElementById('menuDialog'),search=document.getElementById('searchDialog');
document.getElementById('openMenu').onclick=()=>menu.showModal();document.getElementById('closeMenu').onclick=()=>menu.close();document.getElementById('openSearch').onclick=()=>search.showModal();document.getElementById('closeSearch').onclick=()=>search.close();
</script>
</body>
</html>
