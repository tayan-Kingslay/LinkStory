<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b72e7"><title>Criar conta — LinkStory</title><style>:root{--blue:#0b72e7;--ink:#102033;--muted:#66788d;--line:#dbe5ef;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}*{box-sizing:border-box}body{margin:0;background:#fff}.top{height:72px;display:flex;align-items:center;gap:14px;padding:0 18px;border-bottom:1px solid var(--line)}.back{width:42px;height:42px;border:1px solid var(--line);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:25px;line-height:1}.logo{font-size:26px;font-weight:950;letter-spacing:-1.8px}.logo b{color:var(--blue)}main{min-height:calc(100vh - 72px);display:grid;place-items:center;padding:45px 18px}.box{width:min(430px,100%);text-align:center}.eyebrow{font-size:11px;font-weight:900;letter-spacing:2.5px;color:var(--blue)}h1{font-size:clamp(40px,7vw,56px);letter-spacing:-3px;margin:12px 0}.intro{color:var(--muted);font-size:14px;line-height:1.6}.form{text-align:left;border:1px solid var(--line);border-radius:18px;padding:24px;margin-top:28px;box-shadow:0 18px 45px #1020330f}label{display:block;font-size:12px;font-weight:900;margin:0 0 7px}input{width:100%;height:48px;border:1px solid var(--line);border-radius:10px;padding:0 13px;margin-bottom:16px;font:inherit;outline:none}.primary{width:100%;height:48px;border:0;border-radius:10px;background:var(--blue);color:#fff;font-weight:900;cursor:pointer}.divider{display:flex;align-items:center;gap:12px;color:#8b9bad;font-size:11px;margin:20px 0}.divider:before,.divider:after{content:"";height:1px;background:var(--line);flex:1}.google{width:100%;height:48px;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit;font-size:13px;font-weight:850;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer}.google-mark{font-size:18px;font-weight:950;color:#4285f4}.message{display:none;margin:14px 0 0;padding:11px 12px;border-radius:10px;background:#eef6ff;color:#35536f;font-size:11px;line-height:1.5}.login{font-size:12px;color:var(--muted);margin-top:20px}.login a{color:var(--blue);font-weight:850}a{text-decoration:none;color:inherit}@media(max-width:600px){.top{height:66px;padding:0 14px}.logo{font-size:23px}}</style></head><body><header class="top"><a class="back" href="login.html">‹</a><a class="logo" href="index.html">Link<b>Story</b></a></header><main><section class="box"><span class="eyebrow">LINKSTORY</span><h1>Criar conta.</h1><p class="intro">Crie seu espaço para ler, salvar histórias e publicar seus próprios mangás.</p><div class="form"><label>Nome</label><input id="name" placeholder="Seu nome" autocomplete="name"><label>E-mail</label><input id="email" type="email" placeholder="seu@email.com" autocomplete="email"><label>Senha</label><input id="password" type="password" placeholder="Crie uma senha" autocomplete="new-password"><button class="primary" id="createAccount" type="button">Criar conta</button><div class="divider">ou</div><button class="google" id="googleSignup" type="button"><span class="google-mark">G</span> Criar conta com Google</button><div class="message" id="message"></div></div><p class="login">Já tem uma conta? <a href="login.html">Entrar</a></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js"></script><script>const msg=document.getElementById('message');function show(text){msg.textContent=text;msg.style.display='block'}document.getElementById('googleSignup').onclick=async()=>{show('Abrindo o Google…');const{error}=await signInWithGoogle();if(error)show(error.message.includes('provider is not enabled')?'O cadastro com Google ainda precisa ser ativado no painel do LinkStory.':'Não foi possível abrir o Google agora. Tente novamente.')};document.getElementById('createAccount').onclick=async()=>{const name=document.getElementById('name').value.trim(),email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!name||!email||!password)return show('Preencha nome, e-mail e senha.');if(password.length<6)return show('A senha precisa ter pelo menos 6 caracteres.');const{data,error}=await signUpWithEmail(email,password,name);if(error)return show(error.message);if(data.session){location.href='index.html'}else show('Conta criada! Verifique seu e-mail para confirmar a conta e depois entre no LinkStory.');};getLinkStorySession().then(({data})=>{if(data.session)location.href='index.html'});</script></body></html>
