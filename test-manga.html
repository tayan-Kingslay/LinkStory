<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b72e7"><title>Mangá de teste — LinkStory</title>
<style>:root{--blue:#0b72e7;--dark:#142033;--muted:#687386;--line:#e5eaf0;--soft:#f7f9fc}*{box-sizing:border-box}body{margin:0;background:var(--soft);color:var(--dark);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.top{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 5%;position:sticky;top:0;z-index:5}.logo{font-size:23px;text-decoration:none;color:var(--dark);font-weight:950}.logo b{color:var(--blue)}.wrap{width:min(900px,92%);margin:auto;padding:30px 0 60px}.badge{display:inline-block;background:#edf6ff;color:var(--blue);font-size:10px;font-weight:850;letter-spacing:.12em;padding:7px 9px;border-radius:99px}.cover{margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}.cover img{display:block;width:100%;max-height:420px;object-fit:contain;background:#f0f3f7}.info{padding:22px}.info h1{font-size:34px;letter-spacing:-1px;margin:0 0 6px}.author{color:var(--muted);font-size:13px}.desc{color:#3e4b5d;line-height:1.6;font-size:14px;margin:16px 0 0}.chapter{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px}.chapter h2{margin:4px 0 4px;font-size:22px}.chapter p{color:var(--muted);font-size:13px}.reader{margin-top:16px;background:#111;border-radius:14px;overflow:hidden}.reader img{display:block;width:100%;height:auto}.nav{display:flex;justify-content:space-between;gap:10px;margin-top:14px}.btn{border:1px solid var(--line);background:#fff;color:var(--dark);border-radius:11px;padding:11px 15px;font-weight:800}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.danger{margin-top:18px;color:#a52f2f;font-size:12px;text-align:center}.danger button{border:0;background:none;color:#a52f2f;font-weight:800}.empty{padding:45px 10px;text-align:center;color:var(--muted)}@media(max-width:600px){.wrap{padding-top:22px}.info h1{font-size:28px}.chapter{padding:17px}}</style>
</head><body><header class="top"><a class="logo" href="criar-manga-teste.html"><span>Link</span><b>Story</b></a></header><main class="wrap" id="app"><div class="empty">Carregando mangá de teste…</div></main>
<script>
const id=new URLSearchParams(location.search).get("id"),app=document.getElementById("app");function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open("LinkStoryTest",1);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains("manga"))db.createObjectStore("manga",{keyPath:"id"});if(!db.objectStoreNames.contains("pages")){const s=db.createObjectStore("pages",{keyPath:"id"});s.createIndex("mangaId","mangaId")}};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}function get(store,key){return openDB().then(db=>new Promise((res,rej)=>{const q=db.transaction(store).objectStore(store).get(key);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)}))}function getPages(mangaId){return openDB().then(db=>new Promise((res,rej)=>{const q=db.transaction("pages").objectStore("pages").index("mangaId").getAll(mangaId);q.onsuccess=()=>res(q.result.sort((a,b)=>a.order-b.order));q.onerror=()=>rej(q.error)}))}async function load(){if(!id){app.innerHTML='<div class="empty">Mangá de teste não encontrado.<br><br><a href="criar-manga-teste.html">Criar outro teste</a></div>';return}try{const m=await get("manga",id),pages=await getPages(id);if(!m){app.innerHTML='<div class="empty">Este teste não existe mais.</div>';return}app.innerHTML=`<span class="badge">MODO DE TESTE</span><div class="cover">${m.cover?`<img src="${m.cover}" alt="Capa de ${esc(m.title)}">`:''}<div class="info"><h1>${esc(m.title)}</h1><div class="author">Por ${esc(m.author)} · ${esc(m.genre)} · ${esc(m.rating)}</div><div class="desc">${esc(m.description)}</div></div></div><section class="chapter"><span class="badge">CAPÍTULO ${esc(m.chapterNumber)}</span><h2>${esc(m.chapterTitle)}</h2><p>${pages.length} página${pages.length===1?'':'s'} · ordem definida pelo autor</p><div class="reader" id="reader"></div><div class="nav"><button class="btn" id="prev">← Anterior</button><strong id="counter" style="align-self:center;font-size:12px"></strong><button class="btn primary" id="next">Próxima →</button></div></section><div class="danger"><button id="delete">Apagar este teste</button></div>`;let pos=0;const reader=document.getElementById("reader"),counter=document.getElementById("counter"),prev=document.getElementById("prev"),next=document.getElementById("next");function show(){const p=pages[pos];reader.innerHTML=p?`<img src="${p.data}" alt="Página ${p.order}">`:'<div class="empty">Nenhuma página.</div>';counter.textContent=pages.length?`${pos+1} / ${pages.length}`:'0 / 0';prev.disabled=pos===0;next.disabled=pos===pages.length-1}prev.onclick=()=>{if(pos>0){pos--;show();window.scrollTo({top:document.querySelector('.reader').offsetTop-80,behavior:'smooth'})}};next.onclick=()=>{if(pos<pages.length-1){pos++;show();window.scrollTo({top:document.querySelector('.reader').offsetTop-80,behavior:'smooth'})}};show();document.getElementById("delete").onclick=async()=>{const db=await openDB(),tx=db.transaction(["manga","pages"],"readwrite");tx.objectStore("manga").delete(id);pages.forEach(p=>tx.objectStore("pages").delete(p.id));tx.oncomplete=()=>location.href="criar-manga-teste.html"}}catch(e){console.error(e);app.innerHTML='<div class="empty">Não foi possível abrir o teste neste navegador.</div>'}}function esc(v){return String(v??"").replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]))}load();</script></body></html>
