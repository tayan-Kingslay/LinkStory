ht:520px}}@media(max-width:760px){.intro{display:block}.publish{margin-top:18px}.stats{grid-template-columns:1fr}.stat{border-right:0;border-bottom:1px solid var(--l)}.stat:last-child{border-bottom:0}.works{grid-template-columns:1fr}.work{grid-template-columns:82px 1fr}.cover{width:82px}}/* LinkStory mobile-first visual system */
:root{--ls-blue:#0b72e7;--ls-deep:#07111f;--ls-ink:#101a28;--ls-muted:#77869a;--ls-line:#e7ebf0;--ls-soft:#f5f7fa}

/* AT3 — Meu Estúdio: acabamento Liquid Glass (somente visual) */
#at3-studio-finish{}
:root{
  --studio-glass:rgba(255,255,255,.72);
  --studio-stroke:rgba(214,225,238,.72);
  --studio-shadow:0 14px 38px rgba(25,54,86,.075);
}
body{
  background:
    radial-gradient(ellipse at 12% 4%,rgba(11,114,231,.075),transparent 34%),
    radial-gradient(ellipse at 92% 24%,rgba(110,170,235,.08),transparent 32%),
    #f4f7fb!important;
}
.topbar{
  background:rgba(255,255,255,.68)!important;
  border:1px solid rgba(255,255,255,.82)!important;
  backdrop-filter:blur(24px) saturate(165%)!important;
  -webkit-backdrop-filter:blur(24px) saturate(165%)!important;
  box-shadow:0 8px 30px rgba(18,45,76,.08)!important;
}
.back,.menu-btn{
  background:rgba(255,255,255,.7)!important;
  border-color:rgba(210,222,236,.8)!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 3px 10px rgba(20,45,75,.045);
  transition:transform .2s ease,background .2s ease,box-shadow .2s ease;
}
.back:hover,.menu-btn:hover{transform:translateY(-1px);background:#fff!important;box-shadow:0 6px 16px rgba(20,45,75,.09)}
main{padding-top:42px!important}
.intro{align-items:center!important;margin-bottom:28px!important}
.intro>div{min-width:0}
h1{line-height:1.02!important}
.subtitle{line-height:1.6!important}
.publish{
  border:1px solid rgba(255,255,255,.35)!important;
  border-radius:14px!important;
  background:linear-gradient(135deg,#1684f5,#0864d5)!important;
  box-shadow:0 9px 22px rgba(11,114,231,.22),inset 0 1px 0 rgba(255,255,255,.28);
  transition:transform .2s ease,box-shadow .2s ease;
}
.publish:hover{transform:translateY(-2px);box-shadow:0 13px 28px rgba(11,114,231,.27)}
.stats{
  gap:10px!important;
  border:0!important;
  background:transparent!important;
  margin-bottom:42px!important;
}
.stat{
  min-width:0;
  border:1px solid var(--studio-stroke)!important;
  border-radius:18px!important;
  padding:20px 22px!important;
  background:var(--studio-glass)!important;
  backdrop-filter:blur(18px) saturate(150%);
  -webkit-backdrop-filter:blur(18px) saturate(150%);
  box-shadow:var(--studio-shadow),inset 0 1px 0 rgba(255,255,255,.92);
}
.stat:last-child{border-right:1px solid var(--studio-stroke)!important}
.stat strong{font-size:28px!important;letter-spacing:-1px;color:#102c4b}
.stat span{font-size:11px!important;letter-spacing:.25px}
.section-head{margin-bottom:17px!important}
.section-head h2{font-size:26px!important;letter-spacing:-1px}
.works{gap:16px!important}
.work{
  min-width:0;
  align-items:start;
  border:1px solid var(--studio-stroke)!important;
  border-radius:19px!important;
  padding:14px!important;
  background:rgba(255,255,255,.74)!important;
  backdrop-filter:blur(18px) saturate(145%);
  -webkit-backdrop-filter:blur(18px) saturate(145%);
  box-shadow:0 10px 30px rgba(20,48,78,.065),inset 0 1px 0 rgba(255,255,255,.95)!important;
  transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease;
}
.work:hover{transform:translateY(-2px);border-color:rgba(11,114,231,.22)!important;box-shadow:0 16px 34px rgba(20,48,78,.095),inset 0 1px 0 #fff!important}
.cover{
  border:1px solid rgba(210,226,244,.8);
  border-radius:13px!important;
  background:linear-gradient(145deg,#eaf4ff,#dcecff)!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 5px 14px rgba(24,64,104,.08);
}
.cover img{display:block;border-radius:12px}
.info{min-width:0}
.info h3{overflow-wrap:anywhere;letter-spacing:-.45px}
.meta{overflow-wrap:anywhere;line-height:1.75!important}
.actions{gap:8px!important}
.actions .btn{
  min-height:40px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border-radius:11px!important;
  border-color:rgba(210,223,238,.95)!important;
  background:rgba(255,255,255,.78)!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95);
  transition:transform .18s ease,background .18s ease,border-color .18s ease;
}
.actions .btn:hover{transform:translateY(-1px);background:#fff!important;border-color:rgba(11,114,231,.32)!important}
.actions .btn.primary{background:linear-gradient(135deg,#1684f5,#0864d5)!important;border-color:transparent!important;color:#fff!important;box-shadow:0 5px 13px rgba(11,114,231,.17)}
.actions .btn[style*="b02e2e"]{color:#a73535!important;background:rgba(255,247,247,.86)!important;border-color:rgba(226,177,177,.72)!important}
.actions .btn:disabled{opacity:.6;transform:none}
.empty{
  border:1px dashed rgba(147,174,205,.7)!important;
  border-radius:20px!important;
  background:rgba(255,255,255,.68)!important;
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 10px 28px rgba(20,48,78,.045);
}
.empty a{border-radius:12px!important;box-shadow:0 7px 17px rgba(11,114,231,.18)}
.menu-dialog{
  background:rgba(248,251,255,.88)!important;
  backdrop-filter:blur(28px) saturate(160%)!important;
  -webkit-backdrop-filter:blur(28px) saturate(160%)!important;
  box-shadow:-18px 0 55px rgba(12,34,58,.16);
}
.menu-wrap{background:transparent}
.menu-head{border-color:rgba(210,223,238,.8)!important}
.menu-list a{border-color:rgba(210,223,238,.7)!important;transition:padding .18s ease,color .18s ease}
.menu-list a:hover{padding-left:9px;color:var(--b)}
@media(min-width:761px){
  .stats{grid-template-columns:repeat(3,minmax(0,1fr))!important}
}
@media(max-width:760px){
  main{padding-top:30px!important}
  .intro{display:flex!important;flex-direction:column;align-items:stretch!important;gap:16px!important}
  .intro h1{font-size:clamp(38px,10vw,48px)!important}
  .publish{align-self:flex-start}
  .stats{grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:8px!important;margin-bottom:32px!important}
  .stat{padding:14px 10px!important;border:1px solid var(--studio-stroke)!important;border-radius:15px!important}
  .stat strong{font-size:23px!important}
  .stat span{font-size:10px!important;line-height:1.35;display:block}
  .works{grid-template-columns:minmax(0,1fr)!important}
  .work{grid-template-columns:86px minmax(0,1fr)!important;gap:12px!important;padding:11px!important}
  .cover{width:86px!important}
  .info h3{font-size:17px!important}
  .actions .btn{min-height:42px;padding:8px 9px!important}
}
@media(max-width:380px){
  .stats{gap:6px!important}
  .stat{padding:12px 7px!important}
  .stat strong{font-size:20px!important}
  .work{grid-template-columns:74px minmax(0,1fr)!important;gap:10px!important}
  .cover{width:74px!important}
  .actions{gap:6px!important}
  .actions .btn{font-size:10px!important;padding:7px!important}
}
@media(prefers-reduced-motion:reduce){
  .back,.menu-btn,.publish,.work,.actions .btn,.menu-list a{transition:none!important}
  .work:hover,.publish:hover,.actions .btn:hover{transform:none!important}
}

</head><body><header class="topbar"><a class="back" href="index.html">‹</a><a class="logo" href="index.html">Link<b>Story</b></a><button class="menu-btn" id="openMenu" aria-label="Abrir menu"></button></header><dialog class="menu-dialog" id="menuDialog"><div class="menu-wrap"><div class="menu-head"><strong>LINKSTORY</strong><button class="close" id="closeMenu">×</button></div><nav class="menu-list"><a href="profile.html">Perfil <strong>›</strong></a><a href="studio.html">Meu Estúdio <strong>›</strong></a><a href="publish.html">Publicar mangá <strong>›</strong></a><a href="settings.html">Configurações <strong>›</strong></a><a href="login.html">Entrar <strong>›</strong></a></nav></div></dialog><main><section class="intro"><div><span class="ey">ÁREA DO CRIADOR</span><h1>Meu Estúdio.</h1><p class="subtitle">Aqui aparecem somente suas obras reais.</p></div><a class="publish" href="publish.html">＋ Publicar novo mangá</a></section><section class="stats"><div class="stat"><strong id="worksCount">0</strong><span>Obras publicadas</span></div><div class="stat"><strong id="chaptersCount">0</strong><span>Capítulos publicados</span></div><div class="stat"><strong id="likesCount">0</strong><span>Curtidas recebidas</span></div></section><section><div class="section-head"><div><span class="ey">CRIAÇÕES</span><h2>Minhas obras</h2></div></div><div id="works" class="works"><div class="empty" style="grid-column:1/-1"><strong>Carregando suas obras…</strong></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js"></script><script src="manga-db.js"></script><script>const d=document.getElementById('menuDialog');document.getElementById('openMenu').onclick=()=>d.showModal();document.getElementById('closeMenu').onclick=()=>d.close();d.addEventListener('click',e=>{if(e.target===d)d.close()});(async()=>{const box=document.getElementById('works');try{const s=await LinkStoryManga.session();if(!s){box.innerHTML='<div class="empty" style="grid-column:1/-1"><strong>Entre na sua conta.</strong><p>Seu Estúdio mostra apenas as obras ligadas à sua conta.</p><a href="login.html">Entrar</a></div>';return}const profile=await LinkStoryManga.currentProfile();if(profile?.role!=='criador'){document.querySelector('.intro').innerHTML='<div><span class="ey">ÁREA DO CRIADOR</span><h1>Acesso exclusivo.</h1><p class="subtitle">Seu Estúdio está disponível somente para contas Criador.</p><a class="publish" href="settings.html">Alterar tipo de conta</a></div>';document.querySelector('.stats').hidden=true;box.innerHTML='';return}const all=await LinkStoryManga.publishedMangas(),ms=all.filter(m=>m.creator_id===s.user.id);document.getElementById('worksCount').textContent=ms.length;let chaptersTotal=0,likesTotal=0;if(!ms.length){box.innerHTML='<div class="empty" style="grid-column:1/-1"><strong>Nenhuma obra publicada ainda.</strong><p>Quando você publicar seu primeiro mangá, ele aparecerá aqui.</p><a href="publish.html">Publicar mangá</a></div>';return}box.innerHTML='';for(const m of ms){const cs=await LinkStoryManga.chapters(m.id);const st=await LinkStoryManga.stats(m.id);chaptersTotal+=cs.length;likesTotal+=st.likes||0;const el=document.createElement('article');el.className='work';el.innerHTML='<a class="cover" href="manga.html?id='+m.id+'">'+(m.cover_url?'<img loading="lazy" decoding="async" src="'+m.cover_url+'" alt="" style="width:100%;height:100%;object-fit:cover">':m.title)+'</a><div class="info"><span class="ey">MANGÁ</span><h3>'+m.title+'</h3><div class="meta">'+(m.genres||'Mangá')+'<br>'+cs.length+' capítulo(s) · '+(st.likes||0)+' curtida(s)'+(st.average?'<br>Avaliação média: '+st.average.toFixed(1):'')+'</div><div class="actions"><a class="btn primary" href="manga.html?id='+encodeURIComponent(m.id)+'">Abrir mangá</a><a class="btn" href="editar-manga.html?id='+encodeURIComponent(m.id)+'">Editar mangá</a><a class="btn" href="publish.html?manga_id='+encodeURIComponent(m.id)+'">＋ Próximo capítulo</a><a class="btn" href="desempenho.html?id='+encodeURIComponent(m.id)+'">Análise</a><button class="btn" type="button" data-delete-manga="'+encodeURIComponent(m.id)+'" data-title="'+String(m.title||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;')+'" style="color:#b02e2e;border-color:#efcaca">Apagar mangá</button></div></div>';box.appendChild(el)}box.addEventListener('click',async e=>{const btn=e.target.closest('[data-delete-manga]');if(!btn)return;const id=decodeURIComponent(btn.dataset.deleteManga),title=btn.dataset.title||'este mangá';if(!confirm('Apagar "'+title+'" definitivamente? Esta ação não pode ser desfeita.'))return;btn.disabled=true;btn.textContent='Apagando…';try{await LinkStoryManga.deleteManga(id);eliminateCard(btn);document.getElementById('worksCount').textContent=Math.max(0,Number(document.getElementById('worksCount').textContent)-1);box.querySelectorAll('.work').length===0&&(box.innerHTML='<div class="empty" style="grid-column:1/-1"><strong>Nenhuma obra publicada ainda.</strong><p>Quando você publicar seu primeiro mangá, ele aparecerá aqui.</p><a href="publish.html">Publicar mangá</a></div>')}catch(err){alert(err.message==='NOT_OWNER'?'Você não tem permissão para apagar esta obra.':err.message==='DELETE_NOT_ALLOWED'?'Não foi possível apagar esta obra. Verifique se ela ainda pertence à sua conta.':'Falha ao apagar: '+(err.message||'tente novamente.'));btn.disabled=false;btn.textContent='Apagar mangá'}});function eliminateCard(btn){btn.closest('.work')?.remove()}document.getElementById('chaptersCount').textContent=chaptersTotal;document.getElementById('likesCount').textContent=likesTotal}catch(e){console.error(e);box.innerHTML='<div class="empty" style="grid-column:1/-1"><strong>Não foi possível carregar o Estúdio.</strong><p>Tente recarregar a página.</p></div>'}})();</script><script src="menu-button.js?v=1"></script></body></html>
