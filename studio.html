<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b72e7"><title>Meu Estúdio — LinkStory</title><style>:root{--b:#0b72e7;--i:#102033;--m:#66788d;--l:#dbe5ef;--s:#f5f9fd}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--i);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{text-decoration:none;color:inherit}.topbar{height:68px;display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--l);background:#fff;position:sticky;top:0;z-index:10}.back,.menu-btn{width:42px;height:42px;border:1px solid var(--l);border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center}.back{font-size:25px}.menu-btn{margin-left:auto;font-size:0}.menu-btn:before{content:"";width:18px;height:14px;background:linear-gradient(var(--i) 0 2px,transparent 2px 6px,var(--i) 6px 8px,transparent 8px 12px,var(--i) 12px 14px);display:block}.logo{font-size:24px;font-weight:950;letter-spacing:-1.6px}.logo b{color:var(--b)}main{width:min(1060px,calc(100% - 28px));margin:auto;padding:38px 0 90px}.intro{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:30px}.ey{font-size:11px;font-weight:900;letter-spacing:2.4px;color:var(--b)}h1{font-size:clamp(42px,6vw,64px);letter-spacing:-3.5px;line-height:.95;margin:8px 0}.subtitle{font-size:14px;color:var(--m);margin:0}.publish{display:inline-flex;align-items:center;gap:8px;background:var(--b);color:#fff;padding:12px 16px;border-radius:10px;font-size:12px;font-weight:900}.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--l);border-bottom:1px solid var(--l);margin-bottom:38px}.stat{padding:18px;border-right:1px solid var(--l)}.stat:last-child{border-right:0}.stat strong{display:block;font-size:24px;margin-bottom:4px}.stat span{font-size:11px;color:var(--m)}.section-head{display:flex;align-items:end;justify-content:space-between;margin-bottom:15px}.section-head h2{font-size:24px;margin:6px 0}.section-link{color:var(--b);font-size:12px;font-weight:900}.works{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.work{display:grid;grid-template-columns:110px 1fr;gap:16px;border:1px solid var(--l);border-radius:15px;padding:13px;background:#fff}.cover{width:110px;aspect-ratio:3/4;border-radius:10px;background:#eaf4ff;display:grid;place-items:center;overflow:hidden;color:#1b4f7e;font-size:12px;font-weight:950;text-align:center}.info h3{margin:3px 0 5px;font-size:19px}.meta{color:var(--m);font-size:11px;line-height:1.6}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.btn{border:1px solid var(--l);border-radius:9px;padding:8px 10px;color:var(--b);background:#fff;font-size:11px;font-weight:900}.btn.primary{background:var(--b);border-color:var(--b);color:#fff}.empty{border:1px dashed var(--l);border-radius:16px;padding:50px 22px;text-align:center;color:var(--m)}.empty strong{display:block;color:var(--i);font-size:17px;margin-bottom:7px}.empty p{font-size:13px;line-height:1.5;max-width:520px;margin:0 auto 18px}.empty a{display:inline-flex;padding:11px 16px;border-radius:10px;background:var(--b);color:#fff;font-size:12px;font-weight:900}.menu-dialog{width:min(100%,520px);height:100dvh;max-height:none;margin:0 0 0 auto;border:0;padding:0;background:#fff}.menu-wrap{height:100%;padding:24px 20px}.menu-head{display:flex;align-items:center;justify-content:space-between;padding-bottom:18px;border-bottom:1px solid var(--l)}.menu-head strong{color:var(--b);letter-spacing:3px}.close{border:0;background:none;font-size:34px}.menu-list{display:grid}.menu-list a{display:flex;justify-content:space-between;padding:16px 2px;border-bottom:1px solid var(--l);font-size:16px;font-weight:850}.menu-list strong{color:#71879d;font-size:22px;font-weight:400}@media(min-width:801px){.menu-dialog{border-radius:18px;margin:18px;max-height:calc(100dvh - 36px);height:auto}.menu-wrap{min-height:520px}}@media(max-width:760px){.intro{display:block}.publish{margin-top:18px}.stats{grid-template-columns:1fr}.stat{border-right:0;border-bottom:1px solid var(--l)}.stat:last-child{border-bottom:0}.works{grid-template-columns:1fr}.work{grid-template-columns:82px 1fr}.cover{width:82px}}/* LinkStory mobile-first visual system */
:root{--ls-blue:#0b72e7;--ls-deep:#07111f;--ls-ink:#101a28;--ls-muted:#77869a;--ls-line:#e7ebf0;--ls-soft:#f5f7fa}
body{background:#f7f8fa!important;color:var(--ls-ink)!important;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif!important}
.top,.topbar{height:62px!important;padding:0 14px!important;background:rgba(255,255,255,.78)!important;border:1px solid rgba(220,227,235,.8)!important;backdrop-filter:blur(18px)!important;position:sticky!important;top:10px!important;margin:0 10px!important;width:calc(100% - 20px)!important;border-radius:15px!important;box-shadow:0 8px 28px rgba(16,32,51,.07)!important;z-index:20!important}
.back,.menu,.menu-btn{width:38px!important;height:38px!important;border-radius:11px!important;border:1px solid var(--ls-line)!important;background:#fff!important;color:var(--ls-ink)!important}
.brand,.logo{font-size:21px!important;letter-spacing:-1.3px!important}
main{width:calc(100% - 28px)!important;padding:28px 0 70px!important}
.btn,.primary,.publish,.edit{border-radius:12px!important;min-height:46px;transition:.2s ease}
.btn:hover,.publish:hover,.edit:hover{transform:translateY(-1px)}
.card,.form,.social,.empty,.work,.settings-menu,.theme-option{border-radius:16px!important;box-shadow:0 8px 26px rgba(16,32,51,.05)}
h1{font-size:42px!important;letter-spacing:-2.5px!important}
h2{letter-spacing:-.8px}
.ey,.eyebrow{letter-spacing:2.5px!important}
@media(max-width:600px){
  .top,.topbar{top:8px!important}
  .cover-shell{width:min(290px,78vw)!important}
  .stats{border:0!important;background:#fff;border-radius:16px;padding:6px!important;box-shadow:0 8px 26px rgba(16,32,51,.05)}
  .stat{padding:15px!important;border-bottom:1px solid var(--ls-line)!important}
  .stat:last-child{border-bottom:0!important}
  .section{margin-top:28px!important}
  .work{padding:10px!important}
  .actions{gap:8px!important}
  .actions .btn{min-height:44px}
  .layout{gap:10px!important}
  .settings-menu{box-shadow:none!important}
  .appearance-options{grid-template-columns:1fr 1fr!important}
  .theme-preview{height:112px!important}
  .menu-dialog{border-radius:0!important}
}
</style></head><body><header class="topbar"><a class="back" href="index.html">‹</a><a class="logo" href="index.html">Link<b>Story</b></a><button class="menu-btn" id="openMenu" aria-label="Abrir menu"></button></header><dialog class="menu-dialog" id="menuDialog"><div class="menu-wrap"><div class="menu-head"><strong>LINKSTORY</strong><button class="close" id="closeMenu">×</button></div><nav class="menu-list"><a href="profile.html">Perfil <strong>›</strong></a><a href="studio.html">Meu Estúdio <strong>›</strong></a><a href="publish.html">Publicar mangá <strong>›</strong></a><a href="settings.html">Configurações <strong>›</strong></a><a href="login.html">Entrar <strong>›</strong></a></nav></div></dialog><main><section class="intro"><div><span class="ey">ÁREA DO CRIADOR</span><h1>Meu Estúdio.</h1><p class="subtitle">Aqui aparecem somente suas obras reais.</p></div><a class="publish" href="publish.html">＋ Publicar novo mangá</a></section><section class="stats"><div class="stat"><strong id="worksCount">0</strong><span>Obras publicadas</span></div><div class="stat"><strong id="chaptersCount">0</strong><span>Capítulos publicados</span></div><div class="stat"><strong id="likesCount">0</strong><span>Curtidas recebidas</span></div></section><section><div class="section-head"><div><span class="ey">CRIAÇÕES</span><h2>Minhas obras</h2></div></div><div id="works" class="works"><div class="empty" style="grid-column:1/-1"><strong>Carregando suas obras…</strong></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js"></script><script src="manga-db.js"></script><script>const d=document.getElementById('menuDialog');document.getElementById('openMenu').onclick=()=>d.showModal();document.getElementById('closeMenu').onclick=()=>d.close();d.addEventListener('click',e=>{if(e.target===d)d.close()});(async()=>{const box=document.getElementById('works');try{const s=await LinkStoryManga.session();if(!s){box.innerHTML='<div class="empty" style="grid-column:1/-1"><strong>Entre na sua conta.</strong><p>Seu Estúdio mostra apenas as obras ligadas à sua conta.</p><a href="login.html">Entrar</a></div>';return}const all=await LinkStoryManga.publishedMangas(),ms=all.filter(m=>m.creator_id===s.user.id);document.getElementById('worksCount').textContent=ms.length;let chaptersTotal=0,likesTotal=0;if(!ms.length){box.innerHTML='<div class="empty" style="grid-column:1/-1"><strong>Nenhuma obra publicada ainda.</strong><p>Quando você publicar seu primeiro mangá, ele aparecerá aqui.</p><a href="publish.html">Publicar mangá</a></div>';return}box.innerHTML='';for(const m of ms){const cs=await LinkStoryManga.chapters(m.id);const st=await LinkStoryManga.stats(m.id);chaptersTotal+=cs.length;likesTotal+=st.likes||0;const el=document.createElement('article');el.className='work';el.innerHTML='<a class="cover" href="manga.html?id='+m.id+'">'+(m.cover_url?'<img src="'+m.cover_url+'" alt="" style="width:100%;height:100%;object-fit:cover">':m.title)+'</a><div class="info"><span class="ey">MANGÁ</span><h3>'+m.title+'</h3><div class="meta">'+(m.genres||'Mangá')+'<br>'+cs.length+' capítulo(s) · '+(st.likes||0)+' curtida(s)'+(st.average?'<br>Avaliação média: '+st.average.toFixed(1):'')+'</div><div class="actions"><a class="btn primary" href="manga.html?id='+m.id+'">Abrir mangá</a><a class="btn" href="publish.html?manga_id='+m.id+'">＋ Próximo capítulo</a></div></div>';box.appendChild(el)}document.getElementById('chaptersCount').textContent=chaptersTotal;document.getElementById('likesCount').textContent=likesTotal}catch(e){console.error(e);box.innerHTML='<div class="empty" style="grid-column:1/-1"><strong>Não foi possível carregar o Estúdio.</strong><p>Tente recarregar a página.</p></div>'}})();</script></body></html>
