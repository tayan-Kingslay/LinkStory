<title>FY — LinkStory</title>
<link rel="icon" type="image/svg+xml" href="assets/linkstory-logo.svg">
<style>
:root{color-scheme:dark;--bg:#080d16;--panel:rgba(17,25,40,.88);--line:rgba(190,211,245,.15);--text:#f5f7fb;--muted:#9aa8bc;--blue:#a9c8ff;--glow:rgba(123,166,255,.18)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{background-image:radial-gradient(rgba(180,205,255,.09) .65px,transparent .65px),linear-gradient(135deg,#070b13 0%,#0a1020 52%,#111020 100%);background-size:8px 8px,100% 100%;padding-bottom:110px}
a{color:inherit;text-decoration:none}button,input,textarea,select{font:inherit}button{cursor:pointer}
.topbar{position:sticky;top:8px;z-index:50;width:calc(100% - 20px);max-width:760px;height:60px;margin:8px auto 0;padding:0 14px;display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:18px;background:rgba(8,12,22,.82);backdrop-filter:blur(20px);box-shadow:0 10px 28px #0004}
.brand{font-size:22px;font-weight:950;letter-spacing:-1.2px}.brand b{color:var(--blue)}.top-actions{margin-left:auto;display:flex;gap:8px}.icon-btn{width:40px;height:40px;border:1px solid var(--line);border-radius:13px;background:#111827;color:#eef4ff}
main{width:min(760px,100%);margin:0 auto;padding:18px 0 36px}
.tabs{position:sticky;top:76px;z-index:30;display:flex;gap:8px;padding:12px 14px;background:rgba(8,12,22,.82);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.tab{flex:1;min-height:40px;border:1px solid var(--line);border-radius:999px;background:#ffffff08;color:#8998ad;font-weight:850;font-size:12px}.tab.active{background:linear-gradient(180deg,#dce8ff,#a9c5ed);border-color:#c7dbff;color:#101725;box-shadow:0 5px 20px var(--glow)}
.composer{margin:14px 14px 16px;padding:15px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(120deg,rgba(21,30,46,.94),rgba(12,17,28,.94));box-shadow:0 12px 35px #0004}
.composer-row{display:flex;gap:11px;align-items:center}.avatar{width:42px;height:42px;flex:0 0 42px;border:1px solid #c5d8ff55;border-radius:50%;background:#1a2940;display:grid;place-items:center;overflow:hidden;font-weight:900;color:#eef4ff}.avatar img{width:100%;height:100%;object-fit:cover}.compose-open{flex:1;min-width:0;text-align:left;border:1px solid var(--line);border-radius:14px;background:#ffffff08;color:#aab7c9;padding:13px 14px;font-size:13px}.compose-actions{display:flex;gap:8px;margin:12px 0 0 53px}.chip{border:1px solid var(--line);border-radius:999px;background:#ffffff08;color:#aab7c9;padding:8px 12px;font-size:11px;font-weight:800}
.post{margin:0 12px 15px;padding:15px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(145deg,rgba(17,24,38,.97),rgba(8,12,20,.97));box-shadow:0 15px 40px #0005}
.post-head{display:flex;align-items:center;gap:10px}.author{min-width:0;flex:1}.author strong{display:block;font-size:13px}.author small{display:block;color:#8492a7;font-size:10px;margin-top:3px}.kind{display:inline-flex;margin-top:6px;padding:4px 8px;border:1px solid var(--line);border-radius:999px;color:#a9c8ff;font-size:9px;font-weight:900;letter-spacing:.4px}
.more{border:0;background:transparent;color:#91a0b6;font-size:22px;padding:4px 8px}.body{white-space:pre-wrap;overflow-wrap:anywhere;color:#e5eaf3;font-size:14px;line-height:1.55;margin:13px 2px}
.idea-title{font-size:17px;font-weight:900;margin:12px 2px 4px}.media{display:block;width:100%;max-height:680px;object-fit:contain;border:1px solid var(--line);border-radius:15px;background:#02050a;margin-top:12px}.post-stats{display:flex;justify-content:space-between;color:#7f8da2;font-size:10px;padding:10px 2px 7px}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;border-top:1px solid #ffffff12;padding-top:9px}.action{min-height:38px;border:0;border-radius:11px;background:transparent;color:#91a0b6;font-size:11px;font-weight:800}.action:hover{background:#ffffff0b;color:#fff}.action.liked{color:#ff8da9}.post.own .actions{grid-template-columns:repeat(5,minmax(0,1fr))}.delete-action{color:#c53d4d!important}.delete-action:disabled{opacity:.55}
.empty,.loading{margin:10px 14px;padding:28px 18px;text-align:center;border:1px dashed var(--line);border-radius:16px;color:var(--muted);font-size:13px;line-height:1.5}.empty strong{display:block;color:#f5f7fb;margin-bottom:5px}.load-more{display:block;margin:14px auto;border:1px solid var(--line);border-radius:999px;background:#ffffff08;color:#dce8ff;padding:11px 20px;font-weight:800}
dialog{width:min(620px,calc(100% - 20px));max-height:90dvh;border:1px solid var(--line);border-radius:20px;padding:0;background:#0e1522;color:var(--text);box-shadow:0 25px 90px #000a}dialog::backdrop{background:#000a;backdrop-filter:blur(7px)}.modal-head{display:flex;align-items:center;justify-content:space-between;padding:17px 18px;border-bottom:1px solid var(--line)}.modal-head strong{font-size:15px}.close{width:34px;height:34px;border:0;border-radius:50%;background:#ffffff12;color:#fff;font-size:22px}.modal-body{padding:17px;overflow:auto;max-height:calc(90dvh - 65px)}.field{display:grid;gap:7px;margin-bottom:13px}.field label{font-size:11px;color:#aab7c9;font-weight:850}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:12px;background:#080e19;color:#f5f7fb;padding:12px;outline:none}.field textarea{min-height:130px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:#a9c8ff88}.file-note{color:#8391a6;font-size:10px;line-height:1.5}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.btn{min-height:42px;border:1px solid var(--line);border-radius:11px;padding:0 16px;background:#ffffff08;color:#dce8ff;font-weight:850}.btn.primary{background:#c5d9ff;color:#101725;border-color:#c5d9ff}.btn:disabled{opacity:.55;cursor:wait}
.comment-list{display:grid;gap:10px;margin-bottom:14px}.comment{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#ffffff06}.comment b{font-size:11px}.comment p{margin:5px 0 0;font-size:12px;line-height:1.45;color:#dce3ee;white-space:pre-wrap}.comment small{color:#8391a6;font-size:9px}.toast{position:fixed;left:50%;bottom:100px;transform:translate(-50%,15px);opacity:0;pointer-events:none;z-index:9999;background:#e4edff;color:#111827;padding:11px 15px;border-radius:12px;font-size:12px;font-weight:800;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:760px){main{padding-top:24px}.topbar{top:12px}.tabs{top:84px;border:1px solid var(--line);border-radius:16px;margin:0 12px}.post{margin-left:12px;margin-right:12px}}
@media(max-width:430px){.tabs{padding:10px 10px}.tab{font-size:11px}.composer{margin-left:10px;margin-right:10px}.post{margin-left:9px;margin-right:9px;padding:13px}.actions{grid-template-columns:repeat(4,minmax(0,1fr))}.action{font-size:10px}}

/* FY aligned with LinkStory's default light visual identity */
:root{color-scheme:light;--bg:#f7f9fc;--panel:#fff;--line:#e2e8f0;--text:#102033;--muted:#66788d;--blue:#0b72e7;--glow:rgba(11,114,231,.12)}
html,body{background:var(--bg)!important;color:var(--text)!important}
body{background-image:linear-gradient(180deg,#fff 0%,#f7f9fc 100%)!important}
.topbar{background:rgba(255,255,255,.88)!important;border-color:var(--line)!important;box-shadow:0 8px 28px rgba(16,32,51,.07)!important}
.brand b{color:var(--blue)!important}
.icon-btn{background:#fff!important;color:var(--text)!important;border-color:var(--line)!important}
.tabs{background:rgba(255,255,255,.92)!important;border-color:var(--line)!important}
.tab{background:#f4f7fb!important;color:#66788d!important;border-color:var(--line)!important}
.tab.active{background:#eaf4ff!important;color:#0758b5!important;border-color:#b9d8fb!important;box-shadow:0 5px 18px var(--glow)!important}
.composer{background:#fff!important;border-color:var(--line)!important;box-shadow:0 8px 26px rgba(16,32,51,.05)!important}
.avatar{background:#eaf4ff!important;color:#0b72e7!important;border-color:#cfe1f2!important}
.compose-open,.chip{background:#f7f9fc!important;color:#66788d!important;border-color:var(--line)!important}
.post{background:#fff!important;border-color:var(--line)!important;box-shadow:0 8px 26px rgba(16,32,51,.06)!important}
.author small,.more,.post-stats,.action{color:#66788d!important}
.kind{color:#0b72e7!important;border-color:#cfe1f2!important}
.body,.comment p{color:#26384b!important}
.actions{border-color:#e8edf3!important}
.action:hover{background:#f2f7fd!important;color:#0b72e7!important}.delete-action{color:#c53d4d!important}
.empty,.loading{color:#66788d!important;border-color:#d5e0eb!important}
.empty strong{color:#102033!important}
.load-more{background:#fff!important;color:#0b72e7!important;border-color:#cfe1f2!important}
dialog{background:#fff!important;color:#102033!important;border-color:#dbe5ef!important;box-shadow:0 25px 90px rgba(16,32,51,.2)!important}
dialog::backdrop{background:rgba(16,32,51,.38)!important}
.modal-head{border-color:#e2e8f0!important}
.close{background:#f1f5f9!important;color:#334155!important}
.field label{color:#52657a!important}
.field input,.field textarea,.field select{background:#fff!important;color:#102033!important;border-color:#dbe5ef!important}
.field input::placeholder,.field textarea::placeholder{color:#8a99aa!important}
.file-note,.comment small{color:#718096!important}
.btn{background:#f7f9fc!important;color:#334155!important;border-color:#dbe5ef!important}
.btn.primary{background:#0b72e7!important;color:#fff!important;border-color:#0b72e7!important}
.comment{background:#f8fafc!important;border-color:#e2e8f0!important}
.toast{background:#102033!important;color:#fff!important}


/* Interações sociais: régua de ações, menus e comentários */
.post-head{gap:10px}
.author{flex:1}
.follow-btn{flex:none;min-height:34px;padding:0 13px;border:1px solid #b9d8fb;border-radius:999px;background:#eaf4ff;color:#0758b5;font-size:11px;font-weight:900}
.follow-btn.following{background:#f7f9fc;border-color:#dbe5ef;color:#52657a}
.post-menu-btn{width:36px;height:36px;border:1px solid var(--line);border-radius:12px;background:#f7f9fc;color:#52657a;font-size:20px}
.post-stats{padding:10px 2px 8px}
.actions,.post.own .actions{display:flex;align-items:center;justify-content:space-around;gap:6px;border-top:1px solid #e8edf3;padding-top:9px}
.action{flex:1;min-width:0;min-height:43px;display:flex;align-items:center;justify-content:center;gap:7px;padding:0 7px;border:1px solid transparent;border-radius:13px;background:transparent;color:#52657a;font-size:11px;font-weight:850}
.action svg{width:19px;height:19px;display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.action .action-count{font-size:11px;font-variant-numeric:tabular-nums}
.action.liked{color:#e23e68;background:#fff2f5}
.action:active,.follow-btn:active,.post-menu-btn:active{transform:scale(.96)}
.comment-list{gap:12px}
.comment{position:relative;display:flex;align-items:flex-start;gap:9px;padding:11px;border-radius:15px;background:#f8fafc;border-color:#e5ebf2;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.comment-avatar{width:34px;height:34px;flex:0 0 34px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:#eaf4ff;color:#0b72e7;font-size:11px;font-weight:900}
.comment-avatar img{width:100%;height:100%;object-fit:cover}
.comment-content{min-width:0;flex:1}
.comment-content b{font-size:12px}
.comment-content p{margin:5px 0 7px;font-size:13px;line-height:1.5;overflow-wrap:anywhere}
.comment-meta{display:flex;align-items:center;gap:9px;color:#7c8b9d;font-size:10px}
.comment-meta button{border:0;background:transparent;color:#0b72e7;font-size:10px;font-weight:850;padding:2px}
.comment-children{display:grid;gap:8px;margin:8px 0 0 27px;padding-left:11px;border-left:2px solid #dceafa}
.comment.is-reply{padding:9px;background:#fff}
.comment-action-dialog,.report-dialog{width:min(360px,calc(100% - 28px));border:1px solid #dbe5ef;border-radius:22px;padding:0;background:#fff;color:#102033;box-shadow:0 22px 70px rgba(16,32,51,.22)}
.comment-action-dialog .modal-head,.report-dialog .modal-head{padding:15px 17px}
.comment-action-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;padding:14px}
.comment-action{min-height:76px;border:1px solid #e2eaf3;border-radius:15px;background:#f8fafc;color:#24384e;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:11px;font-weight:850}
.comment-action svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.comment-action.danger{color:#bd3448;background:#fff7f8;border-color:#f5d9df}
.report-dialog{width:min(440px,calc(100% - 24px))}
.report-dialog .modal-body{max-height:75dvh}
.report-options{display:grid;gap:8px}
.report-option{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid #e4ebf3;border-radius:12px;background:#f9fbfd;font-size:12px;font-weight:700}
.report-option input{accent-color:#0b72e7}
.replying-to{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 11px;margin-bottom:10px;border-radius:11px;background:#eaf4ff;color:#0758b5;font-size:11px;font-weight:800}
.replying-to button{border:0;background:transparent;color:#0758b5;font-size:18px}
#feedList.video-feed{display:grid;gap:14px;scroll-snap-type:y mandatory;scroll-padding-top:10px}
.video-post{min-height:calc(100svh - 180px);scroll-snap-align:start;display:flex;flex-direction:column;justify-content:space-between}
.video-post .media{width:100%;height:min(58svh,620px);max-height:none;object-fit:cover;margin-top:10px;border-radius:16px;background:#080d16}
.video-post .body{margin-top:9px}
.video-post .post-stats{margin-top:auto}
.video-post .actions{flex-shrink:0}
.video-hint{font-size:10px;color:#8290a2;margin:6px 2px 0}
@media(max-width:430px){
 .post-head{gap:7px}.follow-btn{min-height:32px;padding:0 10px;font-size:10px}
 .action{gap:5px;min-height:42px;padding:0 3px;font-size:10px}
 .action svg{width:18px;height:18px}
 .video-post{min-height:calc(100svh - 166px)}
 .video-post .media{height:54svh}
 .comment-children{margin-left:17px;padding-left:8px}
}


/* FY follows the user's selected appearance instead of forcing one palette. */
html[data-ls-theme="light"]{color-scheme:light}
html[data-ls-theme="light"] body:has(.post){--bg:#f4f7fc;--panel:#fff;--panel2:#fff;--line:#dce6f1;--text:#17263a;--muted:#78879a;--blue:#1769d2;--glow:rgba(23,105,210,.12);background:#f4f7fc!important;background-image:none!important;color:#17263a!important}
html[data-ls-theme="light"] body:has(.post) .topbar,html[data-ls-theme="light"] body:has(.post) .tabs{background:rgba(255,255,255,.94)!important;border-color:#dce6f1!important}
html[data-ls-theme="light"] body:has(.post) .post,html[data-ls-theme="light"] body:has(.post) .composer,html[data-ls-theme="light"] body:has(.post) .empty,html[data-ls-theme="light"] body:has(.post) .loading{background:#fff!important;border-color:#dce6f1!important;color:#17263a!important}
html[data-ls-theme="light"] body:has(.post) .body,html[data-ls-theme="light"] body:has(.post) .idea-title,html[data-ls-theme="light"] body:has(.post) .post-head strong{color:#17263a!important}
html[data-ls-theme="light"] body:has(.post) .post-stats,html[data-ls-theme="light"] body:has(.post) .author small,html[data-ls-theme="light"] body:has(.post) .muted{color:#78879a!important}
html[data-ls-theme="light"] body:has(.post) .tab{background:#fff!important;color:#52657b!important;border-color:#dce6f1!important}
html[data-ls-theme="light"] body:has(.post) .tab.active{background:#1769d2!important;color:#fff!important;border-color:#1769d2!important}
html[data-ls-theme="light"] body:has(.post) .compose-open,html[data-ls-theme="light"] body:has(.post) .chip,html[data-ls-theme="light"] body:has(.post) .action{background:#f7faff!important;color:#52657b!important;border-color:#dce6f1!important}
html[data-ls-theme="light"] body:has(.post) .field input,html[data-ls-theme="light"] body:has(.post) .field textarea,html[data-ls-theme="light"] body:has(.post) .field select{background:#fff!important;color:#17263a!important;border-color:#dce6f1!important}


/* Post action icons: each symbol gets its own aligned square */
.actions,.post.own .actions{
 display:grid!important;
 grid-template-columns:repeat(4,minmax(0,1fr))!important;
 align-items:stretch!important;
 justify-content:initial!important;
 gap:7px!important;
}
.post.own .actions{grid-template-columns:repeat(5,minmax(0,1fr))!important}
.actions .action{
 min-width:0!important;min-height:70px!important;width:100%!important;
 padding:5px 2px!important;border:1px solid transparent!important;
 border-radius:13px!important;background:transparent!important;
 display:flex!important;flex-direction:column!important;
 align-items:center!important;justify-content:center!important;gap:5px!important;
 color:#63748a!important;font-size:10px!important;font-weight:800!important;
 line-height:1.1!important;white-space:nowrap!important;
}
.action-icon{
 width:38px;height:38px;flex:0 0 38px;
 display:grid;place-items:center;
 border:1px solid #dce6f1;border-radius:12px;
 background:linear-gradient(145deg,#fff,#f1f6fc);
 color:#49627f;
 box-shadow:0 3px 9px rgba(25,55,92,.055);
}
.action-icon svg{display:block;width:19px!important;height:19px!important;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.actions .action:hover{background:#f5f9ff!important;border-color:#e4edf8!important;color:#1769d2!important}
.actions .action:active{transform:scale(.96)}
.actions .action.liked{color:#df4168!important;background:#fff5f7!important}
.actions .action.liked .action-icon{color:#df4168;background:#fff0f3;border-color:#f5cbd6}
.actions .action.delete-action{color:#bd3448!important}
.actions .action.delete-action .action-icon{color:#bd3448;background:#fff7f8;border-color:#f3d7dd}
@media(max-width:430px){
 .actions,.post.own .actions{gap:4px!important}
 .actions .action{min-height:66px!important;font-size:9px!important}
 .action-icon{width:35px;height:35px;flex-basis:35px;border-radius:11px}
 .action-icon svg{width:18px!important;height:18px!important}
}
html[data-ls-theme="dark"] .actions .action{color:#a9b8cc!important}
html[data-ls-theme="dark"] .action-icon{background:linear-gradient(145deg,#1d2a3b,#131e2d);border-color:#34465d;color:#c5d7ef;box-shadow:0 3px 10px #0003}
html[data-ls-theme="dark"] .actions .action:hover{background:#1b2a3d!important;border-color:#344b68!important;color:#dceaff!important}
html[data-ls-theme="dark"] .actions .action.liked{color:#ff9ab3!important;background:#2b1d2a!important}
html[data-ls-theme="dark"] .actions .action.liked .action-icon{background:#38202e;border-color:#744054;color:#ff9ab3}
html[data-ls-theme="dark"] .actions .action.delete-action{color:#ff9ca8!important}
html[data-ls-theme="dark"] .actions .action.delete-action .action-icon{background:#321e27;border-color:#69404b;color:#ff9ca8}

<body>
<header class="topbar"><a class="brand" href="index.html">Link<b>Story</b></a></header>
<main>
<nav class="tabs" aria-label="Feed"><button class="tab active" data-feed="for-you">Para você</button><button class="tab" data-feed="following">Seguindo</button><button class="tab" data-feed="ideas">Ideias</button><button class="tab" data-feed="videos">Vídeos</button></nav>
<section class="composer" id="composer">
 <div class="composer-row"><div class="avatar" id="myAvatar">LS</div><button class="compose-open" id="openComposer">Compartilhe algo com a comunidade…</button></div>
 <div class="compose-actions"><button class="chip" id="quickPost">＋ Publicação</button><button class="chip" id="quickIdea">✦ Ideia</button><button class="chip" id="quickVideo">▶ Vídeo</button></div>
</section>
<div id="feedStatus" class="loading">Carregando o FY…</div><section id="feedList" aria-live="polite"></section><button class="load-more" id="loadMore" hidden>Carregar mais</button>
</main>
<dialog id="composeDialog"><div class="modal-head"><strong>Nova publicação</strong><button class="close" data-close="composeDialog" aria-label="Fechar">×</button></div><form class="modal-body" id="composeForm">
 <div class="field"><label for="postType">TIPO DE CONTEÚDO</label><select id="postType"><option value="post">Publicação</option><option value="idea">Ideia procurando criador</option><option value="video">Vídeo</option></select></div>
 <div class="field" id="ideaTitleField" hidden><label for="ideaTitle">TÍTULO DA IDEIA</label><input id="ideaTitle" maxlength="120" placeholder="Qual é a ideia da sua história?"></div>
 <div class="field"><label for="postBody">TEXTO</label><textarea id="postBody" maxlength="2000" placeholder="Escreva algo para a comunidade…"></textarea></div>
 <div class="field"><label for="postMedia">IMAGEM OU VÍDEO (OPCIONAL)</label><input id="postMedia" type="file" accept="image/*,video/mp4,video/webm,video/quicktime"><span class="file-note">Até 25 MB. Imagens e vídeos curtos. Não publicamos Stories nesta versão.</span><div id="mediaPreview"></div></div>
 <div class="modal-actions"><button type="button" class="btn" data-close="composeDialog">Cancelar</button><button type="submit" class="btn primary" id="publishPost">Publicar</button></div>
</form></dialog>
<dialog id="commentsDialog"><div class="modal-head"><strong>Comentários</strong><button class="close" data-close="commentsDialog" aria-label="Fechar">×</button></div><div class="modal-body"><div id="commentList" class="comment-list"></div><form id="commentForm"><div class="field"><label for="commentBody">SEU COMENTÁRIO</label><textarea id="commentBody" maxlength="1000" required placeholder="Escreva um comentário…"></textarea></div><div class="modal-actions"><button class="btn primary" type="submit" id="sendComment">Comentar</button></div></form></div></dialog>
<dialog id="commentActionsDialog" class="comment-action-dialog"><div class="modal-head"><strong>Ações do comentário</strong><button class="close" data-close="commentActionsDialog" aria-label="Fechar">×</button></div><div class="comment-action-list">
<button class="comment-action" data-comment-action="like"><svg viewBox="0 0 24 24"><path d="M20.8 8.8c0 5.2-8.8 11-8.8 11s-8.8-5.8-8.8-11a4.7 4.7 0 0 1 8.8-2.1 4.7 4.7 0 0 1 8.8 2.1Z"/></svg><span>Curtir</span></button>
<button class="comment-action" data-comment-action="reply"><svg viewBox="0 0 24 24"><path d="M9 17 4 12l5-5"/><path d="M4 12h9a7 7 0 0 1 7 7"/></svg><span>Responder</span></button>
<button class="comment-action" data-comment-action="share"><svg viewBox="0 0 24 24"><path d="M12 16V3m-5 5 5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg><span>Compartilhar</span></button>
<button class="comment-action danger" data-comment-action="report"><svg viewBox="0 0 24 24"><path d="M12 9v4m0 4h.01"/><path d="M10.3 3.9 2.7 17a2 2 0 0 0 1.7 3h15.2a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg><span>Denunciar</span></button>
</div></dialog>
<dialog id="reportDialog" class="report-dialog"><div class="modal-head"><strong>Denunciar conteúdo</strong><button class="close" data-close="reportDialog" aria-label="Fechar">×</button></div><form class="modal-body" id="reportForm">
<p style="margin:0 0 13px;color:#64758a;font-size:12px">Selecione o motivo que melhor descreve o problema. A denúncia será enviada em particular para análise.</p>
<div class="report-options">
<label class="report-option"><input type="radio" name="reportReason" value="spam" required> Spam ou conteúdo enganoso</label>
<label class="report-option"><input type="radio" name="reportReason" value="harassment"> Assédio ou intimidação</label>
<label class="report-option"><input type="radio" name="reportReason" value="hate"> Discurso de ódio</label>
<label class="report-option"><input type="radio" name="reportReason" value="sexual_content"> Conteúdo sexual</label>
<label class="report-option"><input type="radio" name="reportReason" value="minor_safety"> Segurança de menores</label>
<label class="report-option"><input type="radio" name="reportReason" value="violence"> Violência</label>
<label class="report-option"><input type="radio" name="reportReason" value="self_harm"> Automutilação</label>
<label class="report-option"><input type="radio" name="reportReason" value="copyright"> Direitos autorais</label>
<label class="report-option"><input type="radio" name="reportReason" value="privacy"> Privacidade</label>
<label class="report-option"><input type="radio" name="reportReason" value="other"> Outro motivo</label>
</div>
<div class="field" style="margin-top:12px"><label for="reportDetails">DETALHES (OPCIONAL)</label><textarea id="reportDetails" maxlength="500" placeholder="Conte um pouco mais, se necessário…" style="min-height:78px"></textarea></div>
<div class="modal-actions"><button type="button" class="btn" data-close="reportDialog">Cancelar</button><button type="submit" class="btn primary" id="sendReport">Enviar denúncia</button></div>
</form></dialog>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
<script src="guard.js"></script>
<script src="fy.js"></script>
<script src="global-nav.js"></script>
</body></html>
